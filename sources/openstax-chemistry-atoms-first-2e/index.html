ctIndex\":0,\"hints\":[\"Use $\\\\text{pH} = -\\\\log[H^+]$. For weak acids: $K_a = [H^+][A^-]/[HA]$.\",\"Apply the relevant law or formula step by step. Check units.\",\"The answer is [OH − ] = 3.1 $\\\\times$ 10 −12 M.\"],\"solution\":\"Answer: [OH − ] = 3.1 $\\\\times$ 10 −12 M\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"source:openstax-chemistry-atoms-first-2e\"]},{\"id\":\"openstax-chemistry-atoms-first-2e-ch14-fs-idm102500528\",\"prompt\":\"29 . The odor of vinegar is due to the presence of acetic acid, CH 3 CO 2 H, a weak acid. List, in order of descending concentration, all of the ionic and molecular species present in a 1- M aqueous solution of this acid.\",\"options\":[\"[C 10 H 14 N 2 ] = 0.049 M ;\",\"(a) $K_{\\\\text{a2}}=1.5 \\\\times \\\\mathrm{10}^{−11};$\",\"$$\\\\text{CH}_{3}\\\\text{NH}_{3}^{\\\\text{+}}.$\",\"$$[\\\\text{CH}_{3}\\\\text{CO}_{2}^{\\\\text{−}}]$\"],\"correctIndex\":3,\"hints\":[\"Use $\\\\text{pH} = -\\\\log[H^+]$. For weak acids: $K_a = [H^+][A^-]/[HA]$.\",\"Apply the relevant law or formula step by step. Check units.\",\"The answer is $[\\\\text{CH}_{3}\\\\text{CO}_{2}^{\\\\text{−}}]$.\"],\"solution\":\"Answer: $[\\\\text{CH}_{3}\\\\text{CO}_{2}^{\\\\text{−}}]$\\n\\n[H 2 O] \u003e [CH 3 CO 2 H] \u003e $[\\\\text{H}_{3}\\\\text{O}^{\\\\text{+}}]$ ≈ $[\\\\text{CH}_{3}\\\\text{CO}_{2}^{\\\\text{−}}]$ \u003e [OH − ]\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"source:openstax-chemistry-atoms-first-2e\"]},{\"id\":\"openstax-chemistry-atoms-first-2e-ch14-fs-idp54392720\",\"prompt\":\"35 . What is the ionization constant at 25 °C for the weak acid $\\\\text{CH}_{3}\\\\text{NH}_{3}^{\\\\text{+}},$ the conjugate acid of the weak base CH 3 NH 2 , K b = 4.4 $\\\\times$ 10 −4 .\",\"options\":[\"$$\\\\text{HSO}_{4}^{\\\\text{−}};$\",\"[OH − ] = 4.2 $\\\\times$ 10 −4 M\",\"$$K_{\\\\text{a}}=2.3 \\\\times \\\\mathrm{10}^{−11}$\",\"(a) $K_{\\\\text{a2}}=1.5 \\\\times \\\\mathrm{10}^{−11};$\"],\"correctIndex\":2,\"hints\":[\"Use $\\\\text{pH} = -\\\\log[H^+]$. For weak acids: $K_a = [H^+][A^-]/[HA]$.\",\"Apply the relevant law or formula step by step. Check units.\",\"The answer is $K_{\\\\text{a}}=2.3 \\\\times \\\\mathrm{10}^{−11}$.\"],\"solution\":\"Answer: $K_{\\\\text{a}}=2.3 \\\\times \\\\mathrm{10}^{−11}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"source:openstax-chemistry-atoms-first-2e\"]},{\"id\":\"openstax-chemistry-atoms-first-2e-ch14-fs-idm176650240\",\"prompt\":\"37 . Which base, CH 3 NH 2 or (CH 3 ) 2 NH, is the stronger base? Which conjugate acid, $(\\\\text{CH}_{3})_{2}\\\\text{NH}_{2}^{\\\\text{+}}$ or $\\\\text{CH}_{3}\\\\text{NH}_{3}^{\\\\text{+}}$ , is the stronger acid?\",\"options\":[\"[H 3 O + ] and $[\\\\text{HCO}_{3}^{\\\\text{−}}]$ are practically equal\",\"(a) $K_{\\\\text{a2}}=1.5 \\\\times \\\\mathrm{10}^{−11};$\",\"$$\\\\text{CH}_{3}\\\\text{NH}_{3}^{\\\\text{+}}.$\",\"(a) $K_{\\\\text{b}}=4.3 \\\\times \\\\mathrm{10}^{−12}$\"],\"correctIndex\":2,\"hints\":[\"Use $\\\\text{pH} = -\\\\log[H^+]$. For weak acids: $K_a = [H^+][A^-]/[HA]$.\",\"Apply the relevant law or formula step by step. Check units.\",\"The answer is $\\\\text{CH}_{3}\\\\text{NH}_{3}^{\\\\text{+}}.$.\"],\"solution\":\"Answer: $\\\\text{CH}_{3}\\\\text{NH}_{3}^{\\\\text{+}}.$\\n\\nThe stronger base or stronger acid is the one with the larger K b or K a , respectively. In these two examples, they are (CH 3 ) 2 NH and $\\\\text{CH}_{3}\\\\text{NH}_{3}^{\\\\text{+}}.$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"source:openstax-chemistry-atoms-first-2e\"]},{\"id\":\"openstax-chemistry-atoms-first-2e-ch14-fs-idm117245456\",\"prompt\":\"41 . Predict which compound in each of the following pairs of compounds is more acidic and explain your reasoning for each. (a) $\\\\text{HSO}_{4}^{\\\\text{−}}$ or $\\\\text{HSeO}_{4}^{\\\\text{−}}$ (b) NH 3 or H 2 O (c) PH 3 or HI (d) NH 3 or PH 3 (e) H 2 S or HBr\",\"options\":[\"[H 3 O + ] and $[\\\\text{HCO}_{3}^{\\\\text{−}}]$ are practically equal\",\"$$K_{\\\\text{a}}=2.3 \\\\times \\\\mathrm{10}^{−11}$\",\"(a) $K_{\\\\text{a2}}=1.5 \\\\times \\\\mathrm{10}^{−11};$\",\"$$\\\\text{HSO}_{4}^{\\\\text{−}};$\"],\"correctIndex\":3,\"hints\":[\"Use $\\\\text{pH} = -\\\\log[H^+]$. For weak acids: $K_a = [H^+][A^-]/[HA]$.\",\"Apply the relevant law or formula step by step. Check units.\",\"The answer is $\\\\text{HSO}_{4}^{\\\\text{−}};$.\"],\"solution\":\"Answer: $\\\\text{HSO}_{4}^{\\\\text{−}};$\\n\\n(a) $\\\\text{HSO}_{4}^{\\\\text{−}};$ higher electronegativity of the central ion. (b) H 2 O; NH 3 is a base and water is neutral, or decide on the basis of K a values. (c) HI; PH 3 is weaker than HCl; HCl is weaker than HI. Thus, PH 3 is weaker than HI. (d) PH 3 ; in binary compounds of hydrogen with nonmetals, the acidity increases for the element lower in a group. (e) HBr; in a period, the acidity increases from left to right; in a group, it increases from top to bottom. Br is to the left and below S, so HBr is the stronger acid.\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"source:openstax-chemistry-atoms-first-2e\"]},{\"id\":\"openstax-chemistry-atoms-first-2e-ch14-fs-idm4769600\",\"prompt\":\"48 . Which of the following will increase the percent of NH 3 that is converted to the ammonium ion in water? (a) addition of NaOH (b) addition of HCl (c) addition of NH 4 Cl\",\"options\":[\"$$\\\\text{HSO}_{4}^{\\\\text{−}};$\",\"$$\\\\text{AsO}_{4}^{\\\\text{3−}}$\",\"[H 3 O + ] = 1.5 $\\\\times$ 10 −4 M\",\"(b) The addition of HCl\"],\"correctIndex\":3,\"hints\":[\"Use $\\\\text{pH} = -\\\\log[H^+]$. For weak acids: $K_a = [H^+][A^-]/[HA]$.\",\"Apply the relevant law or formula step by step. Check units.\",\"The answer is (b) The addition of HCl.\"],\"solution\":\"Answer: (b) The addition of HCl\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"source:openstax-chemistry-atoms-first-2e\"]},{\"id\":\"openstax-chemistry-atoms-first-2e-ch14-fs-idp5155408\",\"prompt\":\"50 . What is the effect on the concentrations of $\\\\text{NO}_{2}^{\\\\text{−}},$ HNO 2 , and OH − when the following are added to a solution of KNO 2 in water: (a) HCl (b) HNO 2 (c) NaOH (d) NaCl (e) KNO 2\",\"options\":[\"$$\\\\text{AsO}_{4}^{\\\\text{3−}}$\",\"$$\\\\text{NO}_{2}^{\\\\text{−}}$\",\"[OH − ] = 4.2 $\\\\times$ 10 −4 M\",\"$$K_{\\\\text{a}}=1.2 \\\\times \\\\mathrm{10}^{−2}$\"],\"correctIndex\":1,\"hints\":[\"Use $\\\\text{pH} = -\\\\log[H^+]$. For weak acids: $K_a = [H^+][A^-]/[HA]$.\",\"Apply the relevant law or formula step by step. Check units.\",\"The answer is $\\\\text{NO}_{2}^{\\\\text{−}}$.\"],\"solution\":\"Answer: $\\\\text{NO}_{2}^{\\\\text{−}}$\\n\\n(a) Adding HCl will add H 3 O + ions, which will then react with the OH − ions, lowering their concentration. The equilibrium will shift to the right, increasing the concentration of HNO 2 , and decreasing the concentration of $\\\\text{NO}_{2}^{\\\\text{−}}$ ions. (b) Adding HNO 2 increases the concentration of HNO 2 and shifts the equilibrium to the left, increasing the concentration of $\\\\text{NO}_{2}^{\\\\text{−}}$ ions and decreasing the concentration of OH − ions. (c) Adding NaOH adds OH − ions, which shifts the equilibrium to the left, increasing the concentration of $\\\\text{NO}_{2}^{\\\\text{−}}$ ions and decreasing the concentrations of HNO 2 . (d) Adding NaCl has no effect on the concentrations of the ions. (e) Adding KNO 2 adds $\\\\text{NO}_{2}^{\\\\text{−}}$ ions and shifts the equilibrium to the right, increasing the HNO 2 and OH − ion concentrations.\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"source:openstax-chemistry-atoms-first-2e\"]},{\"id\":\"openstax-chemistry-atoms-first-2e-ch14-fs-idm71105088\",\"prompt\":\"56 . Determine K a for hydrogen sulfate ion, $\\\\text{HSO}_{4}^{\\\\text{−}}.$ In a 0.10- M solution the acid is 29% ionized.\",\"options\":[\"$$K_{\\\\text{a}}=1.2 \\\\times \\\\mathrm{10}^{−2}$\",\"[H 3 O + ] = 1.5 $\\\\times$ 10 −4 M\",\"$$\\\\tim
