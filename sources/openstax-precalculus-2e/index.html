 zero.\n\n$\\begin{array}{c}\\text{  }2 \\sin^{2}θ+\\sin θ=0 \\\\ \\sin θ(2\\sin θ+1)=0 \\\\ \\text{                  }\\sin θ=0 \\\\ \\text{                       }θ=0,π \\\\ \\\\ \\text{         }2 \\sin θ+1=0 \\\\ \\text{                }2\\sin θ=-1 \\\\ \\text{                  }\\sin θ=-\\frac{1}{2} \\\\ \\text{                       }θ=\\frac{7π}{6},\\frac{11π}{6}\\end{array}$58:T51a,The velocity at $t=1$ and $t=3$ is the instantaneous rate of change of distance per time, or velocity. Notice that the initial height is 6 feet. To find the instantaneous velocity, we find the derivative and evaluate it at $t=1$ and $t=3:$ \n\n$\\begin{array}{cc}f^{′}(a)=\\underline{lim} \\frac{f(a+h)-f(a)}{h} \u0026 \\\\ s^{′}(t)=\\underline{lim} \\frac{-16(t+h)^{2}+64(t+h)+6-(-16t^{2}+64t+6)}{h} \u0026 \\text{Substitute }s(t+h)\\text{ and }s(t). \\\\ \\text{        }=\\underline{lim }\\frac{-16t^{2}-32ht-h^{2}+64t+64h+6+16t^{2}-64t-6}{h} \u0026 \\text{Distribute}. \\\\ \\text{        }=\\underline{lim} \\frac{-32ht-h^{2}+64h}{h} \u0026 \\text{Simplify}. \\\\ \\text{        }=\\underline{lim} \\frac{h(-32t-h+64)}{h} \u0026 \\text{Factor the numerator}. \\\\ \\text{        }=\\underline{lim}-32t-h+64 \u0026 \\text{Cancel out the common factor }h. \\\\ s^{′}(t)=-32t+64 \u0026 \\text{Evaluate the limit by letting }h=0.\\end{array}$ \n\nFor any value of $t$ , $s^{′}(t)$ tells us the velocity at that value of $t.$ \n\nEvaluate $t=1$ and $t=3.$ \n\n$\\begin{array}{c}s^{′}(1)=−32(1)+64=32 \\\\ s^{′}(3)=−32(3)+64=−32\\end{array}$\n\nThe velocity of the ball after 1 second is 32 feet per second, as it is on the way up.\n\nThe velocity of the ball after 3 seconds is $−32$ feet per second, as it is on the way down.59:T53a,If $f(x)=x^{2}-100x$ describes the cost of producing $x$ computers, $f^{′}(x)$ will describe the marginal cost. We need to find the derivative. For purposes of calculating the derivative, we can use the following functions:\n\n$\\begin{array}{c}f(x+h)=(x+h)^{2}-100(x+h) \\\\ \\text{      }f(x)=x^{2}-100x\\end{array}$\n\n$\\begin{array}{cc}\\text{    }f^{′}(x)=\\underline{lim}\\frac{f(x+h)-f(x)}{h} \u0026 \\text{Formula for a derivative} \\\\ \\text{             }=\\underline{lim}\\frac{(x+h)^{2}-100(x+h)-(x^{2}-100x)}{h} \u0026 \\text{Substitute }f(x+h)\\text{ and }f(x). \\\\ \\text{             }=\\underline{lim}\\frac{x^{2}+2xh+h^{2}-100x-100h-x^{2}+100x}{h} \u0026 \\text{Multiply polynomials, distribute}. \\\\ \\text{             }=\\underline{lim}\\frac{2xh+h^{2}-100h}{h} \u0026 \\text{Collect like terms}. \\\\ \\text{             }=\\underline{lim}\\frac{h(2x+h-100)}{h} \u0026 \\text{Factor and cancel like terms}. \\\\ \\text{             }=\\underline{lim} 2x+h-100 \u0026 \\text{Simplify}. \\\\ \\text{             }=(2x-100) \u0026 \\text{Evaluate when }h=0. \\\\ \\text{     }f^{′}(x)=2x-100 \u0026 \\text{Formula for marginal "])</script><script>self.__next_f.push([1,"cost} \\\\ f^{′}(200)=2(200)-100=300 \u0026 \\text{Evaluate for 200 units}.\\end{array}$ \n\nThe marginal cost of producing the 201 st unit will be approximately \\$300."])</script><script>self.__next_f.push([1,"51:[\"$\",\"div\",null,{\"className\":\"mt-4 print:hidden\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"text-sm font-semibold text-gray-900 dark:text-gray-100 mb-1\",\"children\":\"Cite this source\"}],[\"$\",\"$L56\",null,{\"source\":{\"slug\":\"openstax-precalculus-2e\",\"title\":\"Precalculus\",\"edition\":\"2e\",\"publisher\":\"OpenStax — Rice University\",\"year\":2026,\"description\":\"Trigonometry, advanced functions, calculus preview. Covers unit circle, trig identities, solving trig equations, law of sines / cosines, limits, continuity, derivatives.\",\"category\":\"math\",\"questionCount\":340,\"bankCount\":23,\"topicCount\":4,\"license\":\"CC-BY-4.0\",\"sourceUrl\":\"https://openstax.org/details/books/precalculus-2e\",\"authors\":[\"Jay Abramson\",\"et al.\"],\"importedAt\":\"2026-05-01\",\"notes\":\"Trigonometry + Limits/Derivatives secti of the circle, where the $(x,y)$ coordinates are (0, 1), as shown in Figure 6 . \\n\\nFigure \\n6 \\n\\nUsing our definitions of cosine and sine, \\n\\n$\\\\begin{array}{c}x=\\\\cos t=\\\\cos(90°)=0 \\\\\\\\ y=\\\\sin t=\\\\sin(90°)=1\\\\end{array}$\\n\\nThe cosine of 90° is 0; the sine of 90° is 1.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-5-2-unit-circle-sine-and-cosine-functions-example-4\",\"prompt\":\"Find Sine and Cosine Evaluate $\\\\cos(\\\\frac{5π}{3})$ using a graphing calculator or computer.\",\"options\":[\"$$(5\\\\times π\\\\div 3)$\",\"$$(-\\\\frac{\\\\sqrt{3}}{2},-\\\\frac{1}{2})$\",\"$$\\\\sin t$\",\"$$225°$\"],\"correctIndex\":0,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Enter the following keystrokes:\\n\\nCOS \\n$(5\\\\times π\\\\div 3)$ \\nENTER \\n$\\\\cos(\\\\frac{5π}{3})=0.5$\",\"The answer is $(5\\\\times π\\\\div 3)$.\"],\"solution\":\"Enter the following keystrokes:\\n\\nCOS \\n$(5\\\\times π\\\\div 3)$ \\nENTER \\n$\\\\cos(\\\\frac{5π}{3})=0.5$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-5-2-unit-circle-sine-and-cosine-functions-example-7\",\"prompt\":\"Find Coordinates Find the coordinates of the point on the unit circle at an angle of $\\\\frac{7π}{6}.$\",\"options\":[\"$$\\\\sin t$\",\"$$(x,y)$\",\"$$(5\\\\times π\\\\div 3)$\",\"$$(-\\\\frac{\\\\sqrt{3}}{2},-\\\\frac{1}{2})$\"],\"correctIndex\":3,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"We know that the angle $\\\\frac{7π}{6}$ is in the third quadrant.\",\"The answer is $(-\\\\frac{\\\\sqrt{3}}{2},-\\\\frac{1}{2})$.\"],\"solution\":\"We know that the angle $\\\\frac{7π}{6}$ is in the third quadrant. \\n\\nFirst, let’s find the reference angle by measuring the angle to the x -axis. To find the reference angle of an angle whose terminal side is in quadrant III, we find the difference of the angle and $π.$ \\n\\n$\\\\frac{7π}{6}-π=\\\\frac{π}{6}$\\n\\nNext, we will find the cosine and sine of the reference angle:\\n\\n$\\\\cos(\\\\frac{π}{6})=\\\\frac{\\\\sqrt{3}}{2} \\\\sin(\\\\frac{π}{6})=\\\\frac{1}{2}$\\n\\nWe must determine the appropriate signs for x and y in the given quadrant. Because our original angle is in the third quadrant, where both $x$ and $y$ are negative, both cosine and sine are negative.\\n\\n$\\\\begin{array}{c}\\\\cos(\\\\frac{7π}{6})=-\\\\frac{\\\\sqrt{3}}{2} \\\\\\\\ \\\\sin(\\\\frac{7π}{6})=-\\\\frac{1}{2}\\\\end{array}$\\n\\nNow we can calculate the $(x,y)$ coordinates using the identities $x=\\\\cos θ$ and $y=\\\\sin θ.$ \\n\\nThe coordinates of the point are $(-\\\\frac{\\\\sqrt{3}}{2},-\\\\frac{1}{2})$ on the unit circle.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]}]},{\"engineTopicId\":\"pc-ti-1\",\"curatedTopicId\":\"openstax:examples:5-3-the-other-trigonometric-functions\",\"topicName\":\"Other Trig Functions (worked examples)\",\"questions\":[{\"id\":\"openstax-precalc-5-3-the-other-trigonometric-functions-example-3\",\"prompt\":\"Find Trigonometric Functions Use reference angles to find all six trigonometric functions of $-\\\\frac{5π}{6}.$\",\"options\":[\"$$t,$\",\"$$y$\",\"$$\\\\csc t,$\",\"$$−t$\"],\"correctIndex\":1,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"The angle between this angle’s terminal side and the x -axis is $\\\\frac{π}{6},$ so that is the reference angle.\",\"The answer is $y$.\"],\"solution\":\"The angle between this angle’s terminal side and the x -axis is $\\\\frac{π}{6},$ so that is the reference angle. Since $-\\\\frac{5π}{6}$ is in the third quadrant, where both $x$ and $y$ are negative, cosine, sine, secant, and cosecant will be negative, while tangent and cotangent will be positive.\\n\\n$\\\\begin{array}{c}\\\\cos(-\\\\frac{5π}{6})=-\\\\frac{\\\\sqrt{3}}{2},\\\\sin(-\\\\frac{5π}{6})=-\\\\frac{1}{2},\\\\text{tan}(-\\\\frac{5π}{6})=\\\\frac{\\\\sqrt{3}}{3} \\\\\\\\ \\\\text{sec}(-\\\\frac{5π}{6})=-\\\\frac{2\\\\sqrt{3}}{3},\\\\text{csc}(-\\\\frac{5π}{6})=-2,\\\\cot(-\\\\frac{5π}{6})=\\\\sqrt{3}\\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-5-3-the-other-trigonometric-functions-example-4\",\"prompt\":\"Using Even and Odd Properties of Trigonometric Functions If the secant of angle $t$ is 2, what is the secant of $−t?$\",\"options\":[\"$$\\\\csc t,$\",\"$$−t$\",\"$$-\\\\frac{5}{13}.$\",\"$$y$\"],\"correctIndex\":1,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Secant is an even function.\",\"The answer is $−t$.\"],\"solution\":\"Secant is an even function. The secant of an angle is the same as the secant of its opposite. So if the secant of angle t is 2, the secant of $−t$ is also 2.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-5-3-the-other-trigonometric-functions-example-6\",\"prompt\":\"Simplify Trigonometric Expressions Simplify $\\\\frac{\\\\sec t}{\\\\tan t}.$\",\"options\":[\"$$\\\\csc t,$\",\"$$y$\",\"$$t,$\",\"$$\\\\csc(\\\\frac{5π}{7})\\\\approx1.279$\"],\"correctIndex\":0,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"We can simplify this by rewriting both functions in terms of sine and cosine.\",\"The answer is $\\\\csc t,$.\"],\"solution\":\"We can simplify this by rewriting both functions in terms of sine and cosine.\\n\\n$\\\\begin{array}{cc}\\\\frac{\\\\sec t}{\\\\tan t}=\\\\frac{\\\\frac{1}{\\\\cos t}}{\\\\frac{\\\\sin t}{\\\\cos t}} \u0026 \\\\text{To divide the functions, we multiply by the reciprocal}. \\\\\\\\ =\\\\frac{1}{\\\\cos t}\\\\frac{\\\\cos t}{\\\\sin t} \u0026 \\\\text{Divide out the cosines}. \\\\\\\\ =\\\\frac{1}{\\\\sin t} \u0026 \\\\text{Simplify and use the identity}. \\\\\\\\ =\\\\csc t \u0026 \\\\end{array}$\\n\\nBy showing that $\\\\frac{\\\\sec t}{\\\\tan t}$ can be simplified to $\\\\csc t,$ we have, in fact, established a new identity.\\n\\n$\\\\frac{\\\\sec t}{\\\\tan t}=\\\\csc t$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-5-3-the-other-trigonometric-functions-example-10\",\"prompt\":\"Evaluate the cosecant of $\\\\frac{5π}{7}.$\",\"options\":[\"$$\\\\csc(\\\\frac{5π}{7})\\\\approx1.279$\",\"$$\\\\csc t,$\",\"$$-\\\\frac{5}{13}.$\",\"$$−t$\"],\"correctIndex\":0,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"For a scientific calculator, enter information as follows:\\n\\n$\\\\text{1 / ( 5 }\\\\times π\\\\text{ / 7 ) SIN =}$\\n\\n$\\\\csc(\\\\frac{5π}{7})\\\\approx1.279$\",\"The answer is $\\\\csc(\\\\frac{5π}{7})\\\\approx1.279$.\"],\"solution\":\"For a scientific calculator, enter information as follows:\\n\\n$\\\\text{1 / ( 5 }\\\\times π\\\\text{ / 7 ) SIN =}$\\n\\n$\\\\csc(\\\\frac{5π}{7})\\\\approx1.279$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]}]},{\"engineTopicId\":\"pc-ti-1\",\"curatedTopicId\":\"openstax:examples:6-1-graphs-of-the-sine-and-cosine-functions\",\"topicName\":\"Graphs of Sine \u0026 Cosine (worked examples)\",\"questions\":[{\"id\":\"openstax-precalc-6-1-graphs-of-the-sine-and-cosine-functions-example-1\",\"prompt\":\"Determine the period of the function $f(x)=\\\\sin(\\\\frac{π}{6}x).$\",\"options\":[\"$$C = 1\\\\cdot \\\\frac{π}{3}=\\\\frac{π}{3}$\",\"$$B = \\\\frac{π}{6},$\",\"$$y = r \\\\sin(x),$\",\"$$C = 0$\"],\"correctIndex\":1,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Let’s begin by comparing the equation to the general form $y=A\\\\sin(Bx).$ \\n\\nIn the given equation, $B=\\\\frac{π}{6},$ so the period will be\\n\\n$\\\\begin{array}{c}\\\\begin{array}{c} \\\\\\\\ P=\\\\frac{2π}{|B|}\\\\end{arra…\",\"The answer is $B = \\\\frac{π}{6},$.\"],\"solution\":\"Let’s begin by comparing the equation to the general form $y=A\\\\sin(Bx).$ \\n\\nIn the given equation, $B=\\\\frac{π}{6},$ so the period will be\\n\\n$\\\\begin{array}{c}\\\\begin{array}{c} \\\\\\\\ P=\\\\frac{2π}{|B|}\\\\end{array} \\\\\\\\ =\\\\frac{2π}{\\\\frac{π}{6}} \\\\\\\\ =2π\\\\cdot \\\\frac{6}{π} \\\\\\\\ =12\\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-6-1-graphs-of-the-sine-and-cosine-functions-example-2\",\"prompt\":\"Identifying the Amplitude of a Sine or Cosine Function What is the amplitude of the sinusoidal function $f(x)=−4\\\\sin(x)?$ Is the function stretched or compressed vertically?\",\"options\":[\"$$A = −4,$\",\"$$x = 3$\",\"$$y = r \\\\sin(x),$\",\"$$A$\"],\"correctIndex\":0,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Let’s begin by comparing the function to the simplified form $y=A\\\\sin(Bx).$ \\n\\nIn the given function, $A=−4,$ so the amplitude is $|A|=|−4|=4.$ The function is stretched.\",\"The answer is $A = −4,$.\"],\"solution\":\"Let’s begin by comparing the function to the simplified form $y=A\\\\sin(Bx).$ \\n\\nIn the given function, $A=−4,$ so the amplitude is $|A|=|−4|=4.$ The function is stretched.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-6-1-graphs-of-the-sine-and-cosine-functions-example-3\",\"prompt\":\"Determine the direction and magnitude of the phase shift for $f(x)=\\\\sin(x+\\\\frac{π}{6})-2.$\",\"options\":[\"$$C = 1\\\\cdot \\\\frac{π}{3}=\\\\frac{π}{3}$\",\"$$C = 0$\",\"$$y = 1$\",\"$$\\\\frac{π}{6}$\"],\"correctIndex\":3,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Let’s begin by comparing the equation to the general form $y=A\\\\sin(Bx-C)+D.$ \\n\\nIn the given equation, notice that $B=1$ and $C=-\\\\frac{π}{6}.$ So the phase shift is\\n\\n$\\\\begin{array}{c} \\\\\\\\ \\\\frac{C}{B}=-\\\\…\",\"The answer is $\\\\frac{π}{6}$.\"],\"solution\":\"Let’s begin by comparing the equation to the general form $y=A\\\\sin(Bx-C)+D.$ \\n\\nIn the given equation, notice that $B=1$ and $C=-\\\\frac{π}{6}.$ So the phase shift is\\n\\n$\\\\begin{array}{c} \\\\\\\\ \\\\frac{C}{B}=-\\\\frac{\\\\frac{π}{6}}{1} \\\\\\\\ =-\\\\frac{π}{6}\\\\end{array}$\\n\\nor $\\\\frac{π}{6}$ units to the left.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-6-1-graphs-of-the-sine-and-cosine-functions-example-4\",\"prompt\":\"Determine the direction and magnitude of the vertical shift for $f(x)=\\\\cos(x)-3.$\",\"options\":[\"$$A$\",\"$$D = −3$\",\"$$\\\\frac{π}{6}$\",\"$$y = 1$\"],\"correctIndex\":1,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Let’s begin by comparing the equation to the general form $y=A\\\\cos(Bx-C)+D.$ \\n\\nIn the given equation, $D=−3$ so the shift is 3 units downward.\",\"The answer is $D = −3$.\"],\"solution\":\"Let’s begin by comparing the equation to the general form $y=A\\\\cos(Bx-C)+D.$ \\n\\nIn the given equation, $D=−3$ so the shift is 3 units downward.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-6-1-graphs-of-the-sine-and-cosine-functions-example-5\",\"prompt\":\"Determine the midline, amplitude, period, and phase shift of the function $y=3\\\\sin(2x)+1.$\",\"options\":[\"$$A = −4,$\",\"$$D = −3$\",\"$$y = r \\\\sin(x),$\",\"$$y = 1$\"],\"correctIndex\":3,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Let’s begin by comparing the equation to the general form $y=A\\\\sin(Bx-C)+D.$ \\n\\n$A=3,$ so the amplitude is $|A|=3.$ \\n\\nNext, $B=2,$ so the period is $P=\\\\frac{2π}{|B|}=\\\\frac{2π}{2}=π.$ \\n\\nThere is no adde…\",\"The answer is $y = 1$.\"],\"solution\":\"Let’s begin by comparing the equation to the general form $y=A\\\\sin(Bx-C)+D.$ \\n\\n$A=3,$ so the amplitude is $|A|=3.$ \\n\\nNext, $B=2,$ so the period is $P=\\\\frac{2π}{|B|}=\\\\frac{2π}{2}=π.$ \\n\\nThere is no added constant inside the parentheses, so $C=0$ and the phase shift is $\\\\frac{C}{B}=\\\\frac{0}{2}=0.$ \\n\\nFinally, $D=1,$ so the midline is $y=1.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-6-1-graphs-of-the-sine-and-cosine-functions-example-8\",\"prompt\":\"Sketch a graph of $f(x)=-2\\\\sin(\\\\frac{πx}{2}).$\",\"options\":[\"$$x = 3$\",\"$$y = 1$\",\"$$B = \\\\frac{π}{6},$\",\"$$y$\"],\"correctIndex\":0,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Let’s begin by comparing the equation to the form $y=A\\\\sin(Bx).$ \\n\\nStep 1.\",\"The answer is $x = 3$.\"],\"solution\":\"Let’s begin by comparing the equation to the form $y=A\\\\sin(Bx).$ \\n\\nStep 1. We can see from the equation that $A=-2,$ so the amplitude is 2.\\n$|A|=2$ \\nStep 2. The equation shows that $B=\\\\frac{π}{2},$ so the period is\\n$\\\\begin{array}{c}P=\\\\frac{2π}{\\\\frac{π}{2}} \\\\\\\\ =2π\\\\cdot \\\\frac{2}{π} \\\\\\\\ =4\\\\end{array}$ \\n\\nStep 3. Because $A$ is negative, the graph descends as we move to the right of the origin. \\nStep 4–7. The x -intercepts are at the beginning of one period, $x=0,$ the horizontal midpoints are at $x=2$ and at the end of one period at $x=4.$ \\n\\nThe quarter points include the minimum at $x=1$ and the maximum at $x=3.$ A local minimum will occur 2 units below the midline, at $x=1,$ and a local maximum will occur at 2 units above the midline, at $x=3.$ Figure 19 shows the graph of the function.\\n\\nFigure \\n19\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-6-1-graphs-of-the-sine-and-cosine-functions-example-10\",\"prompt\":\"Identifying the Properties of a Sinusoidal Function Given $y=-2\\\\cos(\\\\frac{π}{2}x+π)+3,$ determine the amplitude, period, phase shift, and vertical shift. Then graph the function.\",\"options\":[\"$$\\\\frac{π}{6}$\",\"$$A$\",\"$$C = 1\\\\cdot \\\\frac{π}{3}=\\\\frac{π}{3}$\",\"$$A = −4,$\"],\"correctIndex\":1,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Begin by comparing the equation to the general form and use the steps outlined in Example 9 .\",\"The answer is $A$.\"],\"solution\":\"Begin by comparing the equation to the general form and use the steps outlined in Example 9 .\\n\\n$y=A\\\\cos(Bx-C)+D$ \\nStep 1. The function is already written in general form. \\nStep 2. Since $A=-2,$ the amplitude is $|A|=2.$ \\nStep 3. $|B|=\\\\frac{π}{2},$ so the period is $P=\\\\frac{2π}{|B|}=\\\\frac{2π}{\\\\frac{π}{2}}=2π\\\\cdot \\\\frac{2}{π}=4.$ The period is 4. \\nStep 4. $C=-π,$ so we calculate the phase shift as $\\\\frac{C}{B}=\\\\frac{-π,}{\\\\frac{π}{2}}=-π\\\\cdot \\\\frac{2}{π}=-2.$ The phase shift is $-2.$ \\nStep 5. $D=3,$ so the midline is $y=3,$ and the vertical shift is up 3. \\n\\nSince $A$ is negative, the graph of the cosine function has been reflected about the x -axis.\\n\\nFigure 21 shows one cycle of the graph of the function.\\n\\nFigure \\n21\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-6-1-graphs-of-the-sine-and-cosine-functions-example-11\",\"prompt\":\"Sketch a graph of the y -coordinate of the point as a function of the angle of rotation.\",\"options\":[\"$$C = 0$\",\"$$y$\",\"$$y = r \\\\sin(x),$\",\"$$x = 3$\"],\"correctIndex\":2,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Recall that, for a point on a circle of radius r , the y -coordinate of the point is $y=r \\\\sin(x),$ \\nso in this case, we get the equation $y(x)=3 \\\\sin(x).$ \\nThe constant 3 causes a vertical stretch of…\",\"The answer is $y = r \\\\sin(x),$.\"],\"solution\":\"Recall that, for a point on a circle of radius r , the y -coordinate of the point is $y=r \\\\sin(x),$ \\nso in this case, we get the equation $y(x)=3 \\\\sin(x).$ \\nThe constant 3 causes a vertical stretch of the y -values of the function by a factor of 3, which we can see in the graph in Figure 22 .\\n\\nFigure \\n22\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-6-1-graphs-of-the-sine-and-cosine-functions-example-13\",\"prompt\":\"Determining a Rider’s Height on a Ferris Wheel The London Eye is a huge Ferris wheel with a diameter of 135 meters (443 feet). It completes one rotation every 30 minutes. Riders board from a platform 2 meters above the ground. Express a rider’s height above ground as a function of time in minutes.\",\"options\":[\"$$y$\",\"$$D = −3$\",\"$$x = 3$\",\"$$y = r \\\\sin(x),$\"],\"correctIndex\":0,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"With a diameter of 135 m, the wheel has a radius of 67.5 m.\",\"The answer is $y$.\"],\"solution\":\"With a diameter of 135 m, the wheel has a radius of 67.5 m. The height will oscillate with amplitude 67.5 m above and below the center.\\n\\nPassengers board 2 m above ground level, so the center of the wheel must be located $67.5+2=69.5$ m above ground level. The midline of the oscillation will be at 69.5 m.\\n\\nThe wheel takes 30 minutes to complete 1 revolution, so the height will oscillate with a period of 30 minutes.\\n\\nLastly, because the rider boards at the lowest point, the height will start at the smallest value and increase, following the shape of a vertically reflected cosine curve.\\n\\nAmplitude: $67.5,$ so $A=67.5$ \\nMidline: $69.5,$ so $D=69.5$ \\nPeriod: $30,$ so $B=\\\\frac{2π}{30}=\\\\frac{π}{15}$ \\nShape: $−cos(t)$ \\n\\nAn equation for the rider’s height would be\\n\\n$y=-67.5\\\\cos(\\\\frac{π}{15}t)+69.5$ \\n\\nwhere $t$ is in minutes and $y$ is measured in meters.\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]}]},{\"engineTopicId\":\"pc-ti-1\",\"curatedTopicId\":\"openstax:examples:6-2-graphs-of-the-other-trigonometric-functions\",\"topicName\":\"Graphs of Other Trig (worked examples)\",\"questions\":[{\"id\":\"openstax-precalc-6-2-graphs-of-the-other-trigonometric-functions-example-1\",\"prompt\":\"Sketch a graph of one period of the function $y=0.5\\\\tan(\\\\frac{π}{2}x).$\",\"options\":[\"$$(-0.5,−0.5).$\",\"$$x = 12$\",\"$$(2.5π,−2.5).$\",\"$$(4.5,-3).$\"],\"correctIndex\":0,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"First, we identify $A$ and $B.$ \\n\\nBecause $A=0.5$ and $B=\\\\frac{π}{2},$ we can find the stretching/compressing factor and period.\",\"The answer is $(-0.5,−0.5).$.\"],\"solution\":\"First, we identify $A$ and $B.$ \\n\\nBecause $A=0.5$ and $B=\\\\frac{π}{2},$ we can find the stretching/compressing factor and period. The period is $\\\\frac{π}{\\\\frac{π}{2}}=2,$ so the asymptotes are at $x=\\\\pm1.$ At a quarter period from the origin, we have\\n\\n$\\\\begin{array}{c}f(0.5)=0.5\\\\tan(\\\\frac{0.5π}{2}) \\\\\\\\ =0.5\\\\tan(\\\\frac{π}{4}) \\\\\\\\ =0.5\\\\end{array}$\\n\\nThis means the curve must pass through the points $(0.5,0.5),$ $(0,0),$ and $(-0.5,−0.5).$ The only inflection point is at the origin. Figure 2 shows the graph of one period of the function.\\n\\nFigure \\n2\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-6-2-graphs-of-the-other-trigonometric-functions-example-2\",\"prompt\":\"Graph one period of the function $y=−2\\\\tan(πx+π)−1.$\",\"options\":[\"$$(\\\\frac{3π}{8},3).$\",\"$$(−0.75,−3).$\",\"$$x = 12$\",\"$$(2.5π,−2.5).$\"],\"correctIndex\":1,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Apply the rule step by step and double-check each operation.\",\"The answer is $(−0.75,−3).$.\"],\"solution\":\"Step 1. The function is already written in the form $y=A\\\\tan(Bx-C)+D.$ \\nStep 2. $A=−2,$ so the stretching factor is $|A|=2.$ \\nStep 3. $B=π,$ so the period is $P=\\\\frac{π}{|B|}=\\\\frac{π}{π}=1.$ \\nStep 4. $C=-π,$ so the phase shift is $\\\\frac{C}{B}=\\\\frac{-π}{π}=−1.$ \\nStep 5-7. The asymptotes are at $x=-\\\\frac{3}{2}$ and $x=-\\\\frac{1}{2}$ and the three recommended reference points are $(−1.25,1),$ $(−1,−1),$ and $(−0.75,−3).$ The graph is shown in Figure 3 .\\n\\nFigure \\n3\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-6-2-graphs-of-the-other-trigonometric-functions-example-4\",\"prompt\":\"Graph one period of $f(x)=2.5\\\\sec(0.4x).$\",\"options\":[\"$$(\\\\frac{3π}{8},3).$\",\"$$(4.5,-3).$\",\"$$(2.5π,−2.5).$\",\"$$(−0.75,−3).$\"],\"correctIndex\":2,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Apply the rule step by step and double-check each operation.\",\"The answer is $(2.5π,−2.5).$.\"],\"solution\":\"Step 1. The given function is already written in the general form, $y=A\\\\sec(Bx).$ \\nStep 2. $A=2.5$ so the stretching factor is $\\\\text{2}\\\\text{.5}\\\\text{.}$\\n\\nStep 3. $B=0.4$ so $P=\\\\frac{2π}{0.4}=5π.$ The period is $5π$ units. \\nStep 4. Sketch the graph of the function $g(x)=2.5\\\\cos(0.4x).$ \\nStep 5. Use the reciprocal relationship of the cosine and secant functions to draw the cosecant function. \\nSteps 6–7. Sketch two asymptotes at $x=1.25π$ and $x=3.75π.$ We can use two reference points, the local minimum at $(0,2.5)$ and the local maximum at $(2.5π,−2.5).$ Figure 8 shows the graph.\\n\\nFigure \\n8\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-6-2-graphs-of-the-other-trigonometric-functions-example-5\",\"prompt\":\"Graph one period of $y=4\\\\sec(\\\\frac{π}{3}x-\\\\frac{π}{2})+1.$\",\"options\":[\"$$y = 3\\\\cot(4x)$\",\"$$A = 2$\",\"$$x = 12$\",\"$$(4.5,-3).$\"],\"correctIndex\":3,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Apply the rule step by step and double-check each operation.\",\"The answer is $(4.5,-3).$.\"],\"solution\":\"Step 1. Express the function given in the form $y=4\\\\sec(\\\\frac{π}{3}x-\\\\frac{π}{2})+1.$\\n\\nStep 2. The stretching/compressing factor is $|A|=4.$ \\nStep 3. The period is\\n$\\\\begin{array}{c}\\\\frac{2π}{|B|}=\\\\frac{2π}{\\\\frac{π}{3}} \\\\\\\\ \\\\text{      }=\\\\frac{2π}{1}\\\\cdot \\\\frac{3}{π} \\\\\\\\ \\\\text{      }=6\\\\end{array}$\\n\\nStep 4. The phase shift is\\n$\\\\begin{array}{c}\\\\frac{C}{B}=\\\\frac{\\\\frac{π}{2}}{\\\\frac{π}{3}} \\\\\\\\ \\\\text{   }=\\\\frac{π}{2}\\\\cdot \\\\frac{3}{π} \\\\\\\\ \\\\text{   }=1.5\\\\end{array}$\\n\\nStep 5. Draw the graph of $y=A\\\\sec(Bx),$ but shift it to the right by $\\\\frac{C}{B}=1.5$ and up by $D=1.$\\n\\nStep 6. Sketch the vertical asymptotes, which occur at $x=0,x=3,$ and $x=6.$ There is a local minimum at $(1.5,5)$ and a local maximum at $(4.5,-3).$ Figure 9 shows the graph.\\n\\nFigure \\n9\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-6-2-graphs-of-the-other-trigonometric-functions-example-6\",\"prompt\":\"Graph one period of $f(x)=−3\\\\csc(4x).$\",\"options\":[\"$$(\\\\frac{3π}{8},3).$\",\"$$y = 3\\\\cot(4x)$\",\"$$A = 2$\",\"$$(-0.5,−0.5).$\"],\"correctIndex\":0,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Apply the rule step by step and double-check each operation.\",\"The answer is $(\\\\frac{3π}{8},3).$.\"],\"solution\":\"Step 1. The given function is already written in the general form, $y=A\\\\csc(Bx).$\\n\\nStep 2. $|A|=|-3|=3,$ so the stretching factor is 3. \\nStep 3. $B=4,$ so $P=\\\\frac{2π}{4}=\\\\frac{π}{2}.$ The period is $\\\\frac{π}{2}$ units. \\nStep 4. Sketch the graph of the function $g(x)=−3\\\\sin(4x).$\\n\\nStep 5. Use the reciprocal relationship of the sine and cosecant functions to draw the cosecant function . \\nSteps 6–7. Sketch three asymptotes at $x=0, x=\\\\frac{π}{4},$ and $x=\\\\frac{π}{2}.$ We can use two reference points, the local maximum at $(\\\\frac{π}{8},−3)$ and the local minimum at $(\\\\frac{3π}{8},3).$ Figure 10 shows the graph.\\n\\nFigure \\n10\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-6-2-graphs-of-the-other-trigonometric-functions-example-7\",\"prompt\":\"Sketch a graph of $y=2\\\\csc(\\\\frac{π}{2}x)+1.$ What are the domain and range of this function?\",\"options\":[\"$$A = 2$\",\"$$(4.5,-3).$\",\"$$(-0.5,−0.5).$\",\"$$x = 0,x=2,x=4$\"],\"correctIndex\":3,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Apply the rule step by step and double-check each operation.\",\"The answer is $x = 0,x=2,x=4$.\"],\"solution\":\"Step 1. Express the function given in the form $y=2\\\\csc(\\\\frac{π}{2}x)+1.$\\n\\nStep 2. Identify the stretching/compressing factor, $|A|=2.$\\n\\nStep 3. The period is $\\\\frac{2π}{|B|}=\\\\frac{2π}{\\\\frac{π}{2}}=\\\\frac{2π}{1}\\\\cdot \\\\frac{2}{π}=4.$\\n\\nStep 4. The phase shift is $\\\\frac{0}{\\\\frac{π}{2}}=0.$\\n\\nStep 5. Draw the graph of $y=A\\\\csc(Bx)$ but shift it up $D=1.$\\n\\nStep 6. Sketch the vertical asymptotes, which occur at $x=0,x=2,x=4.$\\n\\nThe graph for this function is shown in Figure 11 .\\n\\nFigure \\n11 \\n\\nA transformed cosecant function\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-6-2-graphs-of-the-other-trigonometric-functions-example-8\",\"prompt\":\"Determine the stretching factor, period, and phase shift of $y=3\\\\cot(4x),$ and then sketch a graph.\",\"options\":[\"$$y = 3\\\\cot(4x)$\",\"$$x = 0,x=2,x=4$\",\"$$(4.5,-3).$\",\"$$(2.5π,−2.5).$\"],\"correctIndex\":0,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Apply the rule step by step and double-check each operation.\",\"The answer is $y = 3\\\\cot(4x)$.\"],\"solution\":\"Step 1. Expressing the function in the form $f(x)=A\\\\cot(Bx)$ gives $f(x)=3\\\\cot(4x).$\\n\\nStep 2. The stretching factor is $|A|=3.$\\n\\nStep 3. The period is $P=\\\\frac{π}{4}.$\\n\\nStep 4. Sketch the graph of $y=3\\\\tan(4x).$\\n\\nStep 5. Plot two reference points. Two such points are $(\\\\frac{π}{16},3)$ and $(\\\\frac{3π}{16},−3).$\\n\\nStep 6. Use the reciprocal relationship to draw $y=3\\\\cot(4x).$\\n\\nStep 7. Sketch the asymptotes, $x=0, x=\\\\frac{π}{4}.$\\n\\nThe blue graph in Figure 14 shows $y=3\\\\tan(4x)$ and the green graph shows $y=3\\\\cot(4x).$ \\n\\nFigure \\n14\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-6-2-graphs-of-the-other-trigonometric-functions-example-9\",\"prompt\":\"Sketch a graph of one period of the function $f(x)=4\\\\cot(\\\\frac{π}{8}x-\\\\frac{π}{2})-2.$\",\"options\":[\"$$A = 2$\",\"$$x = 0,x=2,x=4$\",\"$$x = 12$\",\"$$(4.5,-3).$\"],\"correctIndex\":2,\"hints\":[\"Reduce to a reference angle, then use unit-circle values and the sign from the relevant quadrant.\",\"Apply the rule step by step and double-check each operation.\",\"The answer is $x = 12$.\"],\"solution\":\"Step 1. The function is already written in the general form $f(x)=A\\\\cot(Bx-C)+D.$\\n\\nStep 2. $A=4,$ so the stretching factor is 4. \\nStep 3. $B=\\\\frac{π}{8},$ so the period is $P=\\\\frac{π}{|B|}=\\\\frac{π}{\\\\frac{π}{8}}=8.$\\n\\nStep 4. $C=\\\\frac{π}{2},$ so the phase shift is $\\\\frac{C}{B}=\\\\frac{\\\\frac{π}{2}}{\\\\frac{π}{8}}=4.$\\n\\nStep 5. We draw $f(x)=4\\\\tan(\\\\frac{π}{8}x-\\\\frac{π}{2})-2.$\\n\\nStep 6-7. Three points we can use to guide the graph are $(6,2),(8,-2),$ and $(10,-6).$ We use the reciprocal relationship of tangent and cotangent to draw $f(x)=4\\\\cot(\\\\frac{π}{8}x-\\\\frac{π}{2})-2.$\\n\\nStep 8. The vertical asymptotes are $x=4$ and $x=12.$\\n\\nThe graph is shown in Figure 15 .\\n\\nFigure \\n15 \\n\\nOne period of a modified cotangent function\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]}]},{\"engineTopicId\":\"pc-ti-2\",\"curatedTopicId\":\"openstax:examples:7-5-solving-trigonometric-equations\",\"topicName\":\"Solving Trig Equations (worked examples)\",\"questions\":[{\"id\":\"openstax-precalc-7-5-solving-trigonometric-equations-example-7\",\"prompt\":\"Identify all Solutions to the Equation Involving Tangent Identify all exact solutions to the equation $2(\\\\tan x+3)=5+\\\\tan x,0\\\\lex\\\\lt 2π.$\",\"options\":[\"$$x = \\\\frac{π}{6},\\\\frac{11π}{6}$\",\"$$0.9273\\\\pm2πk$\",\"$$\\\\tan x$\",\"$$0,π,\\\\frac{7π}{6},\\\\frac{11π}{6}.$\"],\"correctIndex\":2,\"hints\":[\"Try Pythagorean, double-angle, or sum/difference identities to convert to a single function.\",\"We can solve this equation using only algebra.\",\"The answer is $\\\\tan x$.\"],\"solution\":\"We can solve this equation using only algebra. Isolate the expression $\\\\tan x$ on the left side of the equals sign.\\n\\n$\\\\begin{array}{cc}2(\\\\tanx)+2(3) \u0026 =5+\\\\tanx \\\\\\\\ 2\\\\tan x+6 \u0026 =5+\\\\tan x \\\\\\\\ \\\\text{ }2\\\\tanx-\\\\tanx \u0026 =5-6 \\\\\\\\ \\\\tanx \u0026 =-1\\\\end{array}$ \\nThere are two angles on the unit circle that have a tangent value of $−1:θ=\\\\frac{3π}{4}$ and $θ=\\\\frac{7π}{4}.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-7-5-solving-trigonometric-equations-example-8\",\"prompt\":\"Solve a Trigonometric Equation Involving Sine Use a calculator to solve the equation $\\\\sin θ=0.8,$ where $θ$ is in radians.\",\"options\":[\"$$x = \\\\frac{π}{6},\\\\frac{11π}{6}$\",\"$$\\\\tan x$\",\"$$0,π,\\\\frac{7π}{6},\\\\frac{11π}{6}.$\",\"$$0.9273\\\\pm2πk$\"],\"correctIndex\":3,\"hints\":[\"Try Pythagorean, double-angle, or sum/difference identities to convert to a single function.\",\"Make sure mode is set to radians.\",\"The answer is $0.9273\\\\pm2πk$.\"],\"solution\":\"Make sure mode is set to radians. To find $θ,$ use the inverse sine function. On most calculators, you will need to push the 2 ND button and then the SIN button to bring up the $\\\\sin^{-1}$ function. What is shown on the screen is $\\\\sin^{-1}(.$ The calculator is ready for the input within the parentheses. For this problem, we enter $\\\\sin^{-1}(0.8),$ and press ENTER. Thus, to four decimals places,\\n\\n$\\\\sin^{-1}(0.8)\\\\approx0.9273$\\n\\nThe solution is\\n\\n$0.9273\\\\pm2πk$\\n\\nThe angle measurement in degrees is\\n\\n$\\\\begin{array}{c}\\\\begin{array}{c} \\\\\\\\ θ\\\\approx(53.1)^{∘}\\\\end{array} \\\\\\\\ θ\\\\approx\\\\mathrm{180}^{∘}-(53.1)^{∘} \\\\\\\\ \\\\text{  }\\\\approx(126.9)^{∘}\\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-7-5-solving-trigonometric-equations-example-12\",\"prompt\":\"Solve exactly: $2 \\\\sin^{2}θ+\\\\sin θ=0;0\\\\leθ\\\\lt 2π$\",\"options\":[\"$$0,π,\\\\frac{7π}{6},\\\\frac{11π}{6}.$\",\"$$\\\\tan x$\",\"$$0.9273\\\\pm2πk$\",\"$$x = \\\\frac{π}{6},\\\\frac{11π}{6}$\"],\"correctIndex\":0,\"hints\":[\"Try Pythagorean, double-angle, or sum/difference identities to convert to a single function.\",\"This problem should appear familiar as it is similar to a quadratic.\",\"The answer is $0,π,\\\\frac{7π}{6},\\\\frac{11π}{6}.$.\"],\"solution\":\"$57\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-7-5-solving-trigonometric-equations-example-14\",\"prompt\":\"Use Identities to Solve an Equation Use identities to solve exactly the trigonometric equation over the interval $0\\\\lex\\\\lt 2π.$ $\\\\cos x \\\\cos(2x)+\\\\sin x \\\\sin(2x)=\\\\frac{\\\\sqrt{3}}{2}$\",\"options\":[\"$$\\\\tan x$\",\"$$x = \\\\frac{π}{6},\\\\frac{11π}{6}$\",\"$$0.9273\\\\pm2πk$\",\"$$0,π,\\\\frac{7π}{6},\\\\frac{11π}{6}.$\"],\"correctIndex\":1,\"hints\":[\"Try Pythagorean, double-angle, or sum/difference identities to convert to a single function.\",\"Notice that the left side of the equation is the difference formula for cosine.\",\"The answer is $x = \\\\frac{π}{6},\\\\frac{11π}{6}$.\"],\"solution\":\"Notice that the left side of the equation is the difference formula for cosine.\\n\\n$\\\\begin{array}{ccccc} \u0026 \\\\\\\\ \\\\cos x \\\\cos(2x)+\\\\sin x \\\\sin(2x)=\\\\frac{\\\\sqrt{3}}{2} \u0026 \\\\\\\\ \\\\text{                       }\\\\cos(x-2x)=\\\\frac{\\\\sqrt{3}}{2}\\\\begin{array}{cccc} \u0026 \u0026 \u0026 \\\\end{array} \u0026 \\\\text{Difference formula for cosine} \\\\\\\\ \\\\text{                           }\\\\cos(−x)=\\\\frac{\\\\sqrt{3}}{2} \u0026 \\\\text{Use the negative angle identity}. \\\\\\\\ \\\\text{                                  }\\\\cos x=\\\\frac{\\\\sqrt{3}}{2} \u0026 \\\\end{array}$\\n\\nFrom the unit circle in Figure 2 , we see that $\\\\cos x=\\\\frac{\\\\sqrt{3}}{2}$ when $x=\\\\frac{π}{6},\\\\frac{11π}{6}.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]}]},{\"engineTopicId\":\"cab-dr-1\",\"curatedTopicId\":\"openstax:examples:12-4-derivatives\",\"topicName\":\"Derivatives (worked examples)\",\"questions\":[{\"id\":\"openstax-precalc-12-4-derivatives-example-1\",\"prompt\":\"Find the average rate of change connecting the points $(2,−6)$ and $(−1,5).$\",\"options\":[\"$$f^{′}(x)$\",\"$$x = 3:$\",\"$$t = 2,$\",\"$$−1,$\"],\"correctIndex\":3,\"hints\":[\"Use the power rule $\\\\frac{d}{dx} x^n = n x^{n-1}$ for each term, plus sum/difference rules.\",\"We know the average rate of change connecting two points may be given by\\n\\n$\\\\text{AROC}=\\\\frac{f(a+h)-f(a)}{h}.$ \\n\\nIf one point is $(2,-6),$ or $(2,f(2)),$ then $f(2)=−6.$ \\n\\nThe value $h$ is the displac…\",\"The answer is $−1,$.\"],\"solution\":\"We know the average rate of change connecting two points may be given by\\n\\n$\\\\text{AROC}=\\\\frac{f(a+h)-f(a)}{h}.$ \\n\\nIf one point is $(2,-6),$ or $(2,f(2)),$ then $f(2)=−6.$ \\n\\nThe value $h$ is the displacement from $2$ to $-1,$ which equals $-1-2=−3.$ \\n\\nFor the other point, $f(a+h)$ is the y -coordinate at $a+h,$ which is $2+(−3)$ or $−1,$ so $f(a+h)=f(−1)=5.$ \\n$\\\\begin{array}{c}\\\\text{AROC}=\\\\frac{f(a+h)-f(a)}{h} \\\\\\\\ \\\\text{           }=\\\\frac{5-(-6)}{-3} \\\\\\\\ \\\\text{           }=\\\\frac{11}{-3} \\\\\\\\ \\\\text{           }=-\\\\frac{11}{3}\\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-12-4-derivatives-example-5\",\"prompt\":\"Finding the Instantaneous Rate of Change Using the function above, $s(t)=−16t^{2}+64t+6,$ what is the instantaneous velocity of the ball at 1 second and 3 seconds into its flight?\",\"options\":[\"$$f^{′}(x)$\",\"$$−1,$\",\"$$t = 2,$\",\"$$−32$\"],\"correctIndex\":3,\"hints\":[\"Use the power rule $\\\\frac{d}{dx} x^n = n x^{n-1}$ for each term, plus sum/difference rules.\",\"The velocity at $t=1$ and $t=3$ is the instantaneous rate of change of distance per time, or velocity.\",\"The answer is $−32$.\"],\"solution\":\"$58\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-12-4-derivatives-example-7\",\"prompt\":\"Finding a Marginal Cost The cost in dollars of producing $x$ laptop computers in dollars is $f(x)=x^{2}-100x.$ At the point where 200 computers have been produced, what is the approximate cost of producing the 201 st unit?\",\"options\":[\"$$−1,$\",\"$$x = 3:$\",\"$$−32$\",\"$$f^{′}(x)$\"],\"correctIndex\":3,\"hints\":[\"Use the power rule $\\\\frac{d}{dx} x^n = n x^{n-1}$ for each term, plus sum/difference rules.\",\"If $f(x)=x^{2}-100x$ describes the cost of producing $x$ computers, $f^{′}(x)$ will describe the marginal cost.\",\"The answer is $f^{′}(x)$.\"],\"solution\":\"$59\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-12-4-derivatives-example-10\",\"prompt\":\"Find the equation of a line tangent to the curve $f(x)=x^{2}-4x$ at $x=3.$\",\"options\":[\"$$t = 2,$\",\"$$f^{′}(x)$\",\"$$x = 3:$\",\"$$−32$\"],\"correctIndex\":2,\"hints\":[\"Use the power rule $\\\\frac{d}{dx} x^n = n x^{n-1}$ for each term, plus sum/difference rules.\",\"Using:\\n\\n$f'(a)=\\\\underline{lim}\\\\frac{f(a+h)-f(a)}{h}$ \\n\\nSubstitute $f(a+h)=(a+h)^{2}-4(a+h)$ and $f(a)=a^{2}-4a.$ \\n\\n$\\\\begin{array}{cc}f^{′}(a)=\\\\underline{lim}\\\\frac{(a+h)(a+h)-4(a+h)-(a^{2}-4a)}{h} \u0026 \\\\\\\\…\",\"The answer is $x = 3:$.\"],\"solution\":\"Using:\\n\\n$f'(a)=\\\\underline{lim}\\\\frac{f(a+h)-f(a)}{h}$ \\n\\nSubstitute $f(a+h)=(a+h)^{2}-4(a+h)$ and $f(a)=a^{2}-4a.$ \\n\\n$\\\\begin{array}{cc}f^{′}(a)=\\\\underline{lim}\\\\frac{(a+h)(a+h)-4(a+h)-(a^{2}-4a)}{h} \u0026 \\\\\\\\ \\\\text{         }=\\\\underline{lim}\\\\frac{a^{2}+2ah+h^{2}-4a-4h-a^{2}+4a}{h} \u0026 \\\\text{Remove parentheses}. \\\\\\\\ \\\\text{         }=\\\\underline{lim}\\\\frac{a^{2}+2ah+h^{2}-4a-4h-a^{2}+4a}{h} \u0026 \\\\text{Combine like terms}. \\\\\\\\ \\\\text{         }=\\\\underline{lim}\\\\frac{2ah+h^{2}-4h}{h} \u0026 \\\\\\\\ \\\\text{         }=\\\\underline{lim}\\\\frac{h(2a+h-4)}{h} \u0026 \\\\text{Factor out }h. \\\\\\\\ \\\\text{         }=2a+0-4 \u0026 \\\\\\\\ f^{′}(a)=2a-4 \u0026 \\\\text{Evaluate the limit}. \\\\\\\\ f^{′}(3)=2(3)-4=2 \u0026 \\\\end{array}$\\n\\nEquation of tangent line at $x=3:$ \\n$\\\\begin{array}{c}y=f'(a)(x-a)+f(a) \\\\\\\\ y=f'(3)(x-3)+f(3) \\\\\\\\ y=2(x-3)+(-3) \\\\\\\\ y=2x-9\\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]},{\"id\":\"openstax-precalc-12-4-derivatives-example-11\",\"prompt\":\"Finding the Instantaneous Velocity A ball is tossed upward from a height of 200 feet with an initial velocity of 36 ft/sec. If the height of the ball in feet after $t$ seconds is given by $s(t)=−16t^{2}+36t+200,$ find the instantaneous velocity of the ball at $t=2.$\",\"options\":[\"$$f^{′}(x)$\",\"$$t = 2,$\",\"$$x = 3:$\",\"$$−32$\"],\"correctIndex\":1,\"hints\":[\"Use the power rule $\\\\frac{d}{dx} x^n = n x^{n-1}$ for each term, plus sum/difference rules.\",\"First, we must find the derivative $s^{′}(t)$ .\",\"The answer is $t = 2,$.\"],\"solution\":\"First, we must find the derivative $s^{′}(t)$ . Then we evaluate the derivative at $t=2,$ using $s(a+h)=-16(a+h)^{2}+36(a+h)+200$ and $s(a)=-16a^{2}+36a+200.$ \\n$\\\\begin{array}{c}s^{′}(a)=\\\\underline{lim}\\\\frac{s(a+h)-s(a)}{h} \\\\\\\\ \\\\text{        }=\\\\underline{lim}\\\\frac{-16(a+h)^{2}+36(a+h)+200-(-16a^{2}+36a+200)}{h} \\\\\\\\ \\\\text{        }=\\\\underline{lim}\\\\frac{-16(a^{2}+2ah+h^{2})+36(a+h)+200-(-16a^{2}+36a+200)}{h} \\\\\\\\ \\\\text{        }=\\\\underline{lim}\\\\frac{-16a^{2}-32ah-16h^{2}+36a+36h+200+16a^{2}-36a-200}{h} \\\\\\\\ \\\\text{        }=\\\\underline{lim}\\\\frac{-16a^{2}-32ah-16h^{2}+36a+36h+200+16a^{2}-36a-200}{h} \\\\\\\\ \\\\text{        }=\\\\underline{lim}\\\\frac{-32ah-16h^{2}+36h}{h} \\\\\\\\ \\\\text{        }=\\\\underline{lim}\\\\frac{h(-32a-16h+36)}{h} \\\\\\\\ \\\\text{        }=\\\\underline{lim}(-32a-16h+36) \\\\\\\\ \\\\text{        }=-32a-16\\\\cdot 0+36 \\\\\\\\ s^{′}(a)=-32a+36 \\\\\\\\ s^{′}(2)=-32(2)+36 \\\\\\\\ \\\\text{        }=-28\\\\end{array}$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-precalculus-2e\"]}]}]}}]]}]\n"])</script><script>self.__next_f.push([1,"52:[\"$\",\"div\",null,{\"className\":\"rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 p-6 shadow-sm\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-base font-bold text-gray-900 dark:text-gray-100 mb-2\",\"children\":\"Jump to a topic\"}],[\"$\",\"ul\",null,{\"className\":\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-4 gap-y-1 text-sm\",\"children\":[[\"$\",\"li\",\"pc-ti-1\",{\"children\":[[\"$\",\"a\",null,{\"href\":\"#topic-pc-ti-1\",\"className\":\"text-purple-600 dark:text-purple-400 hover:underline\",\"children\":\"Angles\"}],[\"$\",\"span\",null,{\"className\":\"text-gray-400 dark:text-gray-500\",\"children\":[\" · \",14]}]]}],[\"$\",\"li\",\"pc-ti-1\",{\"children\":[[\"$\",\"a\",null,{\"href\":\"#topic-pc-ti-1\",\"className\":\"text-purple-600 dark:text-purple-400 hover:underline\",\"children\":\"Unit Circle\"}],[\"$\",\"span\",null,{\"className\":\"
