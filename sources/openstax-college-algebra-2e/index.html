\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-3-graphs-of-polynomial-functions-example-5\",\"prompt\":\"Graph Find the x -intercepts of $h(x)=x^{3}+4x^{2}+x-6.$\",\"options\":[\"$$[0, \\\\text{}7].$\",\"$$a.$\",\"$$x$\",\"$$x = 4$\"],\"correctIndex\":2,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"This polynomial is not in factored form, has no common factors, and does not appear to be factorable using techniques previously discussed.\",\"The answer is $x$.\"],\"solution\":\"$57\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-3-graphs-of-polynomial-functions-example-9\",\"prompt\":\"Show that the function $f(x)=x^{3}-5x^{2}+3x+6$ has at least two real zeros between $x=1$ and $x=4.$\",\"options\":[\"$$(-\\\\frac{3}{2},0).$\",\"$$x = 4$\",\"$$k$\",\"$$x$\"],\"correctIndex\":1,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"As a start, evaluate $f(x)$ \\nat the integer values $x=1,2,3,$ and $4.$ See Table 2 .\",\"The answer is $x = 4$.\"],\"solution\":\"As a start, evaluate $f(x)$ \\nat the integer values $x=1,2,3,$ and $4.$ See Table 2 .\\n\\n$x$ \\n1 \\n2 \\n3 \\n4 \\n\\n$f(x)$ \\n5 \\n0 \\n–3 \\n2 \\n\\nTable \\n2 \\n\\nWe see that one zero occurs at $x=2.$ Also, since $f(3)$ is negative and $f(4)$ is positive, by the Intermediate Value Theorem, there must be at least one real zero between 3 and 4.\\n\\nWe have shown that there are at least two real zeros between $x=1$ \\nand $x=4.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-3-graphs-of-polynomial-functions-example-11\",\"prompt\":\"Solve Applications An open-top box is to be constructed by cutting out squares from each corner of a 14 cm by 20 cm sheet of plastic and then folding up the sides. Find the size of squares that should be cut out to maximize the volume enclosed by the box.\",\"options\":[\"$$x = 4$\",\"$$[0, \\\\text{}7].$\",\"$$x$\",\"$$a.$\"],\"correctIndex\":1,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"We will start this problem by drawing a picture like that in Figure 22 , labeling the width of the cut-out squares with a variable, $w.$ \\n\\nFigure \\n22 \\n\\nNotice that after a square is cut out from each…\",\"The answer is $[0, \\\\text{}7].$.\"],\"solution\":\"$58\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a2-pd-1\",\"curatedTopicId\":\"openstax:examples:5-4-dividing-polynomials\",\"topicName\":\"Polynomial Long Division (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-5-4-dividing-polynomials-example-1\",\"prompt\":\"Divide a Second-Degree Polynomial Divide $5x^{2}+3x-2$ by $x+1.$\",\"options\":[\"$$5x-2.$\",\"$$4x^{3}+10x^{2}-6x-20.$\",\"$$-9x^{3}+x^{2}+8x+8+\\\\frac{2}{x-1}.$\",\"$$x-3$\"],\"correctIndex\":0,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"The quotient is $5x-2.$ \\nThe remainder is 0.\",\"The answer is $5x-2.$.\"],\"solution\":\"The quotient is $5x-2.$ \\nThe remainder is 0. We write the result as\\n\\n$\\\\frac{5x^{2}+3x-2}{x+1}=5x-2$\\n\\nor\\n\\n$5x^{2}+3x-2=(x+1)(5x-2)$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-4-dividing-polynomials-example-3\",\"prompt\":\"Divide a Second-Degree Polynomial Use synthetic division to divide $5x^{2}-3x-36$ by $x-3.$\",\"options\":[\"$$4x^{3}+10x^{2}-6x-20.$\",\"$$-9x^{3}+x^{2}+8x+8+\\\\frac{2}{x-1}.$\",\"$$5x-2.$\",\"$$x-3$\"],\"correctIndex\":3,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"Begin by setting up the synthetic division.\",\"The answer is $x-3$.\"],\"solution\":\"Begin by setting up the synthetic division. Write $k$ \\nand the coefficients.\\n\\nBring down the lead coefficient. Multiply the lead coefficient by $k.$ \\n\\nContinue by adding the numbers in the second column. Multiply the resulting number by $k.$ \\nWrite the result in the next column. Then add the numbers in the third column.\\n\\nThe result is $5x+12.$ \\nThe remainder is 0. So $x-3$ \\nis a factor of the original polynomial.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"math-verified\",\"source:openstax-college-algebra-2e\",\"worked-example\"]},{\"id\":\"openstax-ca-5-4-dividing-polynomials-example-4\",\"prompt\":\"Divide a Third-Degree Polynomial Use synthetic division to divide $4x^{3}+10x^{2}-6x-20$ by $x+2.$\",\"options\":[\"$$4x^{3}+10x^{2}-6x-20.$\",\"$$x^{2}+x-9.$\",\"$$-9x^{3}+x^{2}+8x+8+\\\\frac{2}{x-1}.$\",\"$$x-3$\"],\"correctIndex\":0,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"The binomial divisor is $x+2$ \\nso $k=−2.$ \\nAdd each column, multiply the result by –2, and repeat until the last column is reached.\",\"The answer is $4x^{3}+10x^{2}-6x-20.$.\"],\"solution\":\"The binomial divisor is $x+2$ \\nso $k=−2.$ \\nAdd each column, multiply the result by –2, and repeat until the last column is reached.\\n\\nThe result is $4x^{2}+2x-10.$ \\nThe remainder is 0. Thus, $x+2$ \\nis a factor of $4x^{3}+10x^{2}-6x-20.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-4-dividing-polynomials-example-5\",\"prompt\":\"Divide a Fourth-Degree Polynomial Use synthetic division to divide $-9x^{4}+10x^{3}+7x^{2}-6$ by $x-1.$\",\"options\":[\"$$4x^{3}+10x^{2}-6x-20.$\",\"$$-9x^{3}+x^{2}+8x+8+\\\\frac{2}{x-1}.$\",\"$$x^{2}+x-9.$\",\"$$x-3$\"],\"correctIndex\":1,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"Notice there is no x -term.\",\"The answer is $-9x^{3}+x^{2}+8x+8+\\\\frac{2}{x-1}.$.\"],\"solution\":\"Notice there is no x -term. We will use a zero as the coefficient for that term. \\n\\nThe result is $-9x^{3}+x^{2}+8x+8+\\\\frac{2}{x-1}.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-4-dividing-polynomials-example-6\",\"prompt\":\"Using Polynomial Division in an Application Problem The volume of a rectangular solid is given by the polynomial $3x^{4}-3x^{3}-33x^{2}+54x.$ The length of the solid is given by $3x$ and the width is given by $x-2.$ Find the height, $h,$ of the solid.\",\"options\":[\"$$x-3$\",\"$$-9x^{3}+x^{2}+8x+8+\\\\frac{2}{x-1}.$\",\"$$4x^{3}+10x^{2}-6x-20.$\",\"$$x^{2}+x-9.$\"],\"correctIndex\":3,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"There are a few ways to approach this problem.\",\"The answer is $x^{2}+x-9.$.\"],\"solution\":\"There are a few ways to approach this problem. We need to divide the expression for the volume of the solid by the expressions for the length and width. Let us create a sketch as in Figure 3 .\\n\\nFigure \\n3 \\n\\nWe can now write an equation by substituting the known values into the formula for the volume of a rectangular solid.\\n\\n$\\\\begin{array}{ccc}V \u0026 = \u0026 l\\\\cdot w\\\\cdot h \\\\\\\\ 3x^{4}-3x^{3}-33x^{2}+54x \u0026 = \u0026 3x\\\\cdot (x-2)\\\\cdot h\\\\end{array}$ \\n\\nTo solve for $h,$ first divide both sides by $3x.$ \\n\\n$\\\\begin{array}{ccc}\\\\frac{3x\\\\cdot (x-2)\\\\cdot h}{3x} \u0026 = \u0026 \\\\frac{3x^{4}-3x^{3}-33x^{2}+54x}{3x} \\\\\\\\ (x-2)h \u0026 = \u0026 x^{3}-x^{2}-11x+18\\\\end{array}$ \\n\\nNow solve for $h$ \\nusing synthetic division.\\n\\n$h=\\\\frac{x^{3}-x^{2}-11x+18}{x-2}$\\n\\nThe quotient is $x^{2}+x-9$ \\nand the remainder is 0. The height of the solid is $x^{2}+x-9.$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a2-pd-1\",\"curatedTopicId\":\"openstax:examples:5-5-zeros-of-polynomial-functions\",\"topicName\":\"Zeros of Polynomial Functions (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-5-5-zeros-of-polynomial-functions-example-1\",\"prompt\":\"Evaluate a Polynomial Use the Remainder Theorem to evaluate $f(x)=6x^{4}-x^{3}-15x^{2}+2x-7$ at $x=2.$\",\"options\":[\"$$-\\\\frac{1}{2}$\",\"$$x-2.$\",\"$$f(x).$\",\"$$x = 9$\"],\"correctIndex\":1,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"To find the remainder using the Remainder Theorem, use synthetic division to divide the polynomial by $x-2.$ \\n\\nThe remainder is 25.\",\"The answer is $x-2.$.\"],\"solution\":\"To find the remainder using the Remainder Theorem, use synthetic division to divide the polynomial by $x-2.$ \\n\\nThe remainder is 25. Therefore, $f(2)=25.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-5-zeros-of-polynomial-functions-example-2\",\"prompt\":\"Factor Theorem to Find the Zeros of a Polynomial Expression Show that $(x+2)$ is a factor of $x^{3}-6x^{2}-x+30.$ Find the remaining factors. Use the factors to determine the zeros of the polynomial .\",\"options\":[\"$$-\\\\frac{1}{2}$\",\"$$x^{3}-6x^{2}-x+30$\",\"$$\\\\pm\\\\frac{i\\\\sqrt{3}}{3}.$\",\"$$x-2.$\"],\"correctIndex\":1,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"We can use synthetic division to show that $(x+2)$ is a factor of the polynomial.\",\"The answer is $x^{3}-6x^{2}-x+30$.\"],\"solution\":\"We can use synthetic division to show that $(x+2)$ is a factor of the polynomial. \\n\\nThe remainder is zero, so $(x+2)$ is a factor of the polynomial. We can use the Division Algorithm to write the polynomial as the product of the divisor and the quotient:\\n\\n$(x+2)(x^{2}-8x+15)$\\n\\nWe can factor the quadratic factor to write the polynomial as\\n\\n$(x+2)(x-3)(x-5)$\\n\\nBy the Factor Theorem, the zeros of $x^{3}-6x^{2}-x+30$ are –2, 3, and 5.\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-5-zeros-of-polynomial-functions-example-3\",\"prompt\":\"List all possible rational zeros of $f(x)=2x^{4}-5x^{3}+x^{2}-4.$\",\"options\":[\"$$x = 9$\",\"$$x^{3}-6x^{2}-x+30$\",\"$$x-2.$\",\"$$q = ±1,±2$\"],\"correctIndex\":3,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"The only possible rational zeros of $f(x)$ \\nare the quotients of the factors of the last term, –4, and the factors of the leading coefficient, 2.\",\"The answer is $q = ±1,±2$.\"],\"solution\":\"The only possible rational zeros of $f(x)$ \\nare the quotients of the factors of the last term, –4, and the factors of the leading coefficient, 2. \\n\\nThe constant term is –4; the factors of –4 are $p=±1,±2,±4.$ \\n\\nThe leading coefficient is 2; the factors of 2 are $q=±1,±2.$ \\n\\nIf any of the four real zeros are rational zeros, then they will be of one of the following factors of –4 divided by one of the factors of 2.\\n\\n$\\\\begin{array}{ccc}\\\\frac{p}{q}=\\\\pm \\\\frac{1}{1}, \\\\pm \\\\frac{1}{2} \\\\text{   } \u0026 \\\\frac{p}{q}=\\\\pm \\\\frac{2}{1},\\\\pm \\\\frac{2}{2} \\\\text{   } \u0026 \\\\frac{p}{q}= \\\\pm \\\\frac{4}{1},\\\\pm \\\\frac{4}{2}\\\\end{array}$\\n\\nNote that $\\\\frac{2}{2}=1$ \\nand $\\\\frac{4}{2}=2,$ which have already been listed. So we can shorten our list.\\n\\n$\\\\frac{p}{q}=\\\\frac{\\\\text{Factors of the last}}{\\\\text{Factors of the first}}=±1,±2,±4,\\\\pm\\\\frac{1}{2}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-5-zeros-of-polynomial-functions-example-4\",\"prompt\":\"Find Rational Zeros Use the Rational Zero Theorem to find the rational zeros of $f(x)=2x^{3}+x^{2}-4x+1.$\",\"options\":[\"$$x^{3}-6x^{2}-x+30$\",\"$$x-2.$\",\"$$f(x).$\",\"$$-\\\\frac{1}{2}$\"],\"correctIndex\":2,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"The Rational Zero Theorem tells us that if $\\\\frac{p}{q}$ is a zero of $f(x),$ \\nthen $p$ is a factor of 1 and $q$ is a factor of 2.\",\"The answer is $f(x).$.\"],\"solution\":\"The Rational Zero Theorem tells us that if $\\\\frac{p}{q}$ is a zero of $f(x),$ \\nthen $p$ is a factor of 1 and $q$ is a factor of 2. \\n\\n$\\\\begin{array}{ccc}\\\\frac{p}{q} \u0026 = \u0026 \\\\frac{\\\\text{factor of constant term}}{\\\\text{factor of leading coefficient}} \\\\\\\\ \u0026 = \u0026 \\\\frac{\\\\text{factor of 1}}{\\\\text{factor of 2}}\\\\end{array}$\\n\\nThe factors of 1 are $±1$ and the factors of 2 are $±1$ and $±2.$ The possible values for $\\\\frac{p}{q}$ are $±1$ and $\\\\pm\\\\frac{1}{2}.$ These are the possible rational zeros for the function. We can determine which of the possible zeros are actual zeros by substituting these values for $x$ in $f(x).$ \\n\\n$\\\\begin{array}{ccc}f(−1) \u0026 = \u0026 2(−1)^{3}+(−1)^{2}-4(−1)+1=4 \\\\\\\\ f(1) \u0026 = \u0026 2(1)^{3}+(1)^{2}-4(1)+1=0 \\\\\\\\ f(-\\\\frac{1}{2}) \u0026 = \u0026 2(-\\\\frac{1}{2})^{3}+(-\\\\frac{1}{2})^{2}-4(-\\\\frac{1}{2})+1=3 \\\\\\\\ f(\\\\frac{1}{2}) \u0026 = \u0026 2(\\\\frac{1}{2})^{3}+(\\\\frac{1}{2})^{2}-4(\\\\frac{1}{2})+1=-\\\\frac{1}{2}\\\\end{array}$\\n\\nOf those, $−1,-\\\\frac{1}{2}, \\\\text{and }\\\\frac{1}{2}$ are not zeros of $f(x).$ 1 is the only rational zero of $f(x).$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-5-zeros-of-polynomial-functions-example-5\",\"prompt\":\"Find the zeros of $f(x)=4x^{3}-3x-1.$\",\"options\":[\"$$x^{3}-6x^{2}-x+30$\",\"$$q = ±1,±2$\",\"$$\\\\pm\\\\frac{i\\\\sqrt{3}}{3}.$\",\"$$-\\\\frac{1}{2}$\"],\"correctIndex\":3,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"The Rational Zero Theorem tells us that if $\\\\frac{p}{q}$ is a zero of $f(x),$ then $p$ \\nis a factor of –1 and $q$ is a factor of 4.\",\"The answer is $-\\\\frac{1}{2}$.\"],\"solution\":\"$59\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-5-zeros-of-polynomial-functions-example-6\",\"prompt\":\"Find the zeros of $f(x)=3x^{3}+9x^{2}+x+3.$\",\"options\":[\"$$-\\\\frac{1}{2}$\",\"$$f(x).$\",\"$$q = ±1,±2$\",\"$$\\\\pm\\\\frac{i\\\\sqrt{3}}{3}.$\"],\"correctIndex\":3,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"The Rational Zero Theorem tells us that if $\\\\frac{p}{q}$ is a zero of $f(x),$ then $p$ is a factor of 3 and $q$ is a factor of 3.\",\"The answer is $\\\\pm\\\\frac{i\\\\sqrt{3}}{3}.$.\"],\"solution\":\"$5a\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-5-zeros-of-polynomial-functions-example-7\",\"prompt\":\"Find a Polynomial with Given Zeros Find a fourth degree polynomial with real coefficients that has zeros of –3, 2, $i,$ such that $f(−2)=100.$\",\"options\":[\"$$\\\\pm\\\\frac{i\\\\sqrt{3}}{3}.$\",\"$$x^{3}-6x^{2}-x+30$\",\"$$x = 9$\",\"$$f(x).$\"],\"correctIndex\":3,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"Because $x=i$ \\nis a zero, by the Complex Conjugate Theorem $x=–i$ \\nis also a zero.\",\"The answer is $f(x).$.\"],\"solution\":\"Because $x=i$ \\nis a zero, by the Complex Conjugate Theorem $x=–i$ \\nis also a zero. The polynomial must have factors of $(x+3), (x-2), (x-i),$ and $(x+i).$ Since we are looking for a degree 4 polynomial, and now have four zeros, we have all four factors. Let’s begin by multiplying these factors.\\n\\n$\\\\begin{array}{ccc}f(x) \u0026 = \u0026 a(x+3)(x-2)(x-i)(x+i) \\\\\\\\ f(x) \u0026 = \u0026 a(x^{2}+x-6)(x^{2}+1) \\\\\\\\ f(x) \u0026 = \u0026 a(x^{4}+x^{3}-5x^{2}+x-6)\\\\end{array}$ \\nWe need to find a to ensure $f(–2)=100.$ Substitute $x=–2$ and $f(2)=100$ \\ninto $f(x).$ \\n\\n$\\\\begin{array}{ccc}100 \u0026 = \u0026 a((−2)^{4}+(−2)^{3}-5(−2)^{2}+(−2)-6) \\\\\\\\ 100 \u0026 = \u0026 a(−20) \\\\\\\\ −5 \u0026 = \u0026 a\\\\end{array}$ \\n\\nSo the polynomial function is\\n\\n$f(x)=−5(x^{4}+x^{3}-5x^{2}+x-6)$\\n\\nor\\n\\n$f(x)=-5x^{4}-5x^{3}+25x^{2}-5x+30$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-5-zeros-of-polynomial-functions-example-9\",\"prompt\":\"The bakery wants the volume of a small sheet cake to be 351 cubic inches. The cake is in the shape of a rectangular solid. They want the length of the cake to be four inches longer than the width of the cake and the height of the cake to be one-third of the width. What should the dimensions of the cake pan be?\",\"options\":[\"$$x-2.$\",\"$$-\\\\frac{1}{2}$\",\"$$\\\\pm\\\\frac{i\\\\sqrt{3}}{3}.$\",\"$$x = 9$\"],\"correctIndex\":3,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"Begin by writing an equation for the volume of the cake.\",\"The answer is $x = 9$.\"],\"solution\":\"$5b\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a2-pd-1\",\"curatedTopicId\":\"openstax:examples:5-6-rational-functions\",\"topicName\":\"Rational Functions (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-5-6-rational-functions-example-2\",\"prompt\":\"Graph a Rational Function Sketch a graph of the reciprocal function shifted two units to the left and up three units. Identify the horizontal and vertical asymptotes of the graph, if any.\",\"options\":[\"$$\\\\frac{1}{10}$\",\"$$\\\\text{As }x\\\\to\\\\pm∞,f(x)\\\\to3.$\",\"$$x = \\\\pm3$\",\"$$x = 1$\"],\"correctIndex\":1,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"Shifting the graph left 2 and up 3 would result in the function\\n\\n$f(x)=\\\\frac{1}{x+2}+3$ \\n\\nor equivalently, by giving the terms a common denominator,\\n\\n$f(x)=\\\\frac{3x+7}{x+2}$ \\nThe graph of the shifted…\",\"The answer is $\\\\text{As }x\\\\to\\\\pm∞,f(x)\\\\to3.$.\"],\"solution\":\"Shifting the graph left 2 and up 3 would result in the function\\n\\n$f(x)=\\\\frac{1}{x+2}+3$ \\n\\nor equivalently, by giving the terms a common denominator,\\n\\n$f(x)=\\\\frac{3x+7}{x+2}$ \\nThe graph of the shifted function is displayed in Figure 7 .\\n\\nFigure \\n7 \\n\\nNotice that this function is Undefined at $x=−2,$ and the graph also is showing a vertical asymptote at $x=−2.$ \\n$\\\\text{As }x\\\\to-2^{-},f(x)\\\\to-∞,\\\\text{and as}x\\\\to-2^{+},f(x)\\\\to∞.$ \\n\\nAs the inputs increase and decrease without bound, the graph appears to be leveling off at output values of 3, indicating a horizontal asymptote at $y=3.$ \\n\\n$\\\\text{As }x\\\\to\\\\pm∞,f(x)\\\\to3.$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-6-rational-functions-example-4\",\"prompt\":\"Find the domain of $f(x)=\\\\frac{x+3}{x^{2}-9}.$\",\"options\":[\"$$\\\\frac{1}{10}$\",\"$$\\\\text{As }x\\\\to\\\\pm∞,f(x)\\\\to3.$\",\"$$x = 1$\",\"$$x = \\\\pm3$\"],\"correctIndex\":3,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"Begin by setting the denominator equal to zero and solving.\",\"The answer is $x = \\\\pm3$.\"],\"solution\":\"Begin by setting the denominator equal to zero and solving.\\n\\n$\\\\begin{array}{ccc}x^{2}-9 \u0026 = \u0026 0 \\\\\\\\ x^{2} \u0026 = \u0026 9 \\\\\\\\ x \u0026 = \u0026 ±3\\\\end{array}$\\n\\nThe denominator is equal to zero when $x=\\\\pm3.$ The domain of the function is all real numbers except $x=\\\\pm3.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-6-rational-functions-example-5\",\"prompt\":\"Find the vertical asymptotes of the graph of $k(x)=\\\\frac{5+2x^{2}}{2-x-x^{2}}.$\",\"options\":[\"$$\\\\text{As }x\\\\to\\\\pm∞,f(x)\\\\to3.$\",\"$$y = 4$\",\"$$x = 1$\",\"$$\\\\frac{1}{10}$\"],\"correctIndex\":2,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"First, factor the numerator and denominator.\",\"The answer is $x = 1$.\"],\"solution\":\"First, factor the numerator and denominator.\\n\\n$\\\\begin{array}{ccc}k(x) \u0026 = \u0026 \\\\frac{5+2x^{2}}{2-x-x^{2}} \\\\\\\\ \u0026 = \u0026 \\\\frac{5+2x^{2}}{(2+x)(1-x)}\\\\end{array}$\\n\\nTo find the vertical asymptotes, we determine where this function will be Undefined by setting the denominator equal to zero:\\n\\n$\\\\begin{array}{ccc}(2+x)(1-x) \u0026 = \u0026 0 \\\\\\\\ x \u0026 = \u0026 −2,1\\\\end{array}$\\n\\nNeither $x=–2$ nor $x=1$ are zeros of the numerator, so the two values indicate two vertical asymptotes. The graph in Figure 9 confirms the location of the two vertical asymptotes.\\n\\nFigure \\n9\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-6-rational-functions-example-8\",\"prompt\":\"Identifying Horizontal Asymptotes In the sugar concentration problem earlier, we created the equation $C(t)=\\\\frac{5+t}{100+10t}.$ Find the horizontal asymptote and interpret it in context of the problem.\",\"options\":[\"$$\\\\frac{1}{10}$\",\"$$y = 4$\",\"$$x = \\\\pm3$\",\"$$x = 1$\"],\"correctIndex\":0,\"hints\":[\"Set up long division (or synthetic division if the divisor is $x - c$). Bring down each term in order.\",\"Both the numerator and denominator are linear (degree 1).\",\"The answer is $\\\\frac{1}{10}$.\"],\"solution\":\"Both the numerator and denominator are linear (degree 1). Because the degrees are equal, there will be a horizontal asymptote at the ratio of the leading coefficients. In the numerator, the leading term is $t,$ with coefficient 1. In the denominator, the leading term is $10t,$ with coefficient 10. The horizontal asymptote will be at the ratio of these values: \\n\\n$t\\\\to∞,C(t)\\\\to\\\\frac{1}{10}$ \\n\\nThis function will have a horizontal asymptote at $y=\\\\frac{1}{10}.$ \\n\\nThis tells us that as the values of t increase, the values of $C$ will approach $\\\\frac{1}{10}.$ In context, this means that, as more time goes by, the concentration of sugar in the tank will approach one-tenth of a pound of sugar per gallon of water or $\\\\frac{1}{10}$ pounds per gallon.\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a1-rd-1\",\"curatedTopicId\":\"openstax:examples:5-7-inverses-and-radical-functions\",\"topicName\":\"Inverses \u0026 Radical Functions (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-5-7-inverses-and-radical-functions-example-2\",\"prompt\":\"Find the inverse of the function $f(x)=5x^{3}+1.$\",\"options\":[\"$$V = 100$\",\"$$[−2,1)\\\\cup[3,∞).$\",\"$$x.$\",\"$$x\\\\ge2,$\"],\"correctIndex\":2,\"hints\":[\"Pull out perfect squares (or cubes) from inside the radical, or rationalize the denominator.\",\"This is a transformation of the basic cubic toolkit function, and based on our knowledge of that function, we know it is one-to-one.\",\"The answer is $x.$.\"],\"solution\":\"This is a transformation of the basic cubic toolkit function, and based on our knowledge of that function, we know it is one-to-one. Solving for the inverse by solving for $x.$ \\n\\n$\\\\begin{array}{ccc}y \u0026 = \u0026 5x^{3}+1 \\\\\\\\ x \u0026 = \u0026 5y^{3}+1 \\\\\\\\ x-1 \u0026 = \u0026 5y^{3} \\\\\\\\ \\\\frac{x-1}{5} \u0026 = \u0026 y^{3} \\\\\\\\ f^{-1}(x) \u0026 = \u0026 \\\\sqrt[3]{\\\\frac{x-1}{5}}\\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-7-inverses-and-radical-functions-example-4\",\"prompt\":\"Finding the Inverse of a Quadratic Function When the Restriction Is Not Specified Restrict the domain and then find the inverse of $f(x)=(x-2)^{2}-3.$\",\"options\":[\"$$V = 100$\",\"$$[−2,1)\\\\cup[3,∞).$\",\"$$x.$\",\"$$x\\\\ge2,$\"],\"correctIndex\":3,\"hints\":[\"Pull out perfect squares (or cubes) from inside the radical, or rationalize the denominator.\",\"We can see this is a parabola with vertex at $(2,–3)$ that opens upward.\",\"The answer is $x\\\\ge2,$.\"],\"solution\":\"$5c\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-7-inverses-and-radical-functions-example-5\",\"prompt\":\"Finding the Inverse of a Radical Function Restrict the domain of the function $f(x)=\\\\sqrt{x-4}$ and then find the inverse.\",\"options\":[\"$$[−2,1)\\\\cup[3,∞).$\",\"$$x\\\\ge2,$\",\"$$x.$\",\"$$V = 100$\"],\"correctIndex\":2,\"hints\":[\"Pull out perfect squares (or cubes) from inside the radical, or rationalize the denominator.\",\"Note that the original function has range $f(x)\\\\ge0.$ Replace $f(x)$ with $y,$ then solve for $x.$ \\n\\n$\\\\begin{array}{cccc}y \u0026 = \u0026 \\\\sqrt{x-4} \u0026 \\\\text{Replace }f(x) \\\\text{with }y.\",\"The answer is $x.$.\"],\"solution\":\"Note that the original function has range $f(x)\\\\ge0.$ Replace $f(x)$ with $y,$ then solve for $x.$ \\n\\n$\\\\begin{array}{cccc}y \u0026 = \u0026 \\\\sqrt{x-4} \u0026 \\\\text{Replace }f(x) \\\\text{with }y. \\\\\\\\ x \u0026 = \u0026 \\\\sqrt{y-4} \u0026 \\\\text{Interchange }x \\\\text{and }y. \\\\\\\\ x \u0026 = \u0026 \\\\sqrt{y-4} \u0026 \\\\text{Square each side}. \\\\\\\\ x^{2} \u0026 = \u0026 y-4 \u0026 \\\\text{Add 4}. \\\\\\\\ x^{2}+4 \u0026 = \u0026 y \u0026 \\\\text{Rename the function }f^{-1}(x). \\\\\\\\ f^{-1}(x) \u0026 = \u0026 x^{2}+4 \u0026 \\\\end{array}$ \\nRecall that the domain of this function must be limited to the range of the original function.\\n\\n$f^{-1}(x)=x^{2}+4,x\\\\ge0$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-7-inverses-and-radical-functions-example-6\",\"prompt\":\"The volume of the cone in terms of the radius is given by $V=\\\\frac{2}{3}πr^{3}$ Find the inverse of the function $V=\\\\frac{2}{3}πr^{3}$ that determines the volume $V$ of a cone and is a function of the radius $r.$ Then use the inverse function to calculate the radius of such a mound of gravel measuring 100 cubic feet. Use $π=3.14.$\",\"options\":[\"$$x\\\\ge2,$\",\"$$x.$\",\"$$[−2,1)\\\\cup[3,∞).$\",\"$$V = 100$\"],\"correctIndex\":3,\"hints\":[\"Pull out perfect squares (or cubes) from inside the radical, or rationalize the denominator.\",\"Start with the given function for $V.$ Notice that the meaningful domain for the function is $r\\\\gt 0$ since negative radii would not make sense in this context nor would a radius of 0.\",\"The answer is $V = 100$.\"],\"solution\":\"Start with the given function for $V.$ Notice that the meaningful domain for the function is $r\\\\gt 0$ since negative radii would not make sense in this context nor would a radius of 0. Also note the range of the function (hence, the domain of the inverse function) is $V\\\\gt 0.$ Solve for $r$ in terms of $V,$ using the method outlined previously. Note that in real-world applications, we do not swap the variables when finding inverses. Instead, we change which variable is considered to be the independent variable.\\n\\n$\\\\begin{array}{cccc}V \u0026 = \u0026 \\\\frac{2}{3}πr^{3} \u0026 \\\\\\\\ r^{3} \u0026 = \u0026 \\\\frac{3V}{2π} \u0026 \\\\text{Solve for }r^{3}. \\\\\\\\ r \u0026 = \u0026 \\\\sqrt[3]{\\\\frac{3V}{2π}} \u0026 \\\\text{Solve for }r.\\\\end{array}$\\n\\nThis is the result stated in the section opener. Now evaluate this for $V=100$ and $π=3.14.$ \\n\\n$\\\\begin{array}{ccc}r \u0026 = \u0026 \\\\sqrt[3]{\\\\frac{3V}{2π}} \\\\\\\\ \u0026 = \u0026 \\\\sqrt[3]{\\\\frac{3\\\\cdot 100}{2\\\\cdot 3.14}} \\\\\\\\ \u0026 \\\\approx \u0026 \\\\sqrt[3]{47.7707} \\\\\\\\ \u0026 \\\\approx \u0026 3.63\\\\end{array}$ \\n\\nTherefore, the radius is about 3.63 ft.\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-7-inverses-and-radical-functions-example-7\",\"prompt\":\"Find the domain of the function $f(x)=\\\\sqrt{\\\\frac{(x+2)(x-3)}{(x-1)}}.$\",\"options\":[\"$$[−2,1)\\\\cup[3,∞).$\",\"$$x\\\\ge2,$\",\"$$x.$\",\"$$V = 100$\"],\"correctIndex\":0,\"hints\":[\"Pull out perfect squares (or cubes) from inside the radical, or rationalize the denominator.\",\"Because a square root is only defined when the quantity under the radical is non-negative, we need to determine where $\\\\frac{(x+2)(x-3)}{(x-1)}\\\\ge0.$ The output of a rational function can change signs…\",\"The answer is $[−2,1)\\\\cup[3,∞).$.\"],\"solution\":\"$5d\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a2-el-1\",\"curatedTopicId\":\"openstax:examples:6-1-exponential-functions\",\"topicName\":\"Exponential Functions (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-6-1-exponential-functions-example-1\",\"prompt\":\"Identifying Exponential Functions Which of the following equations are not exponential functions? $f(x)=4^{3(x-2)}$ $g(x)=x^{3}$ $h(x)=(\\\\frac{1}{3})^{x}$ $j(x)=(-2)^{x}$\",\"options\":[\"$$0.$\",\"$$(2, \\\\text{1}).$\",\"$$the value when$\",\"$$e.$\"],\"correctIndex\":0,\"hints\":[\"Take the log (or natural log) of both sides, then solve the resulting linear equation in the exponent.\",\"By definition, an exponential function has a constant as a base and an independent variable as an exponent.\",\"The answer is $0.$.\"],\"solution\":\"By definition, an exponential function has a constant as a base and an independent variable as an exponent. Thus, $g(x)=x^{3}$ does not represent an exponential function because the base is an independent variable. In fact, $g(x)=x^{3}$ is a power function.\\n\\nRecall that the base b of an exponential function is always a positive constant, and $b\\\\ne1.$ Thus, $j(x)=(−2)^{x}$ does not represent an exponential function because the base, $−2,$ is less than $0.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-1-exponential-functions-example-4\",\"prompt\":\"Writing an Exponential Model When the Initial Value Is Known In 2006, 80 deer were introduced into a wildlife refuge. By 2012, the population had grown to 180 deer. The population was growing exponentially. Write an exponential function $N(t)$ representing the population $(N)$ of deer over time $t.$\",\"options\":[\"$$t$\",\"$$1,000, so$\",\"$$t = 3$\",\"$$0.$\"],\"correctIndex\":0,\"hints\":[\"Take the log (or natural log) of both sides, then solve the resulting linear equation in the exponent.\",\"We let our independent variable $t$ be the number of years after 2006.\",\"The answer is $t$.\"],\"solution\":\"$5e\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"math-verified\",\"source:openstax-college-algebra-2e\",\"worked-example\"]},{\"id\":\"openstax-ca-6-1-exponential-functions-example-5\",\"prompt\":\"Find an exponential function that passes through the points $(-2,6)$ and $(2,1).$\",\"options\":[\"$$t$\",\"$$b$\",\"$$(2, \\\\text{1}).$\",\"$$t = 3$\"],\"correctIndex\":2,\"hints\":[\"Take the log (or natural log) of both sides, then solve the resulting linear equation in the exponent.\",\"Because we don’t have the initial value, we substitute both points into an equation of the form $f(x)=ab^{x},$ and then solve the system for $a$ and $b.$ \\n\\nSubstituting $(-2,6)$ gives $6=ab^{-2}$ \\nSub…\",\"The answer is $(2, \\\\text{1}).$.\"],\"solution\":\"Because we don’t have the initial value, we substitute both points into an equation of the form $f(x)=ab^{x},$ and then solve the system for $a$ and $b.$ \\n\\nSubstituting $(-2,6)$ gives $6=ab^{-2}$ \\nSubstituting $(2,1)$ gives $1=ab^{2}$ \\n\\nUse the first equation to solve for $a$ in terms of $b:$ \\n\\nSubstitute $a$ in the second equation, and solve for $b:$ \\n\\nUse the value of $b$ in the first equation to solve for the value of $a:$ \\n\\nThus, the equation is $f(x)=2.4492(0.6389)^{x}.$ \\n\\nWe can graph our model to check our work. Notice that the graph in Figure 4 passes through the initial points given in the problem, $(-2, \\\\text{6})$ and $(2, \\\\text{1}).$ The graph is an example of an exponential decay function.\\n\\nFigure \\n4 \\n\\nThe graph of $f(x)=2.4492(0.6389)^{x}$ models exponential decay.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-1-exponential-functions-example-7\",\"prompt\":\"Find an Exponential Function Use a graphing calculator to find the exponential equation that includes the points $(2,24.8)$ and $(5,198.4).$\",\"options\":[\"$$t$\",\"$$e.$\",\"$$the value when$\",\"$$y = 6.2\\\\cdot 2^{x}$\"],\"correctIndex\":3,\"hints\":[\"Take the log (or natural log) of both sides, then solve the resulting linear equation in the exponent.\",\"Follow the guidelines above.\",\"The answer is $y = 6.2\\\\cdot 2^{x}$.\"],\"solution\":\"Follow the guidelines above. First press [STAT] , [EDIT] , [1: Edit…], and clear the lists L1 and L2 . Next, in the L1 column, enter the x -coordinates, 2 and 5. Do the same in the L2 column for the y -coordinates, 24.8 and 198.4. \\n\\nNow press [STAT] , [CALC] , [0: ExpReg] and press [ENTER] . The values $a=6.2$ and $b=2$ will be displayed. The exponential equation is $y=6.2\\\\cdot 2^{x}.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-1-exponential-functions-example-8\",\"prompt\":\"Calculating Compound Interest If we invest \\\\$3,000 in an investment account paying 3% interest compounded quarterly, how much will the account be worth in 10 years?\",\"options\":[\"$$0.$\",\"$$y = 6.2\\\\cdot 2^{x}$\",\"$$b$\",\"$$the value when$\"],\"correctIndex\":3,\"hints\":[\"Take the log (or natural log) of both sides, then solve the resulting linear equation in the exponent.\",\"Because we are starting with \\\\$3,000, $P=3000.$ Our interest rate is 3%, so $r \\\\text{}= \\\\text{}0.03.$ Because we are compounding quarterly, we are compounding 4 times per year, so $n=4.$ We want to kn…\",\"The answer is $the value when$.\"],\"solution\":\"Because we are starting with \\\\$3,000, $P=3000.$ Our interest rate is 3%, so $r \\\\text{}= \\\\text{}0.03.$ Because we are compounding quarterly, we are compounding 4 times per year, so $n=4.$ We want to know the value of the account in 10 years, so we are looking for $A(10),$ the value when $t \\\\text{}= \\\\text{}10.$ \\n\\n$\\\\begin{array}{cccccc}A(t) \u0026 =P(1+\\\\frac{r}{n})^{nt} \u0026 \\\\text{Use the compound interest formula}. \\\\\\\\ A(10) \u0026 =3000(1+\\\\frac{0.03}{4})^{4⋅10}\\\\begin{array}{cccc} \u0026 \u0026 \u0026 \\\\end{array} \u0026 \\\\text{Substitute using given values}. \\\\\\\\ \u0026 \\\\approx\\\\text{\\\\$}4045.05 \u0026 \\\\text{Round to two decimal places}.\\\\end{array}$\\n\\nThe account will be worth about \\\\$4,045.05 in 10 years.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-1-exponential-functions-example-10\",\"prompt\":\"Find Powers of e Calculate $e^{3.14}.$ Round to five decimal places.\",\"options\":[\"$$1,000, so$\",\"$$(2, \\\\text{1}).$\",\"$$t$\",\"$$e.$\"],\"correctIndex\":3,\"hints\":[\"Take the log (or natural log) of both sides, then solve the resulting linear equation in the exponent.\",\"On a calculator, press the button labeled $[e^{x}].$ The window shows $[e^( \\\\text{}].$ Type $3.14$ and then close parenthesis, $[)].$ Press [ENTER].\",\"The answer is $e.$.\"],\"solution\":\"On a calculator, press the button labeled $[e^{x}].$ The window shows $[e^( \\\\text{}].$ Type $3.14$ and then close parenthesis, $[)].$ Press [ENTER]. Rounding to $5$ decimal places, $e^{3.14}\\\\approx23.10387.$ Caution: Many scientific calculators have an “Exp” button, which is used to enter numbers in scientific notation. It is not used to find powers of $e.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-1-exponential-functions-example-11\",\"prompt\":\"Calculating Continuous Growth A person invested \\\\$1,000 in an account earning a nominal 10% per year compounded continuously. How much was in the account at the end of one year?\",\"options\":[\"$$y = 6.2\\\\cdot 2^{x}$\",\"$$(2, \\\\text{1}).$\",\"$$1,000, so$\",\"$$e.$\"],\"correctIndex\":2,\"hints\":[\"Take the log (or natural log) of both sides, then solve the resulting linear equation in the exponent.\",\"Since the account is growing in value, this is a continuous compounding problem with growth rate $r=0.10.$ The initial investment was \\\\$1,000, so $P=1000.$ We use the continuous compounding formula to…\",\"The answer is $1,000, so$.\"],\"solution\":\"Since the account is growing in value, this is a continuous compounding problem with growth rate $r=0.10.$ The initial investment was \\\\$1,000, so $P=1000.$ We use the continuous compounding formula to find the value after $t=1$ year: \\n\\n$\\\\begin{array}{cccccc}A(t) \u0026 =Pe^{rt} \u0026 \\\\text{Use the continuous compounding formula}. \\\\\\\\ \u0026 =1000(e)^{0.1}\\\\begin{array}{cccc} \u0026 \u0026 \u0026 \\\\end{array} \u0026 \\\\text{Substitute known values for }P,r, \\\\text{and }t. \\\\\\\\ \u0026 \\\\approx1105.17 \u0026 \\\\text{Use a calculator to approximate}.\\\\end{array}$\\n\\nThe account is worth \\\\$1,105.17 after one year.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-1-exponential-functions-example-12\",\"prompt\":\"Calculating Continuous Decay Radon-222 decays at a continuous rate of 17.3% per day. How much will 100 mg of Radon-222 decay to in 3 days?\",\"options\":[\"$$y = 6.2\\\\cdot 2^{x}$\",\"$$0.$\",\"$$e.$\",\"$$t = 3$\"],\"correctIndex\":3,\"hints\":[\"Take the log (or natural log) of both sides, then solve the resulting linear equation in the exponent.\",\"Since the substance is decaying, the rate, $17.3%$ , is negative.\",\"The answer is $t = 3$.\"],\"solution\":\"Since the substance is decaying, the rate, $17.3%$ , is negative. So, $r \\\\text{}= \\\\text{}-0.173.$ The initial amount of radon-222 was $100$ mg, so $a=100.$ We use the continuous decay formula to find the value after $t=3$ days: \\n\\n$\\\\begin{array}{cccccc}A(t) \u0026 =ae^{rt} \u0026 \\\\text{Use the continuous growth formula}. \\\\\\\\ \u0026 =100e^{-0.173(3)}\\\\begin{array}{cccc} \u0026 \u0026 \u0026 \\\\end{array} \u0026 \\\\text{Substitute known values for }a,r, \\\\text{and }t. \\\\\\\\ \u0026 \\\\approx59.5115 \u0026 \\\\text{Use a calculator to approximate}.\\\\end{array}$\\n\\nSo 59.5115 -2x\\\\gt 0 \u0026 \\\\text{The input must be po…\",\"The answer is $(–∞,\\\\frac{5}{2}).$.\"],\"solution\":\"The logarithmic function is defined only when the input is positive, so this function is defined when $5–2x\\\\gt 0.$ Solving this inequality,\\n\\n$\\\\begin{array}{ccccc}5-2x\\\\gt 0 \u0026 \\\\text{The input must be positive}. \\\\\\\\ -2x\\\\gt -5 \u0026 \\\\text{Subtract }5. \\\\\\\\ x\\\\lt \\\\frac{5}{2}\\\\begin{array}{cccc} \u0026 \u0026 \u0026 \\\\end{array} \u0026 \\\\text{Divide by }-2 \\\\text{and switch the inequality}.\\\\end{array}$\\n\\nThe domain of $f(x)=\\\\log(5-2x)$ is $(–∞,\\\\frac{5}{2}).$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-4-graphs-of-logarithmic-functions-example-3\",\"prompt\":\"Graph $f(x)=\\\\log_{5}(x).$ State the domain, range, and asymptote.\",\"options\":[\"$$x = -4$\",\"$$x = 0$\",\"$$(–∞,\\\\frac{5}{2}).$\",\"$$x = 2$\"],\"correctIndex\":1,\"hints\":[\"Use the log rules: product → sum, quotient → difference, power → factor in front, change of base.\",\"Before graphing, identify the behavior and key points for the graph.\",\"The answer is $x = 0$.\"],\"solution\":\"Before graphing, identify the behavior and key points for the graph.\\n\\nSince $b=5$ is greater than one, we know the function is increasing. The left tail of the graph will approach the vertical asymptote $x=0,$ and the right tail will increase slowly without bound. \\nThe x -intercept is $(1,0).$ \\nThe key point $(5,1)$ is on the graph. \\nWe draw and label the asymptote, plot and label the points, and draw a smooth curve through the points (see Figure 5 ). \\n\\nFigure \\n5 \\n\\nThe domain is $(0,∞),$ the range is $(-∞,∞),$ and the vertical asymptote is $x=0.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-4-graphs-of-logarithmic-functions-example-4\",\"prompt\":\"Sketch the horizontal shift $f(x)=\\\\log_{3}(x-2)$ alongside its parent function. Include the key points and asymptotes on the graph. State the domain, range, and asymptote.\",\"options\":[\"$$x = 2$\",\"$$x = -4$\",\"$$(-3,∞).$\",\"$$x\\\\approx1.339.$\"],\"correctIndex\":0,\"hints\":[\"Use the log rules: product → sum, quotient → difference, power → factor in front, change of base.\",\"Since the function is $f(x)=\\\\log_{3}(x-2),$ we notice $x+(-2)=x–2.$ \\n\\nThus $c=-2,$ so $c\\\\lt 0.$ This means we will shift the function $f(x)=\\\\log_{3}(x)$ right 2 units.\",\"The answer is $x = 2$.\"],\"solution\":\"Since the function is $f(x)=\\\\log_{3}(x-2),$ we notice $x+(-2)=x–2.$ \\n\\nThus $c=-2,$ so $c\\\\lt 0.$ This means we will shift the function $f(x)=\\\\log_{3}(x)$ right 2 units.\\n\\nThe vertical asymptote is $x=-(-2)$ or $x=2.$ \\n\\nConsider the three key points from the parent function, $(\\\\frac{1}{3},−1),$ $(1,0),$ and $(3,1).$ \\n\\nThe new coordinates are found by adding 2 to the $x$ coordinates.\\n\\nLabel the points $(\\\\frac{7}{3},−1),$ $(3,0),$ and $(5,1).$ \\n\\nThe domain is $(2,∞),$ the range is $(-∞,∞),$ and the vertical asymptote is $x=2.$ \\n\\nFigure \\n7\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-4-graphs-of-logarithmic-functions-example-5\",\"prompt\":\"Sketch a graph of $f(x)=\\\\log_{3}(x)-2$ alongside its parent function. Include the key points and asymptote on the graph. State the domain, range, and asymptote.\",\"options\":[\"$$(-3,∞).$\",\"$$x\\\\approx1.339.$\",\"$$x = 0$\",\"$$x = -2$\"],\"correctIndex\":2,\"hints\":[\"Use the log rules: product → sum, quotient → difference, power → factor in front, change of base.\",\"Since the function is $f(x)=\\\\log_{3}(x)-2,$ we will notice $d=–2.$ Thus $d\\\\lt 0.$ \\n\\nThis means we will shift the function $f(x)=\\\\log_{3}(x)$ down 2 units.\",\"The answer is $x = 0$.\"],\"solution\":\"Since the function is $f(x)=\\\\log_{3}(x)-2,$ we will notice $d=–2.$ Thus $d\\\\lt 0.$ \\n\\nThis means we will shift the function $f(x)=\\\\log_{3}(x)$ down 2 units.\\n\\nThe vertical asymptote is $x=0.$ \\n\\nConsider the three key points from the parent function, $(\\\\frac{1}{3},−1),$ $(1,0),$ and $(3,1).$ \\n\\nThe new coordinates are found by subtracting 2 from the y coordinates.\\n\\nLabel the points $(\\\\frac{1}{3},−3),$ $(1,−2),$ and $(3,−1).$ \\n\\nThe domain is $(0,∞),$ the range is $(-∞,∞),$ and the vertical asymptote is $x=0.$ \\n\\nFigure \\n9 \\n\\nThe domain is $(0,∞),$ the range is $(-∞,∞),$ and the vertical asymptote is $x=0.$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-4-graphs-of-logarithmic-functions-example-7\",\"prompt\":\"Sketch a graph of $f(x)=5\\\\log(x+2).$ State the domain, range, and asymptote.\",\"options\":[\"$$x = -4$\",\"$$x = -2$\",\"$$(-3,∞).$\",\"$$x = 2$\"],\"correctIndex\":1,\"hints\":[\"Use the log rules: product → sum, quotient → difference, power → factor in front, change of base.\",\"Remember: what happens inside parentheses happens first.\",\"The answer is $x = -2$.\"],\"solution\":\"Remember: what happens inside parentheses happens first. First, we move the graph left 2 units, then stretch the function vertically by a factor of 5, as in Figure 12 . The vertical asymptote will be shifted to $x=−2.$ The x -intercept will be $(−1,0).$ The domain will be $(−2,∞).$ Two points will help give the shape of the graph: $(−1,0)$ and $(8,5).$ We chose $x=8$ as the x -coordinate of one point to graph because when $x=8,$ $x+2=10,$ the base of the common logarithm.\\n\\nFigure \\n12 \\n\\nThe domain is $(-2,∞),$ the range is $(-∞,∞),$ and the vertical asymptote is $x=-2.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-4-graphs-of-logarithmic-functions-example-8\",\"prompt\":\"Sketch a graph of $f(x)=\\\\log(-x)$ alongside its parent function. Include the key points and asymptote on the graph. State the domain, range, and asymptote.\",\"options\":[\"$$x = 0$\",\"$$x = 2$\",\"$$x\\\\approx1.339.$\",\"$$(–∞,\\\\frac{5}{2}).$\"],\"correctIndex\":0,\"hints\":[\"Use the log rules: product → sum, quotient → difference, power → factor in front, change of base.\",\"Before graphing $f(x)=\\\\log(-x),$ identify the behavior and key points for the graph.\",\"The answer is $x = 0$.\"],\"solution\":\"Before graphing $f(x)=\\\\log(-x),$ identify the behavior and key points for the graph.\\nSince $b=10$ is greater than one, we know that the parent function is increasing. Since the input value is multiplied by $−1,$ $f$ is a reflection of the parent graph about the y- axis. Thus, $f(x)=\\\\log(-x)$ will be decreasing as $x$ moves from negative infinity to zero, and the right tail of the graph will approach the vertical asymptote $x=0.$ \\nThe x -intercept is $(−1,0).$ \\nWe draw and label the asymptote, plot and label the points, and draw a smooth curve through the points. \\n\\nFigure \\n14 \\n\\nThe domain is $(-∞,0),$ the range is $(-∞,∞),$ and the vertical asymptote is $x=0.$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-4-graphs-of-logarithmic-functions-example-9\",\"prompt\":\"Solve $4\\\\ln(x)+1=-2\\\\ln(x-1)$ graphically. Round to the nearest thousandth.\",\"options\":[\"$$(2,–1)$\",\"$$x\\\\approx1.339.$\",\"$$x = 2$\",\"$$x = -4$\"],\"correctIndex\":1,\"hints\":[\"Use the log rules: product → sum, quotient → difference, power → factor in front, change of base.\",\"Press [Y=] and enter $4\\\\ln(x)+1$ next to Y 1 =.\",\"The answer is $x\\\\approx1.339.$.\"],\"solution\":\"Press [Y=] and enter $4\\\\ln(x)+1$ next to Y 1 =. Then enter $-2\\\\ln(x-1)$ next to Y 2 = . For a window, use the values 0 to 5 for $x$ and –10 to 10 for $y.$ Press [GRAPH] . The graphs should intersect somewhere a little to right of $x=1.$ \\n\\nFor a better approximation, press [2ND] then [CALC] . Select [5: intersect] and press [ENTER] three times. The x -coordinate of the point of intersection is displayed as 1.3385297. (Your answer may be different if you use a different window or use a different value for Guess? ) So, to the nearest thousandth, $x\\\\approx1.339.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-4-graphs-of-logarithmic-functions-example-10\",\"prompt\":\"Graph What is the vertical asymptote of $f(x)=−2\\\\log_{3}(x+4)+5?$\",\"options\":[\"$$x = -4$\",\"$$(-3,∞).$\",\"$$x = 0$\",\"$$(2,–1)$\"],\"correctIndex\":0,\"hints\":[\"Use the log rules: product → sum, quotient → difference, power → factor in front, change of base.\",\"The vertical asymptote is at $x=-4.$\",\"The answer is $x = -4$.\"],\"solution\":\"The vertical asymptote is at $x=-4.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a2-lg-1\",\"curatedTopicId\":\"openstax:examples:6-5-logarithmic-properties\",\"topicName\":\"Logarithm Properties (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-6-5-logarithmic-properties-example-1\",\"prompt\":\"Expand $\\\\log_{3}(30x(3x+4)).$\",\"options\":[\"$$e.$\",\"$$x,$\",\"$$P = –\\\\log(C),$\",\"$$30$\"],\"correctIndex\":3,\"hints\":[\"Use the log rules: product → sum, quotient → difference, power → factor in front, change of base.\",\"We begin by factoring the argument completely, expressing $30$ as a product of primes.\",\"The answer is $30$.\"],\"solution\":\"We begin by factoring the argument completely, expressing $30$ as a product of primes.\\n\\n$\\\\log_{3}(30x(3x+4))=\\\\log_{3}(2\\\\cdot 3\\\\cdot 5\\\\cdot x\\\\cdot (3x+4))$ \\n\\nNext we write the equivalent equation by summing the logarithms of each factor.\\n\\n$\\\\log_{3}(30x(3x+4))=\\\\log_{3}(2)+\\\\log_{3}(3)+\\\\log_{3}(5)+\\\\log_{3}(x)+\\\\log_{3}(3x+4)$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-5-logarithmic-properties-example-3\",\"prompt\":\"Expand $\\\\log_{2}x^{5}.$\",\"options\":[\"$$30$\",\"$$P = –\\\\log(C),$\",\"$$n = e$\",\"$$x,$\"],\"correctIndex\":3,\"hints\":[\"Use the log rules: product → sum, quotient → difference, power → factor in front, change of base.\",\"The argument is already written as a power, so we identify the exponent, 5, and the base, $x,$ and rewrite the equivalent expression by multiplying the exponent times the logarithm of the base.\",\"The answer is $x,$.\"],\"solution\":\"The argument is already written as a power, so we identify the exponent, 5, and the base, $x,$ and rewrite the equivalent expression by multiplying the exponent times the logarithm of the base.\\n$\\\\log_{2}(x^{5})=5\\\\log_{2}x$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-5-logarithmic-properties-example-5\",\"prompt\":\"Rewrite $4\\\\ln(x)$ using the power rule for logs to a single logarithm with a leading coefficient of 1.\",\"options\":[\"$$30$\",\"$$x,$\",\"$$P = –\\\\log(C),$\",\"$$n = e$\"],\"correctIndex\":1,\"hints\":[\"Use the log rules: product → sum, quotient → difference, power → factor in front, change of base.\",\"Because the logarithm of a power is the product of the exponent times the logarithm of the base, it follows that the product of a number and a logarithm can be written as a power.\",\"The answer is $x,$.\"],\"solution\":\"Because the logarithm of a power is the product of the exponent times the logarithm of the base, it follows that the product of a number and a logarithm can be written as a power. For the expression $4\\\\ln(x),$ we identify the factor, 4, as the exponent and the argument, $x,$ as the base, and rewrite the product as a logarithm of a power: $4\\\\ln(x)=\\\\ln(x^{4}).$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-5-logarithmic-properties-example-9\",\"prompt\":\"Combine Logarithms Write $\\\\log_{3}(5)+\\\\log_{3}(8)-\\\\log_{3}(2)$ as a single logarithm.\",\"options\":[\"$$x,$\",\"$$\\\\log_{3}(40)-\\\\log_{3}(2)$\",\"$$e.$\",\"$$n = e$\"],\"correctIndex\":1,\"hints\":[\"Use the log rules: product → sum, quotient → difference, power → factor in front, change of base.\",\"Using the product and quotient rules\\n\\n$\\\\log_{3}(5)+\\\\log_{3}(8)=\\\\log_{3}(5\\\\cdot 8)=\\\\log_{3}(40)$ \\n\\nThis reduces our original expression to\\n\\n$\\\\log_{3}(40)-\\\\log_{3}(2)$ \\nThen, using the quotient rule\\n\\n$\\\\…\",\"The answer is $\\\\log_{3}(40)-\\\\log_{3}(2)$.\"],\"solution\":\"Using the product and quotient rules\\n\\n$\\\\log_{3}(5)+\\\\log_{3}(8)=\\\\log_{3}(5\\\\cdot 8)=\\\\log_{3}(40)$ \\n\\nThis reduces our original expression to\\n\\n$\\\\log_{3}(40)-\\\\log_{3}(2)$ \\nThen, using the quotient rule\\n\\n$\\\\log_{3}(40)-\\\\log_{3}(2)=\\\\log_{3}(\\\\frac{40}{2})=\\\\log_{3}(20)$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-5-logarithmic-properties-example-11\",\"prompt\":\"Rewrite $2\\\\logx-4\\\\log(x+5)+\\\\frac{1}{x}\\\\log(3x+5)$ as a single logarithm.\",\"options\":[\"$$\\\\log(x^{2})-\\\\log(x+5)^{4}+\\\\log((3x+5)^{x^{-1}})$\",\"$$30$\",\"$$n = e$\",\"$$x,$\"],\"correctIndex\":0,\"hints\":[\"Use the log rules: product → sum, quotient → difference, power → factor in front, change of base.\",\"We apply the power rule first:\\n\\n$2\\\\logx–4\\\\log(x+5)+\\\\frac{1}{x}\\\\log(3x+5)=\\\\log(x^{2})-\\\\log(x+5)^{4}+\\\\log((3x+5)^{x^{-1}})$ \\nNext we rearrange and apply the product rule to the sum:\\n\\n$\\\\log(x^{2})-\\\\log(x…\",\"The answer is $\\\\log(x^{2})-\\\\log(x+5)^{4}+\\\\log((3x+5)^{x^{-1}})$.\"],\"solution\":\"We apply the power rule first:\\n\\n$2\\\\logx–4\\\\log(x+5)+\\\\frac{1}{x}\\\\log(3x+5)=\\\\log(x^{2})-\\\\log(x+5)^{4}+\\\\log((3x+5)^{x^{-1}})$ \\nNext we rearrange and apply the product rule to the sum:\\n\\n$\\\\log(x^{2})-\\\\log(x+5)^{4}+\\\\log((3x+5)^{x^{-1}})$ $=\\\\log(x^{2})+\\\\log((3x+5)^{x^{-1}})-\\\\log(x+5)^{4}$ $=\\\\log(x^{2}(3x+5)^{x^{-1}})-\\\\log(x+5)^{4}$ \\nFinally, we apply the quotient rule to the difference:\\n\\n$=\\\\log(x^{2}(3x+5)^{x^{−1}})-\\\\log(x+5)^{4}=\\\\log\\\\frac{x^{2}(3x+5)^{x^{−1}}}{(x+5)^{4}}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-5-logarithmic-properties-example-12\",\"prompt\":\"Applying of the Laws of Logs Recall that, in chemistry, $\\\\text{pH}=-\\\\log[H^{+}].$ If the concentration of hydrogen ions in a liquid is doubled, what is the effect on pH?\",\"options\":[\"$$\\\\log(x^{2})-\\\\log(x+5)^{4}+\\\\log((3x+5)^{x^{-1}})$\",\"$$n = e$\",\"$$P = –\\\\log(C),$\",\"$$e.$\"],\"correctIndex\":2,\"hints\":[\"Use the log rules: product → sum, quotient → difference, power → factor in front, change of base.\",\"Suppose $C$ is the original concentration of hydrogen ions, and $P$ is the original pH of the liquid.\",\"The answer is $P = –\\\\log(C),$.\"],\"solution\":\"Suppose $C$ is the original concentration of hydrogen ions, and $P$ is the original pH of the liquid. Then $P=–\\\\log(C).$ If the concentration is doubled, the new concentration is $2C.$ Then the pH of the new liquid is\\n$\\\\text{pH}=-\\\\log(2C)$ \\nUsing the product rule of logs\\n\\n$\\\\text{pH}=-\\\\log(2C)=-(\\\\log(2)+\\\\log(C))=-\\\\log(2)-\\\\log(C)$ \\n\\nSince $P=–\\\\log(C),$ the new pH is\\n\\n$\\\\text{pH}=P-\\\\log(2)\\\\approxP-0.301$ \\nWhen the concentration of hydrogen ions is doubled, the pH decreases by about 0.301.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-5-logarithmic-properties-example-13\",\"prompt\":\"Changing Logarithmic Expressions to Expressions Involving Only Natural Logs Change $\\\\log_{5}3$ to a quotient of natural logarithms.\",\"options\":[\"$$x,$\",\"$$e.$\",\"$$P = –\\\\log(C),$\",\"$$n = e$\"],\"correctIndex\":3,\"hints\":[\"Use the log rules: product → sum, quotient → difference, power → factor in front, change of base.\",\"Because we will be expressing $\\\\log_{5}3$ as a quotient of natural logarithms, the new base, $n=e.$ \\n\\nWe rewrite the log as a quotient using the change-of-base formula.\",\"The answer is $n = e$.\"],\"solution\":\"Because we will be expressing $\\\\log_{5}3$ as a quotient of natural logarithms, the new base, $n=e.$ \\n\\nWe rewrite the log as a quotient using the change-of-base formula. The numerator of the quotient will be the natural log with argument 3. The denominator of the quotient will be the natural log with argument 5.\\n\\n$\\\\begin{array}{cc}\\\\log_{b}M \u0026 =\\\\frac{\\\\lnM}{\\\\lnb} \\\\\\\\ \\\\log_{5}3 \u0026 =\\\\frac{\\\\ln3}{\\\\ln5}\\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-5-logarithmic-properties-example-14\",\"prompt\":\"Evaluate $\\\\log_{2}(10)$ using the change-of-base formula with a calculator.\",\"options\":[\"$$\\\\log_{3}(40)-\\\\log_{3}(2)$\",\"$$n = e$\",\"$$30$\",\"$$e.$\"],\"correctIndex\":3,\"hints\":[\"Use the log rules: product → sum, quotient → difference, power → factor in front, change of base.\",\"According to the change-of-base formula, we can rewrite the log base 2 as a logarithm of any other base.\",\"The answer is $e.$.\"],\"solution\":\"According to the change-of-base formula, we can rewrite the log base 2 as a logarithm of any other base. Since our calculators can evaluate the natural log, we might choose to use the natural logarithm, which is the log base $e.$ \\n\\n$\\\\begin{array}{cc}\\\\log_{2}10=\\\\frac{\\\\ln10}{\\\\ln2} \u0026 \\\\text{Apply the change of base formula using base }e. \\\\\\\\ \\\\approx3.3219 \u0026 \\\\text{Use a calculator to evaluate to 4 decimal places}.\\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a2-el-1\",\"curatedTopicId\":\"openstax:examples:6-7-exponential-and-logarithmic-models\",\"topicName\":\"Exponential \u0026 Logarithmic Models (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-6-7-exponential-and-logarithmic-models-example-1\",\"prompt\":\"Graphing Exponential Growth A population of bacteria doubles every hour. If the culture started with 10 bacteria, graph the population as a function of time.\",\"options\":[\"$$y = 10e^{(\\\\ln2)t}$\",\"$$t:$\",\"$$t,$\",\"$$\\\\text{70°F}\\\\text{.}$\"],\"correctIndex\":0,\"hints\":[\"Take the log (or natural log) of both sides, then solve the resulting linear equation in the exponent.\",\"When an amount grows at a fixed percent per unit time, the growth is exponential.\",\"The answer is $y = 10e^{(\\\\ln2)t}$.\"],\"solution\":\"When an amount grows at a fixed percent per unit time, the growth is exponential. To find $A_{0}$ we use the fact that $A_{0}$ is the amount at time zero, so $A_{0}=10.$ To find $k,$ use the fact that after one hour $(t=1)$ the population doubles from $10$ to $20.$ The formula is derived as follows\\n\\n$\\\\begin{array}{cc}20=10e^{k\\\\cdot 1} \u0026 \\\\\\\\ 2=e^{k} \u0026 \\\\text{Divide by 10} \\\\\\\\ \\\\ln2=k \u0026 \\\\text{Take the natural logarithm}\\\\end{array}$\\n\\nso $k=\\\\ln(2).$ Thus the equation we want to graph is $y=10e^{(\\\\ln2)t}=10(e^{\\\\ln2})^{t}=10\\\\cdot 2^{t}.$ The graph is shown in Figure 5 .\\n\\nFigure \\n5 \\n\\nThe graph of $y=10e^{(\\\\ln2)t}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-7-exponential-and-logarithmic-models-example-2\",\"prompt\":\"Express the amount of carbon-14 remaining as a function of time, $t.$\",\"options\":[\"$$\\\\text{70°F}\\\\text{.}$\",\"$$y = \\\\ln(x^{2})$\",\"$$t,$\",\"$$t:$\"],\"correctIndex\":2,\"hints\":[\"Take the log (or natural log) of both sides, then solve the resulting linear equation in the exponent.\",\"This formula is derived as follows.\",\"The answer is $t,$.\"],\"solution\":\"This formula is derived as follows.\\n\\n$\\\\begin{array}{cc}A=A_{0}e^{kt} \u0026 \\\\text{The continuous growth formula}. \\\\\\\\ 0.5A_{0}=A_{0}e^{k\\\\cdot 5730} \u0026 \\\\text{Substitute the half-life for }t \\\\text{and }0.5A_{0} \\\\text{for }f(t). \\\\\\\\ 0.5=e^{5730k} \u0026 \\\\text{Divide by }A_{0}. \\\\\\\\ \\\\ln(0.5)=5730k \u0026 \\\\text{Take the natural log of both sides}. \\\\\\\\ k=\\\\frac{\\\\ln(0.5)}{5730} \u0026 \\\\text{Divide by the coefficient of }k. \\\\\\\\ A=A_{0}e^{(\\\\frac{\\\\ln(0.5)}{5730})t} \u0026 \\\\text{Substitute for }r \\\\text{in the continuous growth formula}.\\\\end{array}$\\n\\nThe function that describes this continuous decay is $f(t)=A_{0}e^{(\\\\frac{\\\\ln(0.5)}{5730})t}.$ We observe that the coefficient of $t,$ $\\\\frac{\\\\ln(0.5)}{5730}\\\\approx-1.2097\\\\times \\\\mathrm{10}^{−4}$ is negative, as expected in the case of exponential decay.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"math-verified\",\"source:openstax-college-algebra-2e\",\"worked-example\"]},{\"id\":\"openstax-ca-6-7-exponential-and-logarithmic-models-example-3\",\"prompt\":\"Finding the Age of a Bone A bone fragment is found that contains 20% of its original carbon-14. To the nearest year, how old is the bone?\",\"options\":[\"$$t,$\",\"$$t:$\",\"$$y = 10e^{(\\\\ln2)t}$\",\"$$\\\\text{70°F}\\\\text{.}$\"],\"correctIndex\":1,\"hints\":[\"Take the log (or natural log) of both sides, then solve the resulting linear equation in the exponent.\",\"We substitute $20%=0.20$ for $r$ in the equation and solve for $t:$ \\n$\\\\begin{array}{ccccc}t=\\\\frac{\\\\ln(r)}{-0.000121} \u0026 \\\\text{Use the general form of the equation}.\",\"The answer is $t:$.\"],\"solution\":\"We substitute $20%=0.20$ for $r$ in the equation and solve for $t:$ \\n$\\\\begin{array}{ccccc}t=\\\\frac{\\\\ln(r)}{-0.000121} \u0026 \\\\text{Use the general form of the equation}. \\\\\\\\ =\\\\frac{\\\\ln(0.20)}{-0.000121}\\\\begin{array}{cccc} \u0026 \u0026 \u0026 \\\\end{array} \u0026 \\\\text{Substitute for }r. \\\\\\\\ \\\\approx13301 \u0026 \\\\text{Round to the nearest year}.\\\\end{array}$\\n\\nThe bone fragment is about 13,301 years old.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-7-exponential-and-logarithmic-models-example-4\",\"prompt\":\"Finding a Function That Describes Exponential Growth According to Moore’s Law, the doubling time for the number of transistors that can be put on a computer chip is approximately two years. Give a function that describes this behavior.\",\"options\":[\"$$y = \\\\ln(x^{2})$\",\"$$\\\\text{70°F}\\\\text{.}$\",\"$$A_{0}e^{\\\\frac{\\\\ln2}{2}t}.$\",\"$$y = 10e^{(\\\\ln2)t}$\"],\"correctIndex\":2,\"hints\":[\"Take the log (or natural log) of both sides, then solve the resulting linear equation in the exponent.\",\"The formula is derived as follows:\\n\\n$\\\\begin{array}{ccccc}t=\\\\frac{\\\\ln2}{k} \u0026 \\\\text{The doubling time formula}.\",\"The answer is $A_{0}e^{\\\\frac{\\\\ln2}{2}t}.$.\"],\"solution\":\"The formula is derived as follows:\\n\\n$\\\\begin{array}{ccccc}t=\\\\frac{\\\\ln2}{k} \u0026 \\\\text{The doubling time formula}. \\\\\\\\ 2=\\\\frac{\\\\ln2}{k} \u0026 \\\\text{Use a doubling time of two years}. \\\\\\\\ k=\\\\frac{\\\\ln2}{2} \u0026 \\\\text{Multiply by} k \\\\text{and divide by 2}. \\\\\\\\ A =A_{0}e^{\\\\frac{\\\\ln2}{2}t}\\\\begin{array}{cccc} \u0026 \u0026 \u0026 \\\\end{array} \u0026 \\\\text{Substitute} k \\\\text{into the continuous growth formula}.\\\\end{array}$\\n\\nThe function is $A_{0}e^{\\\\frac{\\\\ln2}{2}t}.$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-7-exponential-and-logarithmic-models-example-5\",\"prompt\":\"Using Newton’s Law of Cooling A cheesecake is taken out of the oven with an ideal internal temperature of $\\\\text{165°F,}$ and is placed into a $35°F$ refrigerator. After 10 minutes, the cheesecake has cooled to $\\\\text{150°F}\\\\text{.}$ If we must wait until the cheesecake has cooled to $\\\\text{70°F}$ before we eat it, how long will we have to wait?\",\"options\":[\"$$y = 10e^{(\\\\ln2)t}$\",\"$$\\\\text{70°F}\\\\text{.}$\",\"$$t,$\",\"$$A_{0}e^{\\\\frac{\\\\ln2}{2}t}.$\"],\"correctIndex\":1,\"hints\":[\"Take the log (or natural log) of both sides, then solve the resulting linear equation in the exponent.\",\"Because the surrounding air temperature in the refrigerator is 35 degrees, the cheesecake’s temperature will decay exponentially toward 35, following the equation\\n\\n$T(t)=Ae^{kt}+35$ \\nWe know the initi…\",\"The answer is $\\\\text{70°F}\\\\text{.}$.\"],\"solution\":\"$5f\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-6-7-exponential-and-logarithmic-models-example-7\",\"prompt\":\"Find the model, and use a graph to check your choice. $x$ 1 2 3 4 5 6 7 8 9 $y$ 0 1.386 2.197 2.773 3.219 3.584 3.892 4.159 4.394 Table 1\",\"options\":[\"$$\\\\text{70°F}\\\\text{.}$\",\"$$t:$\",\"$$y = 10e^{(\\\\ln2)t}$\",\"$$y = \\\\ln(x^{2})$\"],\"correctIndex\":3,\"hints\":[\"Take the log (or natural log) of both sides, then solve the resulting linear equation in the exponent.\",\"First, plot the data on a graph as in Figure 8 .\",\"The answer is $y = \\\\ln(x^{2})$.\"],\"solution\":\"$60\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a1-sy-1\",\"curatedTopicId\":\"openstax:examples:7-1-systems-of-linear-equations-two-variables\",\"topicName\":\"Systems of Linear Equations (Two Variables) (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-7-1-systems-of-linear-equations-two-variables-example-1\",\"prompt\":\"Determine whether the ordered pair $(5,1)$ is a solution to the given system of equations. $\\\\begin{array}{c} x+3y=8 \\\\\\\\ 2x-9=y\\\\end{array}$\",\"options\":[\"$$(−3,−2),$\",\"$$(5,1)$\",\"$$800$\",\"$$(50,000,77,500).$\"],\"correctIndex\":1,\"hints\":[\"Choose substitution if one variable is already isolated, otherwise use elimination by adding multiples of the equations.\",\"Substitute the ordered pair $(5,1)$ into both equations.\",\"The answer is $(5,1)$.\"],\"solution\":\"Substitute the ordered pair $(5,1)$ into both equations.\\n$\\\\begin{array}{cc}(5)+3(1)=8 \u0026 \\\\\\\\ 8=8 \u0026 \\\\text{True} \\\\\\\\ 2(5)-9=(1) \u0026 \\\\\\\\ \\\\text{1=1} \u0026 \\\\text{True}\\\\end{array}$\\n\\nThe ordered pair $(5,1)$ satisfies both equations, so it is the solution to the system.\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-1-systems-of-linear-equations-two-variables-example-2\",\"prompt\":\"Identify the type of system. $\\\\begin{array}{c}2x+y=−8 \\\\\\\\ x-y=−1\\\\end{array}$\",\"options\":[\"$$(−3,−2),$\",\"$$x$\",\"$$(50,000,77,500).$\",\"$$(8,3)$\"],\"correctIndex\":0,\"hints\":[\"Choose substitution if one variable is already isolated, otherwise use elimination by adding multiples of the equations.\",\"Solve the first equation for $y.$ \\n\\n$\\\\begin{array}{c}2x+y=−8 \\\\\\\\ y=−2x−8\\\\end{array}$\\n\\nSolve the second equation for $y.$ \\n\\n$\\\\begin{array}{c}x-y=−1 \\\\\\\\ y=x+1\\\\end{array}$\\n\\nGraph both equations on the same…\",\"The answer is $(−3,−2),$.\"],\"solution\":\"Solve the first equation for $y.$ \\n\\n$\\\\begin{array}{c}2x+y=−8 \\\\\\\\ y=−2x−8\\\\end{array}$\\n\\nSolve the second equation for $y.$ \\n\\n$\\\\begin{array}{c}x-y=−1 \\\\\\\\ y=x+1\\\\end{array}$\\n\\nGraph both equations on the same set of axes as in Figure 4 .\\n\\nFigure \\n4 \\n\\nThe lines appear to intersect at the point $(−3,−2).$ We can check to make sure that this is the solution to the system by substituting the ordered pair into both equations.\\n$\\\\begin{array}{cc}2(−3)+(−2)=−8 \u0026 \\\\\\\\ −8=−8 \u0026 \\\\text{True} \\\\\\\\ (−3)-(−2)=−1 \u0026 \\\\\\\\ −1=−1 \u0026 \\\\text{True}\\\\end{array}$\\n\\nThe solution to the system is the ordered pair $(−3,−2),$ so the system is independent.\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-1-systems-of-linear-equations-two-variables-example-3\",\"prompt\":\"$$\\\\begin{array}{c}-x+y=−5 \\\\\\\\ 2x-5y=1\\\\end{array}$\",\"options\":[\"$$(5,1)$\",\"$$(-\\\\frac{7}{3},\\\\frac{2}{3}).$\",\"$$(8,3)$\",\"$$(\\\\frac{11}{2},7).$\"],\"correctIndex\":2,\"hints\":[\"Choose substitution if one variable is already isolated, otherwise use elimination by adding multiples of the equations.\",\"First, we will solve the first equation for $y.$ \\n\\n$\\\\begin{array}{c}-x+y=−5 \\\\\\\\ y=x−5\\\\end{array}$\\n\\nNow we can substitute the expression $x−5$ for $y$ in the second equation.\",\"The answer is $(8,3)$.\"],\"solution\":\"First, we will solve the first equation for $y.$ \\n\\n$\\\\begin{array}{c}-x+y=−5 \\\\\\\\ y=x−5\\\\end{array}$\\n\\nNow we can substitute the expression $x−5$ for $y$ in the second equation.\\n\\n$\\\\begin{array}{c}2x-5y=1 \\\\\\\\ 2x-5(x-5)=1 \\\\\\\\ 2x-5x+25=1 \\\\\\\\ -3x=−24 \\\\\\\\ x=8\\\\end{array}$\\n\\nNow, we substitute $x=8$ into the first equation and solve for $y.$ \\n\\n$\\\\begin{array}{c}-(8)+y=−5 \\\\\\\\ y=3\\\\end{array}$\\n\\nOur solution is $(8,3).$ \\n\\nCheck the solution by substituting $(8,3)$ into both equations.\\n\\n$\\\\begin{array}{cccc}-x+y=-5 \u0026 \u0026 \u0026 \\\\\\\\ -(8)+(3)=-5 \u0026 \u0026 \u0026 \\\\text{True} \\\\\\\\ 2x-5y=1 \u0026 \u0026 \u0026 \\\\\\\\ 2(8)-5(3)=1 \u0026 \u0026 \u0026 \\\\text{True}\\\\end{array}$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-1-systems-of-linear-equations-two-variables-example-4\",\"prompt\":\"$$\\\\begin{array}{c}x+2y=−1 \\\\\\\\ -x+y=3\\\\end{array}$\",\"options\":[\"$$800$\",\"$$(5,1)$\",\"$$(50,000,77,500).$\",\"$$(-\\\\frac{7}{3},\\\\frac{2}{3}).$\"],\"correctIndex\":3,\"hints\":[\"Choose substitution if one variable is already isolated, otherwise use elimination by adding multiples of the equations.\",\"Both equations are already set equal to a constant.\",\"The answer is $(-\\\\frac{7}{3},\\\\frac{2}{3}).$.\"],\"solution\":\"Both equations are already set equal to a constant. Notice that the coefficient of $x$ in the second equation, –1, is the opposite of the coefficient of $x$ in the first equation, 1. We can add the two equations to eliminate $x$ without needing to multiply by a constant.\\n\\n$\\\\frac{\\\\begin{array}{c} \\\\\\\\ x+2y=-1 \\\\\\\\ -x+y=3\\\\end{array}}{\\\\text{}\\\\text{}\\\\text{}\\\\text{}\\\\text{}3y=2}$\\n\\nNow that we have eliminated $x,$ we can solve the resulting equation for $y.$ \\n\\n$\\\\begin{array}{c}3y=2 \\\\\\\\ y=\\\\frac{2}{3}\\\\end{array}$\\n\\nThen, we substitute this value for $y$ into one of the original equations and solve for $x.$ \\n\\n$\\\\begin{array}{c}-x+y=3 \\\\\\\\ -x+\\\\frac{2}{3}=3 \\\\\\\\ -x=3-\\\\frac{2}{3} \\\\\\\\ -x=\\\\frac{7}{3} \\\\\\\\ x=-\\\\frac{7}{3}\\\\end{array}$\\n\\nThe solution to this system is $(-\\\\frac{7}{3},\\\\frac{2}{3}).$ \\n\\nCheck the solution in the first equation.\\n\\n$\\\\begin{array}{cccc}x+2y=−1 \u0026 \u0026 \u0026 \\\\\\\\ (-\\\\frac{7}{3})+2(\\\\frac{2}{3})= \u0026 \u0026 \u0026 \\\\\\\\ -\\\\frac{7}{3}+\\\\frac{4}{3}= \u0026 \u0026 \u0026 \\\\\\\\ -\\\\frac{3}{3}= \u0026 \u0026 \u0026 \\\\\\\\ −1=−1 \u0026 \u0026 \u0026 \\\\text{True}\\\\end{array}$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-1-systems-of-linear-equations-two-variables-example-7\",\"prompt\":\"Solve the given system of equations in two variables by addition. $\\\\begin{array}{c}\\\\frac{x}{3}+\\\\frac{y}{6}=3 \\\\\\\\ \\\\frac{x}{2}-\\\\frac{y}{4}=\\\\text{​} 1\\\\end{array}$\",\"options\":[\"$$x$\",\"$$(\\\\frac{11}{2},7).$\",\"$$(5,1)$\",\"$$800$\"],\"correctIndex\":1,\"hints\":[\"Choose substitution if one variable is already isolated, otherwise use elimination by adding multiples of the equations.\",\"First clear each equation of fractions by multiplying both sides of the equation by the least common denominator.\",\"The answer is $(\\\\frac{11}{2},7).$.\"],\"solution\":\"First clear each equation of fractions by multiplying both sides of the equation by the least common denominator.\\n\\n$\\\\begin{array}{c}6(\\\\frac{x}{3}+\\\\frac{y}{6})=6(3) \\\\\\\\ \\\\text{   }2x+y=18 \\\\\\\\ 4(\\\\frac{x}{2}-\\\\frac{y}{4})=4(1) \\\\\\\\ \\\\text{   }2x-y=4\\\\end{array}$\\n\\nNow multiply the second equation by $−1$ so that we can eliminate the x -variable.\\n$\\\\begin{array}{c}−1(2x-y)=−1(4) \\\\\\\\ \\\\text{   }−2x+y=−4\\\\end{array}$\\n\\nAdd the two equations to eliminate the x -variable and solve the resulting equation.\\n$\\\\begin{array}{c}2x+y=18 \\\\\\\\ \\\\underline{−2x+y=−4} \\\\\\\\ 2y=14 \\\\\\\\ y=7\\\\end{array}$\\n\\nSubstitute $y=7$ into the first equation.\\n\\n$\\\\begin{array}{c}2x+(7)=18 \\\\\\\\ \\\\text{        }2x=11 \\\\\\\\ \\\\text{          }x=\\\\frac{11}{2} \\\\\\\\ \\\\text{            }=5.5\\\\end{array}$\\n\\nThe solution is $(\\\\frac{11}{2},7).$ Check it in the other equation.\\n\\n$\\\\begin{array}{c} \\\\frac{x}{2}-\\\\frac{y}{4}=1 \\\\\\\\ \\\\frac{\\\\frac{11}{2}}{2}-\\\\frac{7}{4}=1 \\\\\\\\ \\\\frac{11}{4}-\\\\frac{7}{4}=1 \\\\\\\\ \\\\frac{4}{4}=1\\\\end{array}$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-1-systems-of-linear-equations-two-variables-example-9\",\"prompt\":\"Find a solution to the system of equations using the addition method . $\\\\begin{array}{c} x+3y=2 \\\\\\\\ 3x+9y=6\\\\end{array}$\",\"options\":[\"$$(50,000,77,500).$\",\"$$x$\",\"$$(-\\\\frac{7}{3},\\\\frac{2}{3}).$\",\"$$(5,1)$\"],\"correctIndex\":1,\"hints\":[\"Choose substitution if one variable is already isolated, otherwise use elimination by adding multiples of the equations.\",\"With the addition method, we want to eliminate one of the variables by adding the equations.\",\"The answer is $x$.\"],\"solution\":\"With the addition method, we want to eliminate one of the variables by adding the equations. In this case, let’s focus on eliminating $x.$ If we multiply both sides of the first equation by $−3,$ then we will be able to eliminate the $x$ -variable.\\n$\\\\begin{array}{c} x+3y=2 \\\\\\\\ (−3)(x+3y)=(−3)(2) \\\\\\\\ −3x-9y=-6\\\\end{array}$\\n\\nNow add the equations.\\n\\n$\\\\begin{array}{ccc}\\\\underline{\\\\begin{array}{cc} -3x-9y \u0026 =−6 \\\\\\\\ + 3x+9y \u0026 =6\\\\end{array}} \\\\\\\\ \\\\begin{array}{cc} 0 \u0026 =0\\\\end{array}\\\\end{array}$\\n\\nWe can see that there will be an infinite number of solutions that satisfy both equations.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-1-systems-of-linear-equations-two-variables-example-10\",\"prompt\":\"Finding the Break-Even Point and the Profit Function Using Substitution Given the cost function $C(x)=0.85x+35,000$ and the revenue function $R(x)=1.55x,$ find the break-even point and the profit function.\",\"options\":[\"$$x$\",\"$$(50,000,77,500).$\",\"$$(5,1)$\",\"$$(-\\\\frac{7}{3},\\\\frac{2}{3}).$\"],\"correctIndex\":1,\"hints\":[\"Choose substitution if one variable is already isolated, otherwise use elimination by adding multiples of the equations.\",\"Write the system of equations using $y$ to replace function notation.\",\"The answer is $(50,000,77,500).$.\"],\"solution\":\"Write the system of equations using $y$ to replace function notation.\\n$\\\\begin{array}{c}\\\\begin{array}{c} \\\\\\\\ y=0.85x+35,000\\\\end{array} \\\\\\\\ y=1.55x\\\\end{array}$\\n\\nSubstitute the expression $0.85x+35,000$ from the first equation into the second equation and solve for $x.$ \\n\\n$\\\\begin{array}{c}0.85x+35,000=1.55x \\\\\\\\ 35,000=0.7x \\\\\\\\ 50,000=x\\\\end{array}$\\n\\nThen, we substitute $x=50,000$ into either the cost function or the revenue function.\\n$1.55(50,000)=77,500$\\n\\nThe break-even point is $(50,000,77,500).$ \\n\\nThe profit function is found using the formula $P(x)=R(x)-C(x).$ \\n\\n$\\\\begin{array}{c}P(x)=1.55x-(0.85x+35,000) \\\\\\\\ \\\\text{       }=0.7x-35,000\\\\end{array}$\\n\\nThe profit function is $P(x)=0.7x−35,000.$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-1-systems-of-linear-equations-two-variables-example-11\",\"prompt\":\"Writing and Solving a System of Equations in Two Variables The cost of a ticket to the circus is $\\\\text{\\\\$}25.00$ for children and $\\\\text{\\\\$}50.00$ for adults. On a certain day, attendance at the circus is $2,000$ and the total gate revenue is $\\\\text{\\\\$}70,000.$ How many children and how many adults bought tickets?\",\"options\":[\"$$(8,3)$\",\"$$(5,1)$\",\"$$(50,000,77,500).$\",\"$$800$\"],\"correctIndex\":3,\"hints\":[\"Choose substitution if one variable is already isolated, otherwise use elimination by adding multiples of the equations.\",\"Let c = the number of children and a = the number of adults in attendance.\",\"The answer is $800$.\"],\"solution\":\"$61\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a1-sy-1\",\"curatedTopicId\":\"openstax:examples:7-2-systems-of-linear-equations-three-variables\",\"topicName\":\"Systems of Linear Equations (Three Variables) (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-7-2-systems-of-linear-equations-three-variables-example-1\",\"prompt\":\"Determine whether the ordered triple $(3,−2,1)$ is a solution to the system. $\\\\begin{array}{c} \\\\text{}x+y+z=2 \\\\\\\\ 6x-4y+5z=31 \\\\\\\\ 5x+2y+2z=13\\\\end{array}$\",\"options\":[\"$$−5$\",\"$$2,000 in a money-market fund, \\\\$\",\"$$(3,−2,1)$\",\"$$x.$\"],\"correctIndex\":2,\"hints\":[\"Choose substitution if one variable is already isolated, otherwise use elimination by adding multiples of the equations.\",\"We will check each equation by substituting in the values of the ordered triple for $x,y,$ and $z.$ \\n\\n$\\\\begin{array}{ccccc}\\\\begin{array}{c}x+y+z=2 \\\\\\\\ (3)+(−2)+(1)=2 \\\\\\\\ \\\\text{True}\\\\end{array} \u0026 \u0026 \\\\begi…\",\"The answer is $(3,−2,1)$.\"],\"solution\":\"We will check each equation by substituting in the values of the ordered triple for $x,y,$ and $z.$ \\n\\n$\\\\begin{array}{ccccc}\\\\begin{array}{c}x+y+z=2 \\\\\\\\ (3)+(−2)+(1)=2 \\\\\\\\ \\\\text{True}\\\\end{array} \u0026 \u0026 \\\\begin{array}{c} \\\\text{}6x−4y+5z=31 \\\\\\\\ 6(3)−4(−2)+5(1)=31 \\\\\\\\ 18+8+5=31 \\\\\\\\ \\\\text{True}\\\\end{array} \u0026 \u0026 \\\\begin{array}{c} \\\\text{}5x+2y+2z=13 \\\\\\\\ 5(3)+2(−2)+2(1)=13 \\\\\\\\ \\\\text{}15−4+2=13 \\\\\\\\ \\\\text{True}\\\\end{array}\\\\end{array}$ \\n\\nThe ordered triple $(3,−2,1)$ \\nis indeed a solution to the system.\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-2-systems-of-linear-equations-three-variables-example-3\",\"prompt\
