nput to the s -function is time, $t=3$ represents 3 minutes, and $s(3)$ is the number of sit-ups completed in 3 minutes. \\n\\nUsing $s(3)$ as the input to the function $c(s)$ gives us the number of calories burned during the number of sit-ups that can be completed in 3 minutes, or simply the number of calories burned in 3 minutes (by doing sit-ups).\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"math-verified\",\"source:openstax-college-algebra-2e\",\"worked-example\"]},{\"id\":\"openstax-ca-3-4-composition-of-functions-example-4\",\"prompt\":\"Order of Function Composition Suppose $f(x)$ gives miles that can be driven in $x$ hours and $g(y)$ gives the gallons of gas used in driving $y$ miles. Which of these expressions is meaningful: $f(g(y))$ or $g(f(x))?$\",\"options\":[\"$$g(f(x))\\\\nef(g(x)),$\",\"$$f(t)$\",\"$$(-∞,3]$\",\"$$x$\"],\"correctIndex\":3,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"The function $y=f(x)$ is a function whose output is the number of miles driven corresponding to the number of hours driven.\",\"The answer is $x$.\"],\"solution\":\"$55\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"math-verified\",\"source:openstax-college-algebra-2e\",\"worked-example\"]},{\"id\":\"openstax-ca-3-4-composition-of-functions-example-7\",\"prompt\":\"Evaluating a Composition of Functions Expressed as Formulas with a Numerical Input Given $f(t)=t^{2}-t$ and $h(x)=3x+2,$ evaluate $f(h(1)).$\",\"options\":[\"$$x = 1,$\",\"$$(-∞,3]$\",\"$$f(t)$\",\"$$(-∞,\\\\frac{2}{3})\\\\cup(\\\\frac{2}{3},2)\\\\cup(2,∞)$\"],\"correctIndex\":2,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"Because the inside expression is $h(1),$ we start by evaluating $h(x)$ at 1.\",\"The answer is $f(t)$.\"],\"solution\":\"Because the inside expression is $h(1),$ we start by evaluating $h(x)$ at 1.\\n\\n$\\\\begin{array}{ccc}h(1) \u0026 = \u0026 3(1)+2 \\\\\\\\ h(1) \u0026 = \u0026 5\\\\end{array}$\\n\\nThen $f(h(1))=f(5),$ so we evaluate $f(t)$ at an input of 5.\\n\\n$\\\\begin{array}{ccc}f(h(1)) \u0026 = \u0026 f(5) \\\\\\\\ f(h(1)) \u0026 = \u0026 5^{2}-5 \\\\\\\\ f(h(1)) \u0026 = \u0026 20\\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-4-composition-of-functions-example-8\",\"prompt\":\"Find the domain of $(f∘g)(x) \\\\text{where} f(x)=\\\\frac{5}{x-1} \\\\text{and} g(x)=\\\\frac{4}{3x-2}$\",\"options\":[\"$$(-∞,\\\\frac{2}{3})\\\\cup(\\\\frac{2}{3},2)\\\\cup(2,∞)$\",\"$$x$\",\"$$g(f(x))\\\\nef(g(x)),$\",\"$$f(t)$\"],\"correctIndex\":0,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"The domain of $g(x)$ consists of all real numbers except $x=\\\\frac{2}{3},$ since that input value would cause us to divide by 0.\",\"The answer is $(-∞,\\\\frac{2}{3})\\\\cup(\\\\frac{2}{3},2)\\\\cup(2,∞)$.\"],\"solution\":\"The domain of $g(x)$ consists of all real numbers except $x=\\\\frac{2}{3},$ since that input value would cause us to divide by 0. Likewise, the domain of $f$ consists of all real numbers except 1. So we need to exclude from the domain of $g(x)$ that value of $x$ for which $g(x)=1.$ \\n\\n$\\\\begin{array}{ccc}\\\\frac{4}{3x-2} \u0026 = \u0026 1 \\\\\\\\ 4 \u0026 = \u0026 3x-2 \\\\\\\\ 6 \u0026 = \u0026 3x \\\\\\\\ x \u0026 = \u0026 2\\\\end{array}$\\n\\nSo the domain of $f∘g$ is the set of all real numbers except $\\\\frac{2}{3}$ and $2.$ This means that\\n\\n$x\\\\ne\\\\frac{2}{3} \\\\text{or} x\\\\ne2$\\n\\nWe can write this in interval notation as\\n\\n$(-∞,\\\\frac{2}{3})\\\\cup(\\\\frac{2}{3},2)\\\\cup(2,∞)$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-4-composition-of-functions-example-9\",\"prompt\":\"Find the domain of $(f∘g)(x) \\\\text{ where} f(x)=\\\\sqrt{x+2} \\\\text{ and } g(x)=\\\\sqrt{3-x}$\",\"options\":[\"$$(-∞,3]$\",\"$$f(t)$\",\"$$x = 1,$\",\"$$c(s)$\"],\"correctIndex\":0,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"Because we cannot take the square root of a negative number, the domain of $g$ is $(-∞,3].$ Now we check the domain of the composite function\\n\\n$(f∘g)(x)=\\\\sqrt{\\\\sqrt{3-x}+2}$\\n\\nFor $(f∘g)(x)=\\\\sqrt{\\\\sqrt…\",\"The answer is $(-∞,3]$.\"],\"solution\":\"Because we cannot take the square root of a negative number, the domain of $g$ is $(-∞,3].$ Now we check the domain of the composite function\\n\\n$(f∘g)(x)=\\\\sqrt{\\\\sqrt{3-x}+2}$\\n\\nFor $(f∘g)(x)=\\\\sqrt{\\\\sqrt{3-x}+2},\\\\sqrt{3-x}+2\\\\ge0,$ \\nsince the radicand of a square root must be positive. Since square roots are positive, $\\\\text{}\\\\sqrt{3-x}\\\\ge0,\\\\text{}$ or, $3-x\\\\ge0,\\\\text{}$ which gives a domain of $(-∞,3]$ .\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-4-composition-of-functions-example-10\",\"prompt\":\"Write $f(x)=\\\\sqrt{5-x^{2}}$ as the composition of two functions.\",\"options\":[\"$$5-x^{2}$\",\"$$x$\",\"$$f(t)$\",\"$$x = 1,$\"],\"correctIndex\":0,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"We are looking for two functions, $g$ and $h,$ so $f(x)=g(h(x)).$ To do this, we look for a function inside a function in the formula for $f(x).$ As one possibility, we might notice that the expressio…\",\"The answer is $5-x^{2}$.\"],\"solution\":\"We are looking for two functions, $g$ and $h,$ so $f(x)=g(h(x)).$ To do this, we look for a function inside a function in the formula for $f(x).$ As one possibility, we might notice that the expression $5-x^{2}$ is the inside of the square root. We could then decompose the function as\\n\\n$h(x)=5-x^{2} \\\\text{and }g(x)=\\\\sqrt{x}$\\n\\nWe can check our answer by recomposing the functions.\\n\\n$g(h(x))=g(5-x^{2})=\\\\sqrt{5-x^{2}}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a1-fn-1\",\"curatedTopicId\":\"openstax:examples:3-5-transformation-of-functions\",\"topicName\":\"Transformation of Functions (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-3-5-transformation-of-functions-example-4\",\"prompt\":\"Shifting a Tabular Function Horizontally A function $f(x)$ is given in Table 4 . Create a table for the function $g(x)=f(x-3).$ $x$ 2 4 6 8 $f(x)$ 1 3 7 11 Table 4\",\"options\":[\"$$t,$\",\"$$(-∞, 0].$\",\"$$x,$\",\"$$h.$\"],\"correctIndex\":2,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"The formula $g(x)=f(x-3)$ tells us that the output values of $g$ are the same as the output value of $f$ when the input value is 3 less than the original value.\",\"The answer is $x,$.\"],\"solution\":\"The formula $g(x)=f(x-3)$ tells us that the output values of $g$ are the same as the output value of $f$ when the input value is 3 less than the original value. For example, we know that $f(2)=1.$ To get the same output from the function $g,$ we will need an input value that is 3 larger . We input a value that is 3 larger for $g(x)$ because the function takes 3 away before evaluating the function $f.$ \\n\\n$\\\\begin{array}{ccc}g(5) \u0026 = \u0026 f(5-3) \\\\\\\\ \u0026 = \u0026 f(2) \\\\\\\\ \u0026 = \u0026 1\\\\end{array}$\\n\\nWe continue with the other values to create Table 5 .\\n\\n$x$ \\n\\n5 \\n7 \\n9 \\n11 \\n\\n$x-3$ \\n\\n2 \\n4 \\n6 \\n8 \\n\\n$f(x–3)$ \\n\\n1 \\n3 \\n7 \\n11 \\n\\n$g(x)$ \\n\\n1 \\n3 \\n7 \\n11 \\n\\nTable \\n5 \\n\\nThe result is that the function $g(x)$ has been shifted to the right by 3. Notice the output values for $g(x)$ remain the same as the output values for $f(x),$ but the corresponding input values, $x,$ have shifted to the right by 3. Specifically, 2 shifted to 5, 4 shifted to 7, 6 shifted to 9, and 8 shifted to 11.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"math-verified\",\"source:openstax-college-algebra-2e\",\"worked-example\"]},{\"id\":\"openstax-ca-3-5-transformation-of-functions-example-6\",\"prompt\":\"Interpreting Horizontal versus Vertical Shifts The function $G(m)$ gives the number of gallons of gas required to drive $m$ miles. Interpret $G(m)+10$ and $G(m+10).$\",\"options\":[\"$$x,$\",\"$$\\\\frac{11}{2}$\",\"$$m$\",\"$$\\\\frac{1}{3}.$\"],\"correctIndex\":2,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"$$G(m)+10$ can be interpreted as adding 10 to the output, gallons.\",\"The answer is $m$.\"],\"solution\":\"$$G(m)+10$ can be interpreted as adding 10 to the output, gallons. This is the gas required to drive $m$ miles, plus another 10 gallons of gas. The graph would indicate a vertical shift.\\n\\n$G(m+10)$ can be interpreted as adding 10 to the input, miles. So this is the number of gallons of gas required to drive 10 miles more than $m$ miles. The graph would indicate a horizontal shift.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"math-verified\",\"source:openstax-college-algebra-2e\",\"worked-example\"]},{\"id\":\"openstax-ca-3-5-transformation-of-functions-example-7\",\"prompt\":\"Graphing Combined Vertical and Horizontal Shifts Given $f(x)=|x|,$ sketch a graph of $h(x)=f(x+1)-3.$\",\"options\":[\"$$t,$\",\"$$h.$\",\"$$f.$\",\"$$m$\"],\"correctIndex\":1,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"The function $f$ is our toolkit absolute value function.\",\"The answer is $h.$.\"],\"solution\":\"The function $f$ is our toolkit absolute value function. We know that this graph has a V shape, with the point at the origin. The graph of $h$ has transformed $f$ in two ways: $f(x+1)$ is a change on the inside of the function, giving a horizontal shift left by 1, and the subtraction by 3 in $f(x+1)-3$ is a change to the outside of the function, giving a vertical shift down by 3. The transformation of the graph is illustrated in Figure 9 .\\n\\nLet us follow one point of the graph of $f(x)=|x|.$ \\n\\nThe point $(0,0)$ is transformed first by shifting left 1 unit: $(0,0)\\\\to(−1,0)$ \\nThe point $(−1,0)$ is transformed next by shifting down 3 units: $(−1,0)\\\\to(−1,−3)$ \\n\\nFigure \\n9 \\n\\nFigure 10 shows the graph of $h.$ \\n\\nFigure \\n10\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-5-transformation-of-functions-example-9\",\"prompt\":\"Graph Horizontally and Vertically Reflect the graph of $s(t)=\\\\sqrt{t}$ (a) vertically and (b) horizontally.\",\"options\":[\"$$f(x-2).$\",\"$$(-∞, 0].$\",\"$$m$\",\"$$\\\\frac{1}{3}.$\"],\"correctIndex\":1,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"ⓐ \\nReflecting the graph vertically means that each output value will be reflected over the horizontal t- axis as shown in Figure 13 .\",\"The answer is $(-∞, 0].$.\"],\"solution\":\"$56\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-5-transformation-of-functions-example-14\",\"prompt\":\"Finding a Vertical Compression of a Tabular Function A function $f$ is given as Table 10 . Create a table for the function $g(x)=\\\\frac{1}{2}f(x).$ $x$ 2 4 6 8 $f(x)$ 1 3 7 11 Table 10\",\"options\":[\"$$x,$\",\"$$m$\",\"$$\\\\frac{11}{2}$\",\"$$t,$\"],\"correctIndex\":2,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"The formula $g(x)=\\\\frac{1}{2}f(x)$ tells us that the output values of $g$ are half of the output values of $f$ with the same inputs.\",\"The answer is $\\\\frac{11}{2}$.\"],\"solution\":\"The formula $g(x)=\\\\frac{1}{2}f(x)$ tells us that the output values of $g$ are half of the output values of $f$ with the same inputs. For example, we know that $f(4)=3.$ Then \\n\\n$g(4)=\\\\frac{1}{2}f(4)=\\\\frac{1}{2}(3)=\\\\frac{3}{2}$\\n\\nWe do the same for the other values to produce Table 11 .\\n\\n$x$ \\n\\n$2$\\n\\n$4$ \\n$6$ \\n$8$ \\n\\n$g(x)$ \\n\\n$\\\\frac{1}{2}$\\n\\n$\\\\frac{3}{2}$ \\n$\\\\frac{7}{2}$ \\n$\\\\frac{11}{2}$ \\n\\nTable \\n11\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a1-fn-1\",\"curatedTopicId\":\"openstax:examples:3-7-inverse-functions\",\"topicName\":\"Inverse Functions (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-3-7-inverse-functions-example-1\",\"prompt\":\"Identifying an Inverse Function for a Given Input-Output Pair If for a particular one-to-one function $f(2)=4$ and $f(5)=12,$ what are the corresponding input and output values for the inverse function?\",\"options\":[\"$$t = 90$\",\"$$C^{-1}$\",\"$$(2,4).$\",\"$$g,$\"],\"correctIndex\":3,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"The inverse function reverses the input and output quantities, so if \\n\\n$\\\\begin{array}{ccc}f(2) \u0026 = \u0026 4, \\\\text{then }f^{−1}(4)=2; \\\\\\\\ f(5) \u0026 = \u0026 12,( \\\\text{then f})^{−1}(12)=5.\\\\end{array}$\\n\\nAlternativel…\",\"The answer is $g,$.\"],\"solution\":\"The inverse function reverses the input and output quantities, so if \\n\\n$\\\\begin{array}{ccc}f(2) \u0026 = \u0026 4, \\\\text{then }f^{−1}(4)=2; \\\\\\\\ f(5) \u0026 = \u0026 12,( \\\\text{then f})^{−1}(12)=5.\\\\end{array}$\\n\\nAlternatively, if we want to name the inverse function $g,$ then $g(4)=2$ and $g(12)=5.$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-7-inverse-functions-example-2\",\"prompt\":\"Testing Inverse Relationships Algebraically If $f(x)=\\\\frac{1}{x+2}$ and $g(x)=\\\\frac{1}{x}-2,$ is $g=f^{-1}?$\",\"options\":[\"$$g,$\",\"$$(2,4).$\",\"$$t = 90$\",\"$$g = f^{-1} \\\\text{and }f=g^{-1}$\"],\"correctIndex\":3,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"$$\\\\begin{array}{ccc}g(f(x)) \u0026 = \u0026 \\\\frac{1}{(\\\\frac{1}{x+2})}-2 \\\\\\\\ \u0026 = \u0026 x+2-2 \\\\\\\\ \u0026 = \u0026 x\\\\end{array}$\\n\\nWe must also verify the other formula.\",\"The answer is $g = f^{-1} \\\\text{and }f=g^{-1}$.\"],\"solution\":\"$$\\\\begin{array}{ccc}g(f(x)) \u0026 = \u0026 \\\\frac{1}{(\\\\frac{1}{x+2})}-2 \\\\\\\\ \u0026 = \u0026 x+2-2 \\\\\\\\ \u0026 = \u0026 x\\\\end{array}$\\n\\nWe must also verify the other formula.\\n\\n$\\\\begin{array}{ccc}f(g(x)) \u0026 = \u0026 \\\\frac{1}{\\\\frac{1}{x}-2+2} \\\\\\\\ \u0026 = \u0026 \\\\frac{1}{\\\\frac{1}{x}} \\\\\\\\ \u0026 = \u0026 x\\\\end{array}$\\n\\nso\\n\\n$g=f^{-1} \\\\text{and }f=g^{-1}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-7-inverse-functions-example-5\",\"prompt\":\"Interpreting the Inverse of a Tabular Function A function $f(t)$ is given in Table 3 , showing distance in miles that a car has traveled in $t$ minutes. Find and interpret $f^{-1}(70).$ $t \\\\text{(minutes)}$ 30 50 70 90 $f(t) \\\\text{(miles)}$ 20 40 60 70 Table 3\",\"options\":[\"$$t = 90$\",\"$$C^{-1}$\",\"$$(2,4).$\",\"$$g,$\"],\"correctIndex\":0,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"The inverse function takes an output of $f$ and returns an input for $f.$ So in the expression $f^{-1}(70),$ 70 is an output value of the original function, representing 70 miles.\",\"The answer is $t = 90$.\"],\"solution\":\"The inverse function takes an output of $f$ and returns an input for $f.$ So in the expression $f^{-1}(70),$ 70 is an output value of the original function, representing 70 miles. The inverse will return the corresponding input of the original function $f,$ 90 minutes, so $f^{-1}(70)=90.$ The interpretation of this is that, to drive 70 miles, it took 90 minutes.\\n\\nAlternatively, recall that the definition of the inverse was that if $f(a)=b,$ then $f^{-1}(b)=a.$ By this definition, if we are given $f^{-1}(70)=a,$ then we are looking for a value $a$ so that $f(a)=70.$ In this case, we are looking for a $t$ so that $f(t)=70,$ which is when $t=90.$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-7-inverse-functions-example-7\",\"prompt\":\"Find a formula for the inverse function that gives Fahrenheit temperature as a function of Celsius temperature. $C=\\\\frac{5}{9}(F-32)$\",\"options\":[\"$$(2,4).$\",\"$$C^{-1}$\",\"$$t = 90$\",\"$$g,$\"],\"correctIndex\":1,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"$$\\\\begin{array}{ccc}C \u0026 = \u0026 \\\\frac{5}{9}(F-32) \\\\\\\\ C\\\\cdot \\\\frac{9}{5} \u0026 = \u0026 F-32 \\\\\\\\ F \u0026 = \u0026 \\\\frac{9}{5}C+32\\\\end{array}$\\n\\nBy solving in general, we have uncovered the inverse function.\",\"The answer is $C^{-1}$.\"],\"solution\":\"$$\\\\begin{array}{ccc}C \u0026 = \u0026 \\\\frac{5}{9}(F-32) \\\\\\\\ C\\\\cdot \\\\frac{9}{5} \u0026 = \u0026 F-32 \\\\\\\\ F \u0026 = \u0026 \\\\frac{9}{5}C+32\\\\end{array}$\\n\\nBy solving in general, we have uncovered the inverse function. If\\n\\n$C=h(F)=\\\\frac{5}{9}(F-32),$\\n\\nthen\\n\\n$F=h^{-1}(C)=\\\\frac{9}{5}C+32$\\n\\nIn this case, we introduced a function $h$ to represent the conversion because the input and output variables are descriptive, and writing $C^{-1}$ could get confusing.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a1-le-1\",\"curatedTopicId\":\"openstax:examples:4-1-linear-functions\",\"topicName\":\"Linear Functions (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-4-1-linear-functions-example-3\",\"prompt\":\"Finding the Slope of a Linear Function If $f(x)$ is a linear function, and $(3,−2)$ and $(8,1)$ are points on the line, find the slope. Is this function increasing or decreasing?\",\"options\":[\"$$x = 7$\",\"$$(6,1240)$\",\"$$m\\\\gt 0.$\",\"$$(−2,−4).$\"],\"correctIndex\":2,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"The coordinate pairs are $(3,−2)$ and $(8,1).$ To find the rate of change, we divide the change in output by the change in input.\",\"The answer is $m\\\\gt 0.$.\"],\"solution\":\"The coordinate pairs are $(3,−2)$ and $(8,1).$ To find the rate of change, we divide the change in output by the change in input.\\n$m=\\\\frac{\\\\text{change in output}}{\\\\text{change in input}}=\\\\frac{1-(−2)}{8-3}=\\\\frac{3}{5}$\\n\\nWe could also write the slope as $m=0.6.$ The function is increasing because $m\\\\gt 0.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-4-1-linear-functions-example-6\",\"prompt\":\"Writing an Equation for a Linear Cost Function Suppose Ben starts a company in which he incurs a fixed cost of \\\\$1,250 per month for the overhead, which includes his office rent. His production costs are \\\\$37.50 per item. Write a linear function $C$ where $C(x)$ is the cost for $x$ items produced in a given month.\",\"options\":[\"$$x = 7$\",\"$$(6,1240)$\",\"$$37.5.$\",\"$$y = -4$\"],\"correctIndex\":2,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"The fixed cost is present every month, \\\\$1,250.\",\"The answer is $37.5.$.\"],\"solution\":\"The fixed cost is present every month, \\\\$1,250. The costs that can vary include the cost to produce each item, which is \\\\$37.50. The variable cost, called the marginal cost, is represented by $37.5.$ The cost Ben incurs is the sum of these two costs, represented by $C(x)=1250+37.5x.$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-4-1-linear-functions-example-8\",\"prompt\":\"Determine the Number of Songs in a Music Collection Marcus currently has 200 songs in his music collection. Every month, he adds 15 new songs. Write a formula for the number of songs, $N,$ in his collection as a function of time, $t,$ the number of months. How many songs will he own at the end of one year?\",\"options\":[\"$$(6,1240)$\",\"$$(0,5)$\",\"$$t = 12$\",\"$$y = \\\\frac{1}{2}x,$\"],\"correctIndex\":2,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"The initial value for this function is 200 because he currently owns 200 songs, so $N(0)=200,$ which means that $b=200.$ \\n\\nThe number of songs increases by 15 songs per month, so the rate of change is…\",\"The answer is $t = 12$.\"],\"solution\":\"The initial value for this function is 200 because he currently owns 200 songs, so $N(0)=200,$ which means that $b=200.$ \\n\\nThe number of songs increases by 15 songs per month, so the rate of change is 15 songs per month. Therefore we know that $m=15.$ We can substitute the initial value and the rate of change into the slope-intercept form of a line.\\n\\nFigure \\n10 \\n\\nWe can write the formula $N(t)=15t+200.$ \\n\\nWith this formula, we can then predict how many songs Marcus will have at the end of one year (12 months). In other words, we can evaluate the function at $t=12.$ \\n\\n$\\\\begin{array}{ccc}N(12) \u0026 = \u0026 15(12)+200 \\\\\\\\ \u0026 = \u0026 180+200 \\\\\\\\ \u0026 = \u0026 380\\\\end{array}$\\n\\nMarcus will have 380 songs in 12 months.\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-4-1-linear-functions-example-10\",\"prompt\":\"Write an Equation for a Linear Function Table 1 relates the number of rats in a population to time, in weeks. Use the table to write a linear equation. number of weeks, w 0 2 4 6 number of rats, P(w) 1000 1080 1160 1240 Table 1\",\"options\":[\"$$m\\\\gt 0.$\",\"$$(6,1240)$\",\"$$(6,\\\\text{0}).$\",\"$$y = 6x-19$\"],\"correctIndex\":1,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"We can see from the table that the initial value for the number of rats is 1000, so $b=1000.$ \\n\\nRather than solving for $m,$ we can tell from looking at the table that the population increases by 80 f…\",\"The answer is $(6,1240)$.\"],\"solution\":\"We can see from the table that the initial value for the number of rats is 1000, so $b=1000.$ \\n\\nRather than solving for $m,$ we can tell from looking at the table that the population increases by 80 for every 2 weeks that pass. This means that the rate of change is 80 rats per 2 weeks, which can be simplified to 40 rats per week.\\n$P(w)=40w+1000$\\n\\nIf we did not notice the rate of change from the table we could still solve for the slope using any two points from the table. For example, using $(2,1080)$ and $(6,1240)$ \\n\\n$\\\\begin{array}{ccc}m \u0026 = \u0026 \\\\frac{1240-1080}{6-2} \\\\\\\\ \u0026 = \u0026 \\\\frac{160}{4} \\\\\\\\ \u0026 = \u0026 40\\\\end{array}$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-4-1-linear-functions-example-12\",\"prompt\":\"Graph $f(x)=-\\\\frac{2}{3}x+5$ using the y- intercept and slope.\",\"options\":[\"$$37.5.$\",\"$$(0,5)$\",\"$$(6,\\\\text{0}).$\",\"$$t = 12$\"],\"correctIndex\":1,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"Evaluate the function at $x=0$ to find the y- intercept.\",\"The answer is $(0,5)$.\"],\"solution\":\"Evaluate the function at $x=0$ to find the y- intercept. The output value when $x=0$ is 5, so the graph will cross the y -axis at $(0,5).$ \\n\\nAccording to the equation for the function, the slope of the line is $-\\\\frac{2}{3}.$ This tells us that for each vertical decrease in the “rise” of $–2$ units, the “run” increases by 3 units in the horizontal direction. We can now graph the function by first plotting the y -intercept on the graph in Figure 13 . From the initial value $(0,5)$ we move down 2 units and to the right 3 units. We can extend the line to the left and right by repeating, and then drawing a line through the points.\\n\\nFigure \\n13 \\n\\nGraph of $f(x)=−2/3x+5$ and shows how to calculate the rise over run for the slope.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-4-1-linear-functions-example-13\",\"prompt\":\"Graph $f(x)=\\\\frac{1}{2}x-3$ using transformations.\",\"options\":[\"$$y = \\\\frac{1}{2}x,$\",\"$$(6,1240)$\",\"$$y = 6x-19$\",\"$$(3,\\\\text{0})$\"],\"correctIndex\":0,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"The equation for the function shows that $m=\\\\frac{1}{2}$ so the identity function is vertically compressed by $\\\\frac{1}{2}.$ The equation for the function also shows that $b=-3$ so the identity functi…\",\"The answer is $y = \\\\frac{1}{2}x,$.\"],\"solution\":\"The equation for the function shows that $m=\\\\frac{1}{2}$ so the identity function is vertically compressed by $\\\\frac{1}{2}.$ The equation for the function also shows that $b=-3$ so the identity function is vertically shifted down 3 units. First, graph the identity function, and show the vertical compression as in Figure 16 .\\n\\nFigure \\n16 \\n\\nThe function, $y=x,$ compressed by a factor of $\\\\frac{1}{2}$ . \\n\\nThen show the vertical shift as in Figure 17 .\\n\\nFigure \\n17 \\n\\nThe function $y=\\\\frac{1}{2}x,$ shifted down 3 units.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-4-1-linear-functions-example-15\",\"prompt\":\"Find the x -intercept of $f(x)=\\\\frac{1}{2}x-3.$\",\"options\":[\"$$(6,\\\\text{0}).$\",\"$$37.5.$\",\"$$(6,1240)$\",\"$$y = \\\\frac{1}{2}x,$\"],\"correctIndex\":0,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"Set the function equal to zero to solve for $x.$ \\n\\n$\\\\begin{array}{ccc}0 \u0026 = \u0026 \\\\frac{1}{2}x-3 \\\\\\\\ 3 \u0026 = \u0026 \\\\frac{1}{2}x \\\\\\\\ 6 \u0026 = \u0026 x \\\\\\\\ x \u0026 = \u0026 6\\\\end{array}$\\n\\nThe graph crosses the x -axis at the point $…\",\"The answer is $(6,\\\\text{0}).$.\"],\"solution\":\"Set the function equal to zero to solve for $x.$ \\n\\n$\\\\begin{array}{ccc}0 \u0026 = \u0026 \\\\frac{1}{2}x-3 \\\\\\\\ 3 \u0026 = \u0026 \\\\frac{1}{2}x \\\\\\\\ 6 \u0026 = \u0026 x \\\\\\\\ x \u0026 = \u0026 6\\\\end{array}$\\n\\nThe graph crosses the x -axis at the point $(6,\\\\text{0}).$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-4-1-linear-functions-example-18\",\"prompt\":\"Identifying Parallel and Perpendicular Lines Given the functions below, identify the functions whose graphs are a pair of parallel lines and a pair of perpendicular lines. $\\\\begin{array}{cccccc}f(x) \u0026 = \u0026 2x+3 \u0026 h(x) \u0026 = \u0026 -2x+2 \\\\\\\\ g(x) \u0026 = \u0026 \\\\frac{1}{2}x-4 \u0026 j(x) \u0026 = \u0026 2x-6\\\\end{array}$\",\"options\":[\"$$(−2,−4).$\",\"$$t = 12$\",\"$$(3,\\\\text{0})$\",\"$$\\\\frac{1}{2}$\"],\"correctIndex\":3,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"Parallel lines have the same slope.\",\"The answer is $\\\\frac{1}{2}$.\"],\"solution\":\"Parallel lines have the same slope. Because the functions $f(x)=2x+3$ and $j(x)=2x-6$ each have a slope of 2, they represent parallel lines. Perpendicular lines have negative reciprocal slopes. Because −2 and $\\\\frac{1}{2}$ are negative reciprocals, the functions $g(x)=\\\\frac{1}{2}x-4$ and $h(x)=−2x+2$ represent perpendicular lines.\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-4-1-linear-functions-example-19\",\"prompt\":\"Find a line parallel to the graph of $f(x)=3x+6$ that passes through the point $(3,\\\\text{0}).$\",\"options\":[\"$$(3,\\\\text{0})$\",\"$$37.5.$\",\"$$\\\\frac{1}{2}$\",\"$$(0,5)$\"],\"correctIndex\":0,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"The slope of the given line is 3.\",\"The answer is $(3,\\\\text{0})$.\"],\"solution\":\"The slope of the given line is 3. If we choose the slope-intercept form, we can substitute $m=3,x=3,$ and $f(x)=0$ into the slope-intercept form to find the y- intercept.\\n$\\\\begin{array}{ccc}g(x) \u0026 = \u0026 3x+b \\\\\\\\ 0 \u0026 = \u0026 3(3)+b \\\\\\\\ b \u0026 = \u0026 –9\\\\end{array}$\\n\\nThe line parallel to $f(x)$ that passes through $(3,\\\\text{0})$ is $g(x)=3x-9.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-4-1-linear-functions-example-20\",\"prompt\":\"Find the equation of a line perpendicular to $f(x)=3x+3$ that passes through the point $(3,\\\\text{0}).$\",\"options\":[\"$$\\\\frac{1}{2}$\",\"$$37.5.$\",\"$$t = 12$\",\"$$(3,\\\\text{0})$\"],\"correctIndex\":3,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"The original line has slope $m=3,$ so the slope of the perpendicular line will be its negative reciprocal, or $-\\\\frac{1}{3}.$ Using this slope and the given point, we can find the equation of the line…\",\"The answer is $(3,\\\\text{0})$.\"],\"solution\":\"The original line has slope $m=3,$ so the slope of the perpendicular line will be its negative reciprocal, or $-\\\\frac{1}{3}.$ Using this slope and the given point, we can find the equation of the line.\\n\\n$\\\\begin{array}{ccc}g(x) \u0026 = \u0026 –\\\\frac{1}{3}x+b \\\\\\\\ 0 \u0026 = \u0026 –\\\\frac{1}{3}(3)+b \\\\\\\\ 1 \u0026 = \u0026 b \\\\\\\\ b \u0026 = \u0026 1\\\\end{array}$\\n\\nThe line perpendicular to $f(x)$ that passes through $(3,\\\\text{0})$ is $g(x)=-\\\\frac{1}{3}x+1.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-4-1-linear-functions-example-21\",\"prompt\":\"Finding the Equation of a Line Perpendicular to a Given Line Passing through a Point A line passes through the points $(−2,\\\\text{6})$ and $(4,5).$ Find the equation of a perpendicular line that passes through the point $(4,5).$\",\"options\":[\"$$(6,\\\\text{0}).$\",\"$$(−2,−4).$\",\"$$y = 6x-19$\",\"$$(3,\\\\text{0})$\"],\"correctIndex\":2,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"From the two points of the given line, we can calculate the slope of that line.\",\"The answer is $y = 6x-19$.\"],\"solution\":\"From the two points of the given line, we can calculate the slope of that line.\\n\\n$\\\\begin{array}{ccc}m_{1} \u0026 = \u0026 \\\\frac{5-6}{4-(−2)} \\\\\\\\ \u0026 = \u0026 \\\\frac{-1}{6} \\\\\\\\ \u0026 = \u0026 -\\\\frac{1}{6}\\\\end{array}$\\n\\nFind the negative reciprocal of the slope.\\n\\n$\\\\begin{array}{ccc}m_{2} \u0026 = \u0026 \\\\frac{-1}{-\\\\frac{1}{6}} \\\\\\\\ \u0026 = \u0026 −1(-\\\\frac{6}{1}) \\\\\\\\ \u0026 = \u0026 6\\\\end{array}$\\n\\nWe can then solve for the y- intercept of the line passing through the point $(4,5).$ \\n\\n$\\\\begin{array}{ccc}g(x) \u0026 = \u0026 6x+b \\\\\\\\ 5 \u0026 = \u0026 6(4)+b \\\\\\\\ 5 \u0026 = \u0026 24+b \\\\\\\\ −19 \u0026 = \u0026 b \\\\\\\\ b \u0026 = \u0026 −19\\\\end{array}$\\n\\nThe equation for the line that is perpendicular to the line passing through the two given points and also passes through point $(4,5)$ is\\n$y=6x-19$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a1-qd-1\",\"curatedTopicId\":\"openstax:examples:5-1-quadratic-functions\",\"topicName\":\"Quadratic Functions (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-5-1-quadratic-functions-example-3\",\"prompt\":\"Find the vertex of the quadratic function $f(x)=2x^{2}–6x+7.$ Rewrite the quadratic in standard form (vertex form).\",\"options\":[\"$$a$\",\"$$(0,7)$\",\"$$(-2,0).$\",\"$$(0,−1),$\"],\"correctIndex\":0,\"hints\":[\"Try factoring first; if it doesn't factor, fall back to the quadratic formula or completing the square.\",\"$$\\\\begin{array}{cccc}\\\\text{The horizontal coordinate of the vertex will be at} \\\\\\\\ \u0026 h \u0026 = \u0026 -\\\\frac{b}{2a} \\\\\\\\ \u0026 \u0026 = \u0026 -\\\\frac{−6}{2(2)} \\\\\\\\ \u0026 \u0026 = \u0026 \\\\frac{6}{4} \\\\\\\\ \u0026 \u0026 = \u0026 \\\\frac{3}{2} \\\\\\\\ \\\\text{The vertical…\",\"The answer is $a$.\"],\"solution\":\"$$\\\\begin{array}{cccc}\\\\text{The horizontal coordinate of the vertex will be at} \\\\\\\\ \u0026 h \u0026 = \u0026 -\\\\frac{b}{2a} \\\\\\\\ \u0026 \u0026 = \u0026 -\\\\frac{−6}{2(2)} \\\\\\\\ \u0026 \u0026 = \u0026 \\\\frac{6}{4} \\\\\\\\ \u0026 \u0026 = \u0026 \\\\frac{3}{2} \\\\\\\\ \\\\text{The vertical coordinate of the vertex will be at} \\\\\\\\ \u0026 k \u0026 = \u0026 f(h) \\\\\\\\ \u0026 \u0026 = \u0026 f(\\\\frac{3}{2}) \\\\\\\\ \u0026 \u0026 = \u0026 2(\\\\frac{3}{2})^{2}-6(\\\\frac{3}{2})+7 \\\\\\\\ \u0026 \u0026 = \u0026 \\\\frac{5}{2}\\\\end{array}$ \\n\\nRewriting into standard form, the stretch factor will be the same as the $a$ in the original quadratic. First, find the horizontal coordinate of the vertex. Then find the vertical coordinate of the vertex. Substitute the values into standard form, using the \\\" $a$ \\\" from the general form.\\n\\n$\\\\begin{array}{ccc}f(x) \u0026 = \u0026 ax^{2}+bx+c \\\\\\\\ f(x) \u0026 = \u0026 2x^{2}-6x+7\\\\end{array}$\\n\\nThe standard form of a quadratic function prior to writing the function then becomes the following:\\n$f(x)=2(x–\\\\frac{3}{2})^{2}+\\\\frac{5}{2}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-1-quadratic-functions-example-4\",\"prompt\":\"Find the domain and range of $f(x)=-5x^{2}+9x-1.$\",\"options\":[\"$$(-∞,\\\\frac{61}{20}].$\",\"$$(0,−1),$\",\"$$(0,7)$\",\"$$a$\"],\"correctIndex\":0,\"hints\":[\"Try factoring first; if it doesn't factor, fall back to the quadratic formula or completing the square.\",\"As with any quadratic function, the domain is all real numbers.\",\"The answer is $(-∞,\\\\frac{61}{20}].$.\"],\"solution\":\"As with any quadratic function, the domain is all real numbers. \\n\\nBecause $a$ is negative, the parabola opens downward and has a maximum value. We need to determine the maximum value. We can begin by finding the $x\\\\text{-}$ value of the vertex.\\n\\n$\\\\begin{array}{ccc}h \u0026 = \u0026 -\\\\frac{b}{2a} \\\\\\\\ \u0026 = \u0026 -\\\\frac{9}{2(−5)} \\\\\\\\ \u0026 = \u0026 \\\\frac{9}{10}\\\\end{array}$\\n\\nThe maximum value is given by $f(h).$ \\n\\n$\\\\begin{array}{ccc}f(\\\\frac{9}{10}) \u0026 = \u0026 -5(\\\\frac{9}{10})^{2}+9(\\\\frac{9}{10})-1 \\\\\\\\ \u0026 = \u0026 \\\\frac{61}{20}\\\\end{array}$\\n\\nThe range is $f(x)\\\\le\\\\frac{61}{20},$ or $(-∞,\\\\frac{61}{20}].$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-1-quadratic-functions-example-7\",\"prompt\":\"Find the y - and x -intercepts of the quadratic $f(x)=3x^{2}+5x-2.$\",\"options\":[\"$$(0,−1),$\",\"$$a$\",\"$$(-2,0).$\",\"$$(0,7)$\"],\"correctIndex\":2,\"hints\":[\"Try factoring first; if it doesn't factor, fall back to the quadratic formula or completing the square.\",\"We find the y -intercept by evaluating $f(0).$ \\n\\n$\\\\begin{array}{ccc}f(0) \u0026 = \u0026 3(0)^{2}+5(0)-2 \\\\\\\\ \u0026 = \u0026 −2\\\\end{array}$\\n\\nSo the y -intercept is at $(0,−2).$ \\n\\nFor the x -intercepts, we find all solutio…\",\"The answer is $(-2,0).$.\"],\"solution\":\"We find the y -intercept by evaluating $f(0).$ \\n\\n$\\\\begin{array}{ccc}f(0) \u0026 = \u0026 3(0)^{2}+5(0)-2 \\\\\\\\ \u0026 = \u0026 −2\\\\end{array}$\\n\\nSo the y -intercept is at $(0,−2).$ \\n\\nFor the x -intercepts, we find all solutions of $f(x)=0.$ \\n\\n$0=3x^{2}+5x-2$ \\n\\nIn this case, the quadratic can be factored easily, providing the simplest method for solution.\\n\\n$0=(3x-1)(x+2)$ \\n\\nSo the x -intercepts are at $(\\\\frac{1}{3},0)$ and $(-2,0).$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a1-fp-1\",\"curatedTopicId\":\"openstax:examples:5-2-power-functions-and-polynomial-functions\",\"topicName\":\"Power \u0026 Polynomial Functions (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-5-2-power-functions-and-polynomial-functions-example-2\",\"prompt\":\"Identifying the End Behavior of a Power Function Describe the end behavior of the graph of $f(x)=x^{8}.$\",\"options\":[\"$$x\\\\to−∞,f(x)\\\\to∞.$\",\"$$x$\",\"$$10,$\",\"$$(4,0).$\"],\"correctIndex\":0,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"The coefficient is 1 (positive) and the exponent of the power function is 8 (an even number).\",\"The answer is $x\\\\to−∞,f(x)\\\\to∞.$.\"],\"solution\":\"The coefficient is 1 (positive) and the exponent of the power function is 8 (an even number). As $x$ approaches infinity, the output (value of $f(x)$ ) increases without bound. We write as $x\\\\to∞,f(x)\\\\to∞.$ As $x$ approaches negative infinity, the output increases without bound. In symbolic form, as $x\\\\to−∞,f(x)\\\\to∞.$ We can graphically represent the function as shown in Figure 5 .\\n\\nFigure \\n5\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-2-power-functions-and-polynomial-functions-example-3\",\"prompt\":\"Identifying the End Behavior of a Power Function. Describe the end behavior of the graph of $f(x)=-x^{9}.$\",\"options\":[\"$$10,$\",\"$$−1.$\",\"$$x$\",\"$$h(x)$\"],\"correctIndex\":2,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"The exponent of the power function is 9 (an odd number).\",\"The answer is $x$.\"],\"solution\":\"The exponent of the power function is 9 (an odd number). Because the coefficient is $–1$ (negative), the graph is the reflection about the $x\\\\text{-}$ axis of the graph of $f(x)=x^{9}.$ Figure 6 shows that as $x$ approaches infinity, the output decreases without bound. As $x$ approaches negative infinity, the output increases without bound. In symbolic form, we would write\\n\\n$\\\\begin{array}{c}\\\\text{as}x\\\\to−∞,f(x)\\\\to∞ \\\\\\\\ \\\\text{as}x\\\\to∞,f(x)\\\\to−∞\\\\end{array}$\\n\\nFigure \\n6\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-2-power-functions-and-polynomial-functions-example-4\",\"prompt\":\"Identifying Polynomial Functions Which of the following are polynomial functions? $\\\\begin{array}{ccc}f(x) \u0026 = \u0026 2x^{3}\\\\cdot 3x+4 \\\\\\\\ g(x) \u0026 = \u0026 -x(x^{2}-4) \\\\\\\\ h(x) \u0026 = \u0026 5\\\\sqrt{x+2}\\\\end{array}$\",\"options\":[\"$$h(x)$\",\"$$−3x^{4};$\",\"$$−1.$\",\"$$(4,0).$\"],\"correctIndex\":0,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"The first two functions are examples of polynomial functions because they can be written in the form $f(x)=a_{n}x^{n}+...+a_{2}x^{2}+a_{1}x+a_{0},$ \\nwhere the powers are non-negative integers and the…\",\"The answer is $h(x)$.\"],\"solution\":\"The first two functions are examples of polynomial functions because they can be written in the form $f(x)=a_{n}x^{n}+...+a_{2}x^{2}+a_{1}x+a_{0},$ \\nwhere the powers are non-negative integers and the coefficients are real numbers.\\n\\n$f(x)$\\ncan be written as $f(x)=6x^{4}+4.$\\n\\n$g(x)$\\ncan be written as $g(x)=-x^{3}+4x.$ \\n$h(x)$\\ncannot be written in this form and is therefore not a polynomial function.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-2-power-functions-and-polynomial-functions-example-5\",\"prompt\":\"Identify the degree, leading term, and leading coefficient of the following polynomial functions. $\\\\begin{array}{ccc}f(x) \u0026 = \u0026 3+2x^{2}-4x^{3} \\\\\\\\ g(t) \u0026 = \u0026 5t^{5}-2t^{3}+7t \\\\\\\\ h(p) \u0026 = \u0026 6p-p^{3}-2\\\\end{array}$\",\"options\":[\"$$10,$\",\"$$−1.$\",\"$$(–3,0).$\",\"$$x$\"],\"correctIndex\":1,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"For the function $f(x),$ the highest power of $x$ is 3, so the degree is 3.\",\"The answer is $−1.$.\"],\"solution\":\"For the function $f(x),$ the highest power of $x$ is 3, so the degree is 3. The leading term is the term containing that degree, $−4x^{3}.$ The leading coefficient is the coefficient of that term, $−4.$ \\n\\nFor the function $g(t),$ the highest power of $t$ is $5,$ so the degree is $5.$ The leading term is the term containing that degree, $5t^{5}.$ The leading coefficient is the coefficient of that term, $5.$ \\n\\nFor the function $h(p),$ the highest power of $p$ is $3,$ so the degree is $3.$ The leading term is the term containing that degree, $−p^{3}.$ The leading coefficient is the coefficient of that term, $−1.$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-2-power-functions-and-polynomial-functions-example-7\",\"prompt\":\"Identifying End Behavior and Degree of a Polynomial Function Given the function $f(x)=-3x^{2}(x-1)(x+4),$ express the function as a polynomial in general form, and determine the leading term, degree, and end behavior of the function.\",\"options\":[\"$$−3x^{4};$\",\"$$x$\",\"$$(–3,0).$\",\"$$−1.$\"],\"correctIndex\":0,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"Obtain the general form by expanding the given expression for $f(x).$ \\n\\n$\\\\begin{array}{ccc}f(x) \u0026 = \u0026 −3x^{2}(x-1)(x+4) \\\\\\\\ \u0026 = \u0026 −3x^{2}(x^{2}+3x-4) \\\\\\\\ \u0026 = \u0026 −3x^{4}-9x^{3}+12x^{2}\\\\end{array}$ \\nThe ge…\",\"The answer is $−3x^{4};$.\"],\"solution\":\"Obtain the general form by expanding the given expression for $f(x).$ \\n\\n$\\\\begin{array}{ccc}f(x) \u0026 = \u0026 −3x^{2}(x-1)(x+4) \\\\\\\\ \u0026 = \u0026 −3x^{2}(x^{2}+3x-4) \\\\\\\\ \u0026 = \u0026 −3x^{4}-9x^{3}+12x^{2}\\\\end{array}$ \\nThe general form is $f(x)=−3x^{4}-9x^{3}+12x^{2}.$ \\nThe leading term is $−3x^{4};$ \\ntherefore, the degree of the polynomial is 4. The degree is even (4) and the leading coefficient is negative (–3), so the end behavior is\\n$\\\\begin{array}{c}\\\\text{as}x\\\\to-∞,f(x)\\\\to-∞ \\\\\\\\ \\\\text{as}x\\\\to∞,f(x)\\\\to-∞\\\\end{array}$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-2-power-functions-and-polynomial-functions-example-8\",\"prompt\":\"Determining the Intercepts of a Polynomial Function Given the polynomial function $f(x)=(x-2)(x+1)(x-4),$ written in factored form for your convenience, determine the y - and x -intercepts.\",\"options\":[\"$$−1.$\",\"$$10,$\",\"$$x$\",\"$$(4,0).$\"],\"correctIndex\":3,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"The y- intercept occurs when the input is zero so substitute 0 for $x.$ \\n\\n$\\\\begin{array}{ccc}f(0) \u0026 = \u0026 f(0)=(0-2)(0+1)(0-4) \\\\\\\\ \u0026 = \u0026 (-2)(1)(-4) \\\\\\\\ \u0026 = \u0026 8\\\\end{array}$\\n\\nThe y- intercept is (0, 8).\",\"The answer is $(4,0).$.\"],\"solution\":\"The y- intercept occurs when the input is zero so substitute 0 for $x.$ \\n\\n$\\\\begin{array}{ccc}f(0) \u0026 = \u0026 f(0)=(0-2)(0+1)(0-4) \\\\\\\\ \u0026 = \u0026 (-2)(1)(-4) \\\\\\\\ \u0026 = \u0026 8\\\\end{array}$\\n\\nThe y- intercept is (0, 8).\\n\\nThe x -intercepts occur when the output is zero.\\n\\n$0=(x-2)(x+1)(x-4)$\\n\\n$\\\\begin{array}{ccccccccccc}x-2 \u0026 = \u0026 0 \u0026 \\\\text{or} \u0026 x+1 \u0026 = \u0026 0 \u0026 \\\\text{or} \u0026 x-4 \u0026 = \u0026 0 \\\\\\\\ x \u0026 = \u0026 2 \u0026 \\\\text{or} \u0026 x \u0026 = \u0026 −1 \u0026 \\\\text{or} \u0026 x \u0026 = \u0026 4\\\\end{array}$\\n\\nThe x -intercepts are $(2,0),(–1,0),$ and $(4,0).$ \\n\\nWe can see these intercepts on the graph of the function shown in Figure 10 .\\n\\nFigure \\n10\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-2-power-functions-and-polynomial-functions-example-9\",\"prompt\":\"Determining the Intercepts of a Polynomial Function with Factoring Given the polynomial function $f(x)=x^{4}-4x^{2}-45,$ determine the y - and x -intercepts.\",\"options\":[\"$$h(x)$\",\"$$(–3,0).$\",\"$$−1.$\",\"$$x\\\\to−∞,f(x)\\\\to∞.$\"],\"correctIndex\":1,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"The y- intercept occurs when the input is zero.\",\"The answer is $(–3,0).$.\"],\"solution\":\"The y- intercept occurs when the input is zero.\\n\\n$\\\\begin{array}{ccc}f(0) \u0026 = \u0026 (0)^{4}-4(0)^{2}-45 \\\\\\\\ \u0026 = \u0026 −45\\\\end{array}$\\n\\nThe y- intercept is $(0,−45).$ \\n\\nThe x -intercepts occur when the output is zero. To determine when the output is zero, we will need to factor the polynomial.\\n\\n$\\\\begin{array}{ccc}f(x) \u0026 = \u0026 x^{4}-4x^{2}-45 \\\\\\\\ \u0026 = \u0026 (x^{2}-9)(x^{2}+5) \\\\\\\\ \u0026 = \u0026 (x-3)(x+3)(x^{2}+5)\\\\end{array}$ \\n$0=(x-3)(x+3)(x^{2}+5)$ \\n$\\\\begin{array}{ccccccccc}x-3 \u0026 = \u0026 0 \u0026 \\\\text{or} \u0026 x+3 \u0026 = \u0026 0 \u0026 \\\\text{or} \u0026 x^{2}+5=0 \\\\\\\\ x \u0026 = \u0026 3 \u0026 \\\\text{or} \u0026 x \u0026 = \u0026 -3 \u0026 \\\\text{or} \u0026 (\\\\text{no real solution)}\\\\end{array}$\\n\\nThe x -intercepts are $(3,0)$ and $(–3,0).$ \\n\\nWe can see these intercepts on the graph of the function shown in Figure 11 . We can see that the function is even because $f(x)=f(-x).$ \\n\\nFigure \\n11\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-2-power-functions-and-polynomial-functions-example-10\",\"prompt\":\"Determining the Number of Intercepts and Turning Points of a Polynomial Without graphing the function, determine the local behavior of the function by finding the maximum number of x -intercepts and turning points for $f(x)=-3x^{10}+4x^{7}-x^{4}+2x^{3}.$\",\"options\":[\"$$x$\",\"$$(4,0).$\",\"$$10,$\",\"$$x\\\\to−∞,f(x)\\\\to∞.$\"],\"correctIndex\":2,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"The polynomial has a degree of $10,$ so there are at most 10 x -intercepts and at most 9 turning points.\",\"The answer is $10,$.\"],\"solution\":\"The polynomial has a degree of $10,$ so there are at most 10 x -intercepts and at most 9 turning points.\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-5-2-power-functions-and-polynomial-functions-example-12\",\"prompt\":\"Drawing Conclusions about a Polynomial Function from the Factors Given the function $f(x)=-4x(x+3)(x-4),$ determine the local behavior.\",\"options\":[\"$$10,$\",\"$$x\\\\to−∞,f(x)\\\\to∞.$\",\"$$(4,0).$\",\"$$x$\"],\"correctIndex\":2,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"The y -intercept is found by evaluating $f(0).$ \\n\\n$\\\\begin{array}{ccc}f(0) \u0026 = \u0026 -4(0)(0+3)(0-4 \\\\\\\\ \u0026 = \u0026 0\\\\end{array}$ \\nThe y -intercept is $(0,0).$ \\n\\nThe x -intercepts are found by determining the zer…\",\"The answer is $(4,0).$.\"],\"solution\":\"The y -intercept is found by evaluating $f(0).$ \\n\\n$\\\\begin{array}{ccc}f(0) \u0026 = \u0026 -4(0)(0+3)(0-4 \\\\\\\\ \u0026 = \u0026 0\\\\end{array}$ \\nThe y -intercept is $(0,0).$ \\n\\nThe x -intercepts are found by determining the zeros of the function.\\n\\n$0=−4x(x+3)(x-4)$\\n\\n$\\\\begin{array}{ccccccccccc}x \u0026 = \u0026 0 \u0026 \\\\text{or} \u0026 x+3 \u0026 = \u0026 0 \
