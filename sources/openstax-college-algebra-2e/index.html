\",\"The answer is $−4$.\"],\"solution\":\"Write the system as an augmented matrix .\\n\\n$[\\\\begin{array}{cc}2 \u0026 1 \\\\\\\\ 4 \u0026 2\\\\end{array} \\\\text{ }| \\\\text{ }\\\\begin{array}{c}1 \\\\\\\\ 6\\\\end{array}]$\\n\\nObtain a 1 in row 1, column 1. This can be accomplished by multiplying the first row by $\\\\frac{1}{2}.$ \\n\\n$\\\\frac{1}{2}R_{1}=R_{1}\\\\to[\\\\begin{array}{cc}1 \u0026 \\\\frac{1}{2} \\\\\\\\ 4 \u0026 2\\\\end{array} \\\\text{ }| \\\\text{ }\\\\begin{array}{c}\\\\frac{1}{2} \\\\\\\\ 6\\\\end{array}]$\\n\\nNext, we want a 0 in row 2, column 1. Multiply row 1 by $−4$ and add row 1 to row 2.\\n$−4R_{1}+R_{2}=R_{2}\\\\to[\\\\begin{array}{cc}1 \u0026 \\\\frac{1}{2} \\\\\\\\ 0 \u0026 0\\\\end{array} \\\\text{ }| \\\\text{ }\\\\begin{array}{c}\\\\frac{1}{2} \\\\\\\\ 4\\\\end{array}]$\\n\\nThe second row represents the equation $0=4.$ Therefore, the system is inconsistent and has no solution.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-6-solving-systems-with-gaussian-elimination-example-5\",\"prompt\":\"$$\\\\begin{array}{c}3x+4y=12 \\\\\\\\ 6x+8y=24\\\\end{array}$\",\"options\":[\"$$−4$\",\"$$z,$\",\"$$(x,3-\\\\frac{3}{4}x).$\",\"$$(4,−3,1).$\"],\"correctIndex\":2,\"hints\":[\"Match dimensions: an $m \\\\times n$ times an $n \\\\times p$ gives an $m \\\\times p$. Multiply rows by columns.\",\"Perform row operations on the augmented matrix to try and achieve row-echelon form .\",\"The answer is $(x,3-\\\\frac{3}{4}x).$.\"],\"solution\":\"Perform row operations on the augmented matrix to try and achieve row-echelon form .\\n$A=[\\\\begin{array}{cccc}3 \u0026 \u0026 4 \u0026 \\\\\\\\ 6 \u0026 \u0026 8 \u0026 \\\\end{array}|\\\\begin{array}{cc} \u0026 12 \\\\\\\\ \u0026 24\\\\end{array}]$\\n$\\\\begin{array}{ccccccccccccccccc} \\\\\\\\ \\\\begin{array}{ccccccccc}-\\\\frac{1}{2}R_{2}+R_{1}=R_{1}\\\\to[\\\\begin{array}{cccc}0 \u0026 \u0026 0 \u0026 \\\\\\\\ 6 \u0026 \u0026 8 \u0026 \\\\end{array}|\\\\begin{array}{cc} \u0026 0 \\\\\\\\ \u0026 24\\\\end{array}] \\\\\\\\ R_{1}↔R_{2}\\\\to[\\\\begin{array}{cccc}6 \u0026 \u0026 8 \u0026 \\\\\\\\ 0 \u0026 \u0026 0 \u0026 \\\\end{array}|\\\\begin{array}{cc} \u0026 24 \\\\\\\\ \u0026 0\\\\end{array}]\\\\end{array}\\\\end{array}$\\n\\nThe matrix ends up with all zeros in the last row: $0y=0.$ Thus, there are an infinite number of solutions and the system is classified as dependent. To find the generic solution, return to one of the original equations and solve for $y.$ \\n\\n$\\\\begin{array}{c}3x+4y=12 \\\\\\\\ \\\\text{        }4y=12−3x \\\\\\\\ \\\\text{          }y=3-\\\\frac{3}{4}x\\\\end{array}$\\n\\nSo the solution to this system is $(x,3-\\\\frac{3}{4}x).$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-6-solving-systems-with-gaussian-elimination-example-7\",\"prompt\":\"$$\\\\begin{array}{c}\\\\begin{array}{c} \\\\\\\\ \\\\\\\\ x-y+z=8\\\\end{array} \\\\\\\\ 2x+3y-z=−2 \\\\\\\\ 3x-2y-9z=9\\\\end{array}$\",\"options\":[\"$$(\\\\frac{61}{187},-\\\\frac{92}{187},-\\\\frac{24}{187}).$\",\"$$(4,−3,1).$\",\"$$5,000 was invested at 12% interest and \\\\$\",\"$$(x,3-\\\\frac{3}{4}x).$\"],\"correctIndex\":1,\"hints\":[\"Match dimensions: an $m \\\\times n$ times an $n \\\\times p$ gives an $m \\\\times p$. Multiply rows by columns.\",\"First, we write the augmented matrix.\",\"The answer is $(4,−3,1).$.\"],\"solution\":\"$65\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-6-solving-systems-with-gaussian-elimination-example-8\",\"prompt\":\"$$\\\\begin{array}{c}-x−2y+z=−1 \\\\\\\\ 2x+3y=2 \\\\\\\\ y−2z=0\\\\end{array}$\",\"options\":[\"$$−4$\",\"$$(x,\\\\frac{2−2x}{3},\\\\frac{1-x}{3}).$\",\"$$3,000 invested at 5% interest, \\\\$\",\"$$(\\\\frac{61}{187},-\\\\frac{92}{187},-\\\\frac{24}{187}).$\"],\"correctIndex\":1,\"hints\":[\"Match dimensions: an $m \\\\times n$ times an $n \\\\times p$ gives an $m \\\\times p$. Multiply rows by columns.\",\"Write the augmented matrix.\",\"The answer is $(x,\\\\frac{2−2x}{3},\\\\frac{1-x}{3}).$.\"],\"solution\":\"$66\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-6-solving-systems-with-gaussian-elimination-example-9\",\"prompt\":\"$$\\\\begin{array}{c}5x+3y+9z=−1 \\\\\\\\ −2x+3y-z=−2 \\\\\\\\ -x−4y+5z=1\\\\end{array}$\",\"options\":[\"$$(x,3-\\\\frac{3}{4}x).$\",\"$$(\\\\frac{3}{2},1).$\",\"$$(x,\\\\frac{2−2x}{3},\\\\frac{1-x}{3}).$\",\"$$(\\\\frac{61}{187},-\\\\frac{92}{187},-\\\\frac{24}{187}).$\"],\"correctIndex\":3,\"hints\":[\"Match dimensions: an $m \\\\times n$ times an $n \\\\times p$ gives an $m \\\\times p$. Multiply rows by columns.\",\"Write the augmented matrix for the system of equations.\",\"The answer is $(\\\\frac{61}{187},-\\\\frac{92}{187},-\\\\frac{24}{187}).$.\"],\"solution\":\"Write the augmented matrix for the system of equations.\\n\\n$[\\\\begin{array}{ccc}5 \u0026 3 \u0026 9 \\\\\\\\ −2 \u0026 3 \u0026 −1 \\\\\\\\ −1 \u0026 −4 \u0026 5\\\\end{array} \\\\text{ }| \\\\text{ }\\\\begin{array}{c}−1 \\\\\\\\ −2 \\\\\\\\ −1\\\\end{array}]$\\n\\nOn the matrix page of the calculator, enter the augmented matrix above as the matrix variable $[A].$ \\n\\n$[A]=[\\\\begin{array}{ccccccc}5 \u0026 \u0026 3 \u0026 \u0026 9 \u0026 \u0026 −1 \\\\\\\\ −2 \u0026 \u0026 3 \u0026 \u0026 −1 \u0026 \u0026 −2 \\\\\\\\ −1 \u0026 \u0026 −4 \u0026 \u0026 5 \u0026 \u0026 1\\\\end{array}]$\\n\\nUse the ref( function in the calculator, calling up the matrix variable $[A].$ \\n\\n$\\\\text{ref}([A])$\\n\\nEvaluate.\\n\\n$\\\\begin{array}{cccccccccc} \\\\\\\\ [\\\\begin{array}{cccc}1 \u0026 \\\\frac{3}{5} \u0026 \\\\frac{9}{5} \u0026 -\\\\frac{1}{5} \\\\\\\\ 0 \u0026 1 \u0026 \\\\frac{13}{21} \u0026 -\\\\frac{4}{7} \\\\\\\\ 0 \u0026 0 \u0026 1 \u0026 -\\\\frac{24}{187}\\\\end{array}]\\\\to\\\\begin{array}{c}x+\\\\frac{3}{5}y+\\\\frac{9}{5}z=-\\\\frac{1}{5} \\\\\\\\ y+\\\\frac{13}{21}z=-\\\\frac{4}{7} \\\\\\\\ z=-\\\\frac{24}{187}\\\\end{array}\\\\end{array}$\\n\\nUsing back-substitution, the solution is $(\\\\frac{61}{187},-\\\\frac{92}{187},-\\\\frac{24}{187}).$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-6-solving-systems-with-gaussian-elimination-example-10\",\"prompt\":\"Applying 2 × 2 Matrices to Finance Carolyn invests a total of \\\\$12,000 in two municipal bonds, one paying 10.5% interest and the other paying 12% interest. The annual interest earned on the two investments last year was \\\\$1,335. How much was invested at each rate?\",\"options\":[\"$$−4$\",\"$$(\\\\frac{61}{187},-\\\\frac{92}{187},-\\\\frac{24}{187}).$\",\"$$5,000 was invested at 12% interest and \\\\$\",\"$$(x,\\\\frac{2−2x}{3},\\\\frac{1-x}{3}).$\"],\"correctIndex\":2,\"hints\":[\"Match dimensions: an $m \\\\times n$ times an $n \\\\times p$ gives an $m \\\\times p$. Multiply rows by columns.\",\"We have a system of two equations in two variables.\",\"The answer is $5,000 was invested at 12% interest and \\\\$.\"],\"solution\":\"We have a system of two equations in two variables. Let $x=$ the amount invested at 10.5% interest, and $y=$ the amount invested at 12% interest.\\n\\n$\\\\begin{array}{c}\\\\text{               }x+y=12,000 \\\\\\\\ 0.105x+0.12y=1,335\\\\end{array}$\\n\\nAs a matrix, we have\\n\\n$[\\\\begin{array}{cc}1 \u0026 1 \\\\\\\\ 0.105 \u0026 0.12\\\\end{array} \\\\text{ }| \\\\text{ }\\\\begin{array}{c}12,000 \\\\\\\\ 1,335\\\\end{array}]$\\n\\nMultiply row 1 by $−0.105$ and add the result to row 2.\\n$[\\\\begin{array}{cc}1 \u0026 1 \\\\\\\\ 0 \u0026 0.015\\\\end{array} \\\\text{ }| \\\\text{ }\\\\begin{array}{c}12,000 \\\\\\\\ 75\\\\end{array}]$\\n\\nThen,\\n\\n$\\\\begin{array}{c}0.015y=75 \\\\\\\\ \\\\text{        }y=5,000\\\\end{array}$\\n\\nSo $12,000−5,000=7,000.$ \\n\\nThus, \\\\$5,000 was invested at 12% interest and \\\\$7,000 at 10.5% interest.\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-6-solving-systems-with-gaussian-elimination-example-11\",\"prompt\":\"Applying 3 × 3 Matrices to Finance Ava invests a total of \\\\$10,000 in three accounts, one paying 5% interest, another paying 8% interest, and the third paying 9% interest. The annual interest earned on the three investments last year was \\\\$770. The amount invested at 9% was twice the amount invested at 5%. How much was invested at each rate?\",\"options\":[\"$$(x,\\\\frac{2−2x}{3},\\\\frac{1-x}{3}).$\",\"$$(\\\\frac{61}{187},-\\\\frac{92}{187},-\\\\frac{24}{187}).$\",\"$$z,$\",\"$$3,000 invested at 5% interest, \\\\$\"],\"correctIndex\":3,\"hints\":[\"Match dimensions: an $m \\\\times n$ times an $n \\\\times p$ gives an $m \\\\times p$. Multiply rows by columns.\",\"We have a system of three equations in three variables.\",\"The answer is $3,000 invested at 5% interest, \\\\$.\"],\"solution\":\"$67\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"la-mm-1\",\"curatedTopicId\":\"openstax:examples:7-7-solving-systems-with-inverses\",\"topicName\":\"Solving Systems with Inverses (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-7-7-solving-systems-with-inverses-example-1\",\"prompt\":\"Showing That the Identity Matrix Acts as a 1 Given matrix A , show that $AI=IA=A.$ $A=[\\\\begin{array}{cc}3 \u0026 4 \\\\\\\\ −2 \u0026 5\\\\end{array}]$\",\"options\":[\"$$B$\",\"$$b.$\",\"$$A$\",\"$$(1,2,0).$\"],\"correctIndex\":2,\"hints\":[\"Match dimensions: an $m \\\\times n$ times an $n \\\\times p$ gives an $m \\\\times p$. Multiply rows by columns.\",\"Use matrix multiplication to show that the product of $A$ and the identity is equal to the product of the identity and A.\",\"The answer is $A$.\"],\"solution\":\"Use matrix multiplication to show that the product of $A$ and the identity is equal to the product of the identity and A. \\n\\n$AI=[\\\\begin{array}{ccc}3 \u0026 \u0026 4 \\\\\\\\ −2 \u0026 \u0026 5\\\\end{array}]\\\\begin{array}{c}\\\\end{array}[\\\\begin{array}{ccc}1 \u0026 \u0026 0 \\\\\\\\ 0 \u0026 \u0026 1\\\\end{array}]=[\\\\begin{array}{cccc}3\\\\cdot 1+4\\\\cdot 0 \u0026 \u0026 \u0026 3\\\\cdot 0+4\\\\cdot 1 \\\\\\\\ −2\\\\cdot 1+5\\\\cdot 0 \u0026 \u0026 \u0026 −2\\\\cdot 0+5\\\\cdot 1\\\\end{array}]=[\\\\begin{array}{ccc}3 \u0026 \u0026 4 \\\\\\\\ −2 \u0026 \u0026 5\\\\end{array}]$\\n$IA=[\\\\begin{array}{ccc}1 \u0026 \u0026 0 \\\\\\\\ 0 \u0026 \u0026 1\\\\end{array}]\\\\begin{array}{c}\\\\end{array}[\\\\begin{array}{ccc}3 \u0026 \u0026 4 \\\\\\\\ −2 \u0026 \u0026 5\\\\end{array}]=[\\\\begin{array}{cccc}1\\\\cdot 3+0\\\\cdot (−2) \u0026 \u0026 \u0026 1\\\\cdot 4+0\\\\cdot 5 \\\\\\\\ 0\\\\cdot 3+1\\\\cdot (−2) \u0026 \u0026 \u0026 0\\\\cdot 4+1\\\\cdot 5\\\\end{array}]=[\\\\begin{array}{ccc}3 \u0026 \u0026 4 \\\\\\\\ −2 \u0026 \u0026 5\\\\end{array}]$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-7-solving-systems-with-inverses-example-2\",\"prompt\":\"Show that the given matrices are multiplicative inverses of each other. $A=[\\\\begin{array}{ccc}1 \u0026 \u0026 5 \\\\\\\\ −2 \u0026 \u0026 −9\\\\end{array}],B=[\\\\begin{array}{ccc}−9 \u0026 \u0026 −5 \\\\\\\\ 2 \u0026 \u0026 1\\\\end{array}]$\",\"options\":[\"$$(1,2,0).$\",\"$$B$\",\"$$b.$\",\"$$(−1,1).$\"],\"correctIndex\":1,\"hints\":[\"Match dimensions: an $m \\\\times n$ times an $n \\\\times p$ gives an $m \\\\times p$. Multiply rows by columns.\",\"Multiply $AB$ and $BA.$ If both products equal the identity, then the two matrices are inverses of each other.\",\"The answer is $B$.\"],\"solution\":\"Multiply $AB$ and $BA.$ If both products equal the identity, then the two matrices are inverses of each other.\\n\\n$\\\\begin{array}{ccccccccc}AB=[\\\\begin{array}{ccc}1 \u0026 \u0026 5 \\\\\\\\ −2 \u0026 \u0026 −9\\\\end{array}]\\\\cdot [\\\\begin{array}{ccc}−9 \u0026 \u0026 −5 \\\\\\\\ 2 \u0026 \u0026 1\\\\end{array}] \\\\\\\\ =[\\\\begin{array}{ccc}1(−9)+5(2) \u0026 \u0026 1(−5)+5(1) \\\\\\\\ −2(−9)−9(2) \u0026 \u0026 −2(−5)−9(1)\\\\end{array}] \\\\\\\\ =[\\\\begin{array}{ccc}1 \u0026 \u0026 0 \\\\\\\\ 0 \u0026 \u0026 1\\\\end{array}]\\\\end{array}$\\n$\\\\begin{array}{ccccccccc}BA=[\\\\begin{array}{ccc}−9 \u0026 \u0026 −5 \\\\\\\\ 2 \u0026 \u0026 1\\\\end{array}]\\\\cdot [\\\\begin{array}{ccc}1 \u0026 \u0026 5 \\\\\\\\ −2 \u0026 \u0026 −9\\\\end{array}] \\\\\\\\ =[\\\\begin{array}{ccc}−9(1)−5(−2) \u0026 \u0026 −9(5)−5(−9) \\\\\\\\ 2(1)+1(−2) \u0026 \u0026 2(5)+1(−9)\\\\end{array}] \\\\\\\\ =[\\\\begin{array}{ccc}1 \u0026 \u0026 0 \\\\\\\\ 0 \u0026 \u0026 1\\\\end{array}]\\\\end{array}$\\n\\n$A$ and $B$ are inverses of each other.\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-7-solving-systems-with-inverses-example-3\",\"prompt\":\"Use matrix multiplication to find the inverse of the given matrix. $A=[\\\\begin{array}{ccc}1 \u0026 \u0026 −2 \\\\\\\\ 2 \u0026 \u0026 −3\\\\end{array}]$\",\"options\":[\"$$A$\",\"$$b.$\",\"$$(1,2,0).$\",\"$$[A]^{−1}\\\\times [B]$\"],\"correctIndex\":1,\"hints\":[\"Match dimensions: an $m \\\\times n$ times an $n \\\\times p$ gives an $m \\\\times p$. Multiply rows by columns.\",\"For this method, we multiply $A$ by a matrix containing unknown constants and set it equal to the identity.\",\"The answer is $b.$.\"],\"solution\":\"$68\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-7-7-solving-systems-with-inverses-example-7\",\"prompt\":\"$$\\\\begin{array}{c} 26 a_{4}=-3(4)+8=-4 \\\\\\\\ n=5 \u0026 \u0026 \u0026 \u0026 \u0026 a_{5}=-3(5)+8=-7\\\\end{array}$\\n\\nThe first five terms are $\\\\{5, 2, −1, −4, −7\\\\}.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-9-1-sequences-and-their-notations-example-2\",\"prompt\":\"Write the first five terms of the sequence. $a_{n}=\\\\frac{(-1)^{n}n^{2}}{n+1}$\",\"options\":[\"$$\\\\{5, 2, −1, −4, −7\\\\}.$\",\"$$n$\",\"$$n = 2,$\",\"$$n = 1,n=2,$\"],\"correctIndex\":2,\"hints\":[\"Identify whether the sequence is arithmetic (constant difference) or geometric (constant ratio). Then use the explicit formula.\",\"Substitute $n=1,$ $n=2,$ and so on in the formula.\",\"The answer is $n = 2,$.\"],\"solution\":\"Substitute $n=1,$ $n=2,$ and so on in the formula.\\n\\n$\\\\begin{array}{cccc}n=1 \u0026 \\\\begin{array}{cc} \u0026 \\\\end{array} \u0026 a_{1}=\\\\frac{(-1)^{1}1^{2}}{1+1}=-\\\\frac{1}{2} \\\\\\\\ n=2 \u0026 \\\\begin{array}{cc} \u0026 \\\\end{array} \u0026 a_{2}=\\\\frac{(-1)^{2}2^{2}}{2+1}=\\\\frac{4}{3} \\\\\\\\ n=3 \u0026 \\\\begin{array}{cc} \u0026 \\\\end{array} \u0026 a_{3}=\\\\frac{(-1)^{3}3^{2}}{3+1}=-\\\\frac{9}{4} \\\\\\\\ n=4 \u0026 \\\\begin{array}{cc} \u0026 \\\\end{array} \u0026 a_{4}=\\\\frac{(-1)^{4}4^{2}}{4+1}=\\\\frac{16}{5} \\\\\\\\ n=5 \u0026 \u0026 a_{5}=\\\\frac{(-1)^{5}5^{2}}{5+1}=-\\\\frac{25}{6}\\\\end{array}$\\n\\nThe first five terms are $\\\\{-\\\\frac{1}{2},\\\\frac{4}{3},−\\\\frac{9}{4},\\\\frac{16}{5},−\\\\frac{25}{6}\\\\}.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-9-1-sequences-and-their-notations-example-3\",\"prompt\":\"Write the first six terms of the sequence. $a_{n}=\\\\{\\\\begin{array}{cc}n^{2} \u0026 \\\\text{if }n \\\\text{is not divisible by 3} \\\\\\\\ \\\\frac{n}{3} \u0026 \\\\text{if }n \\\\text{is divisible by 3}\\\\end{array}$\",\"options\":[\"$$n = 2,$\",\"$$n = 1,n=2,$\",\"$$\\\\{5, 2, −1, −4, −7\\\\}.$\",\"$$n$\"],\"correctIndex\":3,\"hints\":[\"Identify whether the sequence is arithmetic (constant difference) or geometric (constant ratio). Then use the explicit formula.\",\"Substitute $n=1,n=2,$ and so on in the appropriate formula.\",\"The answer is $n$.\"],\"solution\":\"Substitute $n=1,n=2,$ and so on in the appropriate formula. Use $n^{2}$ when $n$ is not a multiple of 3. Use $\\\\frac{n}{3}$ when $n$ is a multiple of 3. \\n$\\\\begin{array}{ccccc}a_{1}=1^{2}=1\\\\begin{array}{cccc} \u0026 \u0026 \u0026 \\\\end{array} \u0026 \\\\text{1 is not a multiple of 3}\\\\text{.  Use }n^{2}. \\\\\\\\ a_{2}=2^{2}=4 \u0026 \\\\text{2 is not a multiple of 3}\\\\text{.  Use }n^{2}. \\\\\\\\ a_{3}=\\\\frac{3}{3}=1 \u0026 \\\\text{3 is a multiple of 3}\\\\text{.  Use }\\\\frac{n}{3}. \\\\\\\\ a_{4}=4^{2}=16 \u0026 \\\\text{4 is not a multiple of 3}\\\\text{.  Use }n^{2}. \\\\\\\\ a_{5}=5^{2}=25 \u0026 \\\\text{5 is not a multiple of 3}\\\\text{.  Use }n^{2}. \\\\\\\\ a_{6}=\\\\frac{6}{3}=2 \u0026 \\\\text{6 is a multiple of 3}\\\\text{.  Use }\\\\frac{n}{3}.\\\\end{array}$\\n\\nThe first six terms are $\\\\{1, \\\\text{}4, \\\\text{}1, \\\\text{}16, \\\\text{}25, \\\\text{}2\\\\}.$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-9-1-sequences-and-their-notations-example-7\",\"prompt\":\"Write the first five terms of the sequence defined by the explicit formula $a_{n}=\\\\frac{5n}{(n+2)!}.$\",\"options\":[\"$$n = 2,$\",\"$$n = 1,n=2,$\",\"$$\\\\{5, 2, −1, −4, −7\\\\}.$\",\"$$n$\"],\"correctIndex\":1,\"hints\":[\"Identify whether the sequence is arithmetic (constant difference) or geometric (constant ratio). Then use the explicit formula.\",\"Substitute $n=1,n=2,$ and so on in the formula.\",\"The answer is $n = 1,n=2,$.\"],\"solution\":\"Substitute $n=1,n=2,$ and so on in the formula.\\n\\n$\\\\begin{array}{ccccc}n=1 \u0026 \u0026 \u0026 \u0026 a_{1}=\\\\frac{5(1)}{(1+2)!}=\\\\frac{5}{3!}=\\\\frac{5}{3\\\\cdot 2\\\\cdot 1}=\\\\frac{5}{6} \\\\\\\\ n=2 \u0026 \u0026 \u0026 \u0026 a_{2}=\\\\frac{5(2)}{(2+2)!}=\\\\frac{10}{4!}=\\\\frac{10}{4\\\\cdot 3\\\\cdot 2\\\\cdot 1}=\\\\frac{5}{12} \\\\\\\\ n=3 \u0026 \u0026 \u0026 \u0026 a_{3}=\\\\frac{5(3)}{(3+2)!}=\\\\frac{15}{5!}=\\\\frac{15}{5\\\\cdot 4\\\\cdot 3\\\\cdot 2\\\\cdot 1}=\\\\frac{1}{8} \\\\\\\\ n=4 \u0026 \u0026 \u0026 \u0026 a_{4}=\\\\frac{5(4)}{(4+2)!}=\\\\frac{20}{6!}=\\\\frac{20}{6\\\\cdot 5\\\\cdot 4\\\\cdot 3\\\\cdot 2\\\\cdot 1}=\\\\frac{1}{36} \\\\\\\\ n=5 \u0026 \u0026 \u0026 \u0026 a_{5}=\\\\frac{5(5)}{(5+2)!}=\\\\frac{25}{7!}=\\\\frac{25}{7\\\\cdot 6\\\\cdot 5\\\\cdot 4\\\\cdot 3\\\\cdot 2\\\\cdot 1}=\\\\frac{5}{1\\\\text{,}008}\\\\end{array}$\\n\\nThe first five terms are $\\\\{\\\\frac{5}{6},\\\\frac{5}{12},\\\\frac{1}{8},\\\\frac{1}{36},\\\\frac{5}{1,008}\\\\}.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a2-sq-1\",\"curatedTopicId\":\"openstax:examples:9-2-arithmetic-sequences\",\"topicName\":\"Arithmetic Sequences (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-9-2-arithmetic-sequences-example-2\",\"prompt\":\"Write the first five terms of the arithmetic sequence with $a_{1}=17$ and $d=-3$ .\",\"options\":[\"$$n$\",\"$$d = −7-(−18)=11$\",\"$$\\\\{17, 14, 11, 8, 5\\\\}$\",\"$$d$\"],\"correctIndex\":2,\"hints\":[\"Identify whether the sequence is arithmetic (constant difference) or geometric (constant ratio). Then use the explicit formula.\",\"Adding $-3$ is the same as subtracting 3.\",\"The answer is $\\\\{17, 14, 11, 8, 5\\\\}$.\"],\"solution\":\"Adding $-3$ is the same as subtracting 3. Beginning with the first term, subtract 3 from each term to find the next term.\\n\\nThe first five terms are $\\\\{17, 14, 11, 8, 5\\\\}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-9-2-arithmetic-sequences-example-3\",\"prompt\":\"Writing Terms of Arithmetic Sequences Given $a_{1}=8$ and $a_{4}=14$ , find $a_{5}$ .\",\"options\":[\"$$\\\\{17, 14, 11, 8, 5\\\\}$\",\"$$d = −7-(−18)=11$\",\"$$d$\",\"$$n$\"],\"correctIndex\":2,\"hints\":[\"Identify whether the sequence is arithmetic (constant difference) or geometric (constant ratio). Then use the explicit formula.\",\"The sequence can be written in terms of the initial term 8 and the common difference $d$ .\",\"The answer is $d$.\"],\"solution\":\"The sequence can be written in terms of the initial term 8 and the common difference $d$ .\\n\\n$\\\\{8,8+d,8+2d,8+3d\\\\}$ \\nWe know the fourth term equals 14; we know the fourth term has the form $a_{1}+3d=8+3d$ .\\n\\nWe can find the common difference $d$ .\\n$\\\\begin{array}{cc}a_{n}=a_{1}+(n-1)d \u0026 \\\\\\\\ a_{4}=a_{1}+3d \u0026 \\\\\\\\ a_{4}=8+3d \u0026 \\\\text{Write the fourth term of the sequence in terms of}a_{1}\\\\text{and}d. \\\\\\\\ 14=8+3d \u0026 \\\\text{Substitute}14\\\\text{for}a_{4}. \\\\\\\\ d=2 \u0026 \\\\text{Solve for the common difference}.\\\\end{array}$\\n\\nFind the fifth term by adding the common difference to the fourth term.\\n$a_{5}=a_{4}+2=16$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-9-2-arithmetic-sequences-example-4\",\"prompt\":\"Write a recursive formula for the arithmetic sequence . $\\\\{-18\\\\text{, }-7\\\\text{, }4\\\\text{, }15\\\\text{, }26\\\\text{, …}\\\\}$\",\"options\":[\"$$n$\",\"$$\\\\{17, 14, 11, 8, 5\\\\}$\",\"$$d = −7-(−18)=11$\",\"$$d$\"],\"correctIndex\":2,\"hints\":[\"Identify whether the sequence is arithmetic (constant difference) or geometric (constant ratio). Then use the explicit formula.\",\"The first term is given as $−18$ .\",\"The answer is $d = −7-(−18)=11$.\"],\"solution\":\"The first term is given as $−18$ . The common difference can be found by subtracting the first term from the second term.\\n$d=−7-(−18)=11$ \\nSubstitute the initial term and the common difference into the recursive formula for arithmetic sequences.\\n$\\\\begin{array}{c}a_{1}=-18 \\\\\\\\ a_{n}=a_{n-1}+11, \\\\text{for }n\\\\ge2\\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-9-2-arithmetic-sequences-example-6\",\"prompt\":\"Find the number of terms in the finite arithmetic sequence . $\\\\{8\\\\text{, }1\\\\text{, }–6\\\\text{, }...\\\\text{, }–41\\\\}$\",\"options\":[\"$$d = −7-(−18)=11$\",\"$$n$\",\"$$d$\",\"$$\\\\{17, 14, 11, 8, 5\\\\}$\"],\"correctIndex\":1,\"hints\":[\"Identify whether the sequence is arithmetic (constant difference) or geometric (constant ratio). Then use the explicit formula.\",\"The common difference can be found by subtracting the first term from the second term.\",\"The answer is $n$.\"],\"solution\":\"The common difference can be found by subtracting the first term from the second term.\\n$1-8=-7$ \\n\\nThe common difference is $-7$ . Substitute the common difference and the initial term of the sequence into the $n\\\\text{th}$ term formula and simplify.\\n\\n$\\\\begin{array}{c}a_{n}=a_{1}+d(n-1) \\\\\\\\ a_{n}=8+(-7)(n-1) \\\\\\\\ a_{n}=15-7n\\\\end{array}$\\n\\nSubstitute $-41$ for $a_{n}$ and solve for $n$ \\n$\\\\begin{array}{c}-41=15-7n \\\\\\\\ 8=n\\\\end{array}$\\n\\nThere are eight terms in the sequence.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]}]}}]]}]]}]\n"])</script><script>self.__next_f.push([1,"50:[\"$\",\"div\",null,{\"className\":\"rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 p-6 shadow-sm\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"text-base font-bold text-gray-900 dark:text-gray-100 mb-2\",\"children\":\"Jump to a topic\"}],[\"$\",\"ul\",null,{\"classN
