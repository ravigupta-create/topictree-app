es $5\\\\sqrt{4}\\\\sqrt{3}.$ \\nThe square root of $\\\\sqrt{4}$ \\nis 2, so the expression becomes $5(2)\\\\sqrt{3},$ which is $10\\\\sqrt{3}.$ \\nNow the terms have the same radicand so we can add.\\n\\n$10\\\\sqrt{3}+2\\\\sqrt{3}=12\\\\sqrt{3}$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-1-3-radicals-and-rational-exponents-example-8\",\"prompt\":\"Write $\\\\frac{2\\\\sqrt{3}}{3\\\\sqrt{10}}$ in simplest form.\",\"options\":[\"$$\\\\frac{1-\\\\sqrt{5}}{1-\\\\sqrt{5}}.$\",\"$$10\\\\sqrt{3}.$\",\"$$\\\\frac{4}{a^{\\\\frac{2}{7}}}.$\",\"$$\\\\frac{\\\\sqrt{10}}{\\\\sqrt{10}}.$\"],\"correctIndex\":3,\"hints\":[\"Pull out perfect squares (or cubes) from inside the radical, or rationalize the denominator.\",\"The radical in the denominator is $\\\\sqrt{10}.$ \\nSo multiply the fraction by $\\\\frac{\\\\sqrt{10}}{\\\\sqrt{10}}.$ \\nThen simplify.\",\"The answer is $\\\\frac{\\\\sqrt{10}}{\\\\sqrt{10}}.$.\"],\"solution\":\"The radical in the denominator is $\\\\sqrt{10}.$ \\nSo multiply the fraction by $\\\\frac{\\\\sqrt{10}}{\\\\sqrt{10}}.$ \\nThen simplify.\\n\\n$\\\\begin{array}{c}\\\\frac{2\\\\sqrt{3}}{3\\\\sqrt{10}}\\\\cdot \\\\frac{\\\\sqrt{10}}{\\\\sqrt{10}} \\\\text{   } \\\\\\\\ \\\\frac{2\\\\sqrt{30}}{30} \\\\text{          } \\\\\\\\ \\\\frac{\\\\sqrt{30}}{15}\\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-1-3-radicals-and-rational-exponents-example-9\",\"prompt\":\"Write $\\\\frac{4}{1+\\\\sqrt{5}}$ in simplest form.\",\"options\":[\"$$\\\\frac{\\\\sqrt{10}}{\\\\sqrt{10}}.$\",\"$$\\\\frac{4}{a^{\\\\frac{2}{7}}}.$\",\"$$10\\\\sqrt{3}.$\",\"$$\\\\frac{1-\\\\sqrt{5}}{1-\\\\sqrt{5}}.$\"],\"correctIndex\":3,\"hints\":[\"Pull out perfect squares (or cubes) from inside the radical, or rationalize the denominator.\",\"Begin by finding the conjugate of the denominator by writing the denominator and changing the sign.\",\"The answer is $\\\\frac{1-\\\\sqrt{5}}{1-\\\\sqrt{5}}.$.\"],\"solution\":\"Begin by finding the conjugate of the denominator by writing the denominator and changing the sign. So the conjugate of $1+\\\\sqrt{5}$ \\nis $1-\\\\sqrt{5}.$ \\nThen multiply the fraction by $\\\\frac{1-\\\\sqrt{5}}{1-\\\\sqrt{5}}.$ \\n\\n$\\\\begin{array}{cc}\\\\frac{4}{1+\\\\sqrt{5}}\\\\cdot \\\\frac{1-\\\\sqrt{5}}{1-\\\\sqrt{5}} \u0026 \\\\\\\\ \\\\frac{4-4\\\\sqrt{5}}{-4} \u0026 \\\\text{Use the distributive property}. \\\\\\\\ \\\\sqrt{5}-1 \u0026 \\\\text{Simplify}.\\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-1-3-radicals-and-rational-exponents-example-12\",\"prompt\":\"Write $\\\\frac{4}{\\\\sqrt[7]{a^{2}}}$ using a rational exponent.\",\"options\":[\"$$10\\\\sqrt{3}.$\",\"$$\\\\frac{1-\\\\sqrt{5}}{1-\\\\sqrt{5}}.$\",\"$$\\\\frac{\\\\sqrt{10}}{\\\\sqrt{10}}.$\",\"$$\\\\frac{4}{a^{\\\\frac{2}{7}}}.$\"],\"correctIndex\":3,\"hints\":[\"Pull out perfect squares (or cubes) from inside the radical, or rationalize the denominator.\",\"The power is 2 and the root is 7, so the rational exponent will be $\\\\frac{2}{7}.$ \\nWe get $\\\\frac{4}{a^{\\\\frac{2}{7}}}.$ \\nUsing properties of exponents, we get $\\\\frac{4}{\\\\sqrt[7]{a^{2}}}=4a^{\\\\frac{−2}{7…\",\"The answer is $\\\\frac{4}{a^{\\\\frac{2}{7}}}.$.\"],\"solution\":\"The power is 2 and the root is 7, so the rational exponent will be $\\\\frac{2}{7}.$ \\nWe get $\\\\frac{4}{a^{\\\\frac{2}{7}}}.$ \\nUsing properties of exponents, we get $\\\\frac{4}{\\\\sqrt[7]{a^{2}}}=4a^{\\\\frac{−2}{7}}.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a1-fp-1\",\"curatedTopicId\":\"openstax:examples:1-5-factoring-polynomials\",\"topicName\":\"Factoring Polynomials (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-1-5-factoring-polynomials-example-1\",\"prompt\":\"Factor Factor $6x^{3}y^{3}+45x^{2}y^{2}+21xy.$\",\"options\":[\"$$(x-3)(x+5).$\",\"$$(2x-5)(4x^{2}+10x+25).$\",\"$$(3xy)(2x^{2}y^{2}+15xy+7)$\",\"$$(x+2)^{-\\\\frac{1}{3}}.$\"],\"correctIndex\":2,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"First, find the GCF of the expression.\",\"The answer is $(3xy)(2x^{2}y^{2}+15xy+7)$.\"],\"solution\":\"First, find the GCF of the expression. The GCF of 6, 45, and 21 is 3. The GCF of $x^{3},x^{2}$ , and $x$ is $x$ . (Note that the GCF of a set of expressions in the form $x^{n}$ will always be the exponent of lowest degree.) And the GCF of $y^{3},y^{2}$ , and $y$ is $y$ . Combine these to find the GCF of the polynomial, $3xy$ .\\n\\nNext, determine what the GCF needs to be multiplied by to obtain each term of the polynomial. We find that $3xy(2x^{2}y^{2})=6x^{3}y^{3},3xy(15xy)=45x^{2}y^{2}$ , and $3xy(7)=21xy.$ \\n\\nFinally, write the factored expression as the product of the GCF and the sum of the terms we needed to multiply by.\\n\\n$(3xy)(2x^{2}y^{2}+15xy+7)$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-1-5-factoring-polynomials-example-2\",\"prompt\":\"Factor $x^{2}+2x-15.$\",\"options\":[\"$$q = 10$\",\"$$(5x+2)^{2}.$\",\"$$(x-3)(x+5).$\",\"$$(x+8)(x^{2}-8x+64).$\"],\"correctIndex\":2,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"We have a trinomial with leading coefficient $1,b=2,$ and $c=−15.$ We need to find two numbers with a product of $−15$ and a sum of $2.$ In the table below, we list factors until we find a pair with t…\",\"The answer is $(x-3)(x+5).$.\"],\"solution\":\"We have a trinomial with leading coefficient $1,b=2,$ and $c=−15.$ We need to find two numbers with a product of $−15$ and a sum of $2.$ In the table below, we list factors until we find a pair with the desired sum.\\n\\nFactors of $−15$\\n\\nSum of Factors \\n\\n$1,−15$\\n\\n$−14$\\n\\n$−1,15$\\n\\n14 \\n\\n$3,−5$\\n\\n$−2$\\n\\n$−3,5$\\n\\n2 \\n\\nNow that we have identified $p$ and $q$ as $−3$ and $5,$ write the factored form as $(x-3)(x+5).$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-1-5-factoring-polynomials-example-3\",\"prompt\":\"Factor $5x^{2}+7x-6$ by grouping.\",\"options\":[\"$$q = 10$\",\"$$(5x+2)^{2}.$\",\"$$(3xy)(2x^{2}y^{2}+15xy+7)$\",\"$$(x+2)^{-\\\\frac{1}{3}}.$\"],\"correctIndex\":0,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"We have a trinomial with $a=5,b=7,$ and $c=−6.$ First, determine $ac=−30.$ We need to find two numbers with a product of $−30$ and a sum of $7.$ In the table below, we list factors until we find a pai…\",\"The answer is $q = 10$.\"],\"solution\":\"We have a trinomial with $a=5,b=7,$ and $c=−6.$ First, determine $ac=−30.$ We need to find two numbers with a product of $−30$ and a sum of $7.$ In the table below, we list factors until we find a pair with the desired sum.\\n\\nFactors of $−30$\\n\\nSum of Factors \\n\\n$1,−30$\\n\\n$−29$\\n\\n$−1,30$\\n\\n29 \\n\\n$2,−15$\\n\\n$−13$\\n\\n$−2,15$\\n\\n13 \\n\\n$3,−10$\\n\\n$−7$\\n\\n$−3,10$\\n\\n7 \\n\\nSo $p=−3$ and $q=10.$ \\n\\n$\\\\begin{array}{cc}5x^{2}-3x+10x-6 \u0026 \\\\text{Rewrite the original expression as }ax^{2}+px+qx+c. \\\\\\\\ x(5x-3)+2(5x-3) \u0026 \\\\text{Factor out the GCF of each part}. \\\\\\\\ (5x-3)(x+2) \u0026 \\\\text{Factor out the GCF}\\\\text{​} \\\\text{of the expression}.\\\\end{array}$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-1-5-factoring-polynomials-example-4\",\"prompt\":\"Factor $25x^{2}+20x+4.$\",\"options\":[\"$$q = 10$\",\"$$(x+2)^{-\\\\frac{1}{3}}.$\",\"$$(5x+2)^{2}.$\",\"$$(2x-5)(4x^{2}+10x+25).$\"],\"correctIndex\":2,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"Notice that $25x^{2}$ and $4$ are perfect squares because $25x^{2}=(5x)^{2}$ and $4=2^{2}.$ Then check to see if the middle term is twice the product of $5x$ and $2.$ The middle term is, indeed, twice…\",\"The answer is $(5x+2)^{2}.$.\"],\"solution\":\"Notice that $25x^{2}$ and $4$ are perfect squares because $25x^{2}=(5x)^{2}$ and $4=2^{2}.$ Then check to see if the middle term is twice the product of $5x$ and $2.$ The middle term is, indeed, twice the product: $2(5x)(2)=20x.$ Therefore, the trinomial is a perfect square trinomial and can be written as $(5x+2)^{2}.$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-1-5-factoring-polynomials-example-5\",\"prompt\":\"Factor $9x^{2}-25.$\",\"options\":[\"$$(3xy)(2x^{2}y^{2}+15xy+7)$\",\"$$(5x+2)^{2}.$\",\"$$(3x+5)(3x-5).$\",\"$$(x+8)(x^{2}-8x+64).$\"],\"correctIndex\":2,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"Notice that $9x^{2}$ and $25$ are perfect squares because $9x^{2}=(3x)^{2}$ and $25=5^{2}.$ The polynomial represents a difference of squares and can be rewritten as $(3x+5)(3x-5).$\",\"The answer is $(3x+5)(3x-5).$.\"],\"solution\":\"Notice that $9x^{2}$ and $25$ are perfect squares because $9x^{2}=(3x)^{2}$ and $25=5^{2}.$ The polynomial represents a difference of squares and can be rewritten as $(3x+5)(3x-5).$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-1-5-factoring-polynomials-example-6\",\"prompt\":\"Factor $x^{3}+512.$\",\"options\":[\"$$(x+2)^{-\\\\frac{1}{3}}.$\",\"$$(x+8)(x^{2}-8x+64).$\",\"$$(2x-5)(4x^{2}+10x+25).$\",\"$$(x-3)(x+5).$\"],\"correctIndex\":1,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"Notice that $x^{3}$ and $512$ are cubes because $8^{3}=512.$ Rewrite the sum of cubes as $(x+8)(x^{2}-8x+64).$\",\"The answer is $(x+8)(x^{2}-8x+64).$.\"],\"solution\":\"Notice that $x^{3}$ and $512$ are cubes because $8^{3}=512.$ Rewrite the sum of cubes as $(x+8)(x^{2}-8x+64).$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-1-5-factoring-polynomials-example-7\",\"prompt\":\"Factor $8x^{3}-125.$\",\"options\":[\"$$(x-3)(x+5).$\",\"$$(x+8)(x^{2}-8x+64).$\",\"$$(2x-5)(4x^{2}+10x+25).$\",\"$$(3x+5)(3x-5).$\"],\"correctIndex\":2,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"Notice that $8x^{3}$ and $125$ are cubes because $8x^{3}=(2x)^{3}$ and $125=5^{3}.$ Write the difference of cubes as $(2x-5)(4x^{2}+10x+25).$\",\"The answer is $(2x-5)(4x^{2}+10x+25).$.\"],\"solution\":\"Notice that $8x^{3}$ and $125$ are cubes because $8x^{3}=(2x)^{3}$ and $125=5^{3}.$ Write the difference of cubes as $(2x-5)(4x^{2}+10x+25).$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-1-5-factoring-polynomials-example-8\",\"prompt\":\"Factor $3x(x+2)^{\\\\frac{−1}{3}}+4(x+2)^{\\\\frac{2}{3}}.$\",\"options\":[\"$$(x+2)^{-\\\\frac{1}{3}}.$\",\"$$(5x+2)^{2}.$\",\"$$(x+8)(x^{2}-8x+64).$\",\"$$(x-3)(x+5).$\"],\"correctIndex\":0,\"hints\":[\"Look for a common factor first, then check for difference of squares, perfect-square trinomial, or factor by grouping.\",\"Factor out the term with the lowest value of the exponent.\",\"The answer is $(x+2)^{-\\\\frac{1}{3}}.$.\"],\"solution\":\"Factor out the term with the lowest value of the exponent. In this case, that would be $(x+2)^{-\\\\frac{1}{3}}.$ \\n\\n$\\\\begin{array}{cc}(x+2)^{-\\\\frac{1}{3}}(3x+4(x+2)) \u0026 \\\\text{Factor out the GCF}. \\\\\\\\ (x+2)^{-\\\\frac{1}{3}}(3x+4x+8) \u0026 \\\\text{Simplify}. \\\\\\\\ (x+2)^{-\\\\frac{1}{3}}(7x+8) \u0026 \\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a1-le-1\",\"curatedTopicId\":\"openstax:examples:2-2-linear-equations-in-one-variable\",\"topicName\":\"Linear Equations (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-2-2-linear-equations-in-one-variable-example-4\",\"prompt\":\"Solve the following rational equation: $\\\\frac{2}{x}-\\\\frac{3}{2}=\\\\frac{7}{2x}$\",\"options\":[\"$$-\\\\frac{3}{5}.$\",\"$$x = 1$\",\"$$y = \\\\frac{7}{3}x-3$\",\"$$or$\"],\"correctIndex\":3,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"We have three denominators: $x,$ $2,$ and $2x.$ No factoring is required.\",\"The answer is $or$.\"],\"solution\":\"We have three denominators: $x,$ $2,$ and $2x.$ No factoring is required. The product of the first two denominators is equal to the third denominator, so, the LCD is $2x.$ Only one value is excluded from a solution set, 0. $$ Next, multiply the whole equation (both sides of the equal sign) by $2x.$ \\n\\n$\\\\begin{array}{cccc}2x(\\\\frac{2}{x}-\\\\frac{3}{2}) \u0026 = \u0026 (\\\\frac{7}{2x})2x \u0026 \\\\\\\\ 2x(\\\\frac{2}{x})-2x(\\\\frac{3}{2}) \u0026 = \u0026 (\\\\frac{7}{2x})2x \u0026 \\\\text{Distribute }2x\\\\text{.} \\\\\\\\ 2(2)-3x \u0026 = \u0026 7 \u0026 \\\\text{Denominators cancel out}. \\\\\\\\ 4-3x \u0026 = \u0026 7 \u0026 \\\\\\\\ −3x \u0026 = \u0026 3 \u0026 \\\\\\\\ x \u0026 = \u0026 −1 \u0026 \\\\\\\\ \u0026 \u0026 \\\\text{or} \\\\{−1\\\\} \u0026 \\\\end{array}$\\n\\nThe proposed solution is −1, $$ which is not an excluded value, so the solution set contains one number, $−1,$ or $\\\\{−1\\\\}$ written in set notation.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-2-2-linear-equations-in-one-variable-example-7\",\"prompt\":\"$$ State the excluded values.\",\"options\":[\"$$(x_{1},y_{1}).$\",\"$$-\\\\frac{4}{7}.$\",\"$$y = \\\\frac{7}{3}x-3$\",\"$$−1.$\"],\"correctIndex\":3,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"We must factor the denominator $x^{2}−1.$ We recognize this as the difference of squares, and factor it as $(x-1)(x+1).$ Thus, the LCD that contains each denominator is $(x-1)(x+1).$ Multiply the whol…\",\"The answer is $−1.$.\"],\"solution\":\"We must factor the denominator $x^{2}−1.$ We recognize this as the difference of squares, and factor it as $(x-1)(x+1).$ Thus, the LCD that contains each denominator is $(x-1)(x+1).$ Multiply the whole equation by the LCD, cancel out the denominators, and solve the remaining equation.\\n\\n$\\\\begin{array}{ccc}(x-1)(x+1)(\\\\frac{2}{x+1}-\\\\frac{1}{x-1}) \u0026 = \u0026 (\\\\frac{2x}{(x-1)(x+1)})(x-1)(x+1) \\\\\\\\ 2(x-1)-1(x+1) \u0026 = \u0026 2x \\\\\\\\ 2x-2-x-1 \u0026 = \u0026 2x \\\\text{Distribute the negative sign}. \\\\\\\\ −3-x \u0026 = \u0026 0 \\\\\\\\ −3 \u0026 = \u0026 x\\\\end{array}$ \\nThe solution is $−3.$ The excluded values are $1$ and $−1.$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-2-2-linear-equations-in-one-variable-example-8\",\"prompt\":\"Find the slope of a line that passes through the points $(2,−1)$ and $(−5,3).$\",\"options\":[\"$$-\\\\frac{4}{7}.$\",\"$$x = 1$\",\"$$or$\",\"$$b = −4$\"],\"correctIndex\":0,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"We substitute the y- values and the x- values into the formula.\",\"The answer is $-\\\\frac{4}{7}.$.\"],\"solution\":\"We substitute the y- values and the x- values into the formula.\\n\\n$\\\\begin{array}{ccc}m \u0026 = \u0026 \\\\frac{3-(−1)}{−5-2} \\\\\\\\ \u0026 = \u0026 \\\\frac{4}{−7} \\\\\\\\ \u0026 = \u0026 -\\\\frac{4}{7}\\\\end{array}$\\n\\nThe slope is $-\\\\frac{4}{7}.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-2-2-linear-equations-in-one-variable-example-9\",\"prompt\":\"Identify the slope and y- intercept, given the equation $y=-\\\\frac{3}{4}x-4.$\",\"options\":[\"$$(x_{1},y_{1}).$\",\"$$b = −4$\",\"$$y = \\\\frac{7}{3}x-3$\",\"$$x = 1$\"],\"correctIndex\":1,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"As the line is in $y=mx+b$ form, the given line has a slope of $m=-\\\\frac{3}{4}.$ The y- intercept is $b=−4.$\",\"The answer is $b = −4$.\"],\"solution\":\"As the line is in $y=mx+b$ form, the given line has a slope of $m=-\\\\frac{3}{4}.$ The y- intercept is $b=−4.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-2-2-linear-equations-in-one-variable-example-10\",\"prompt\":\"Write the equation of the line with slope $m=−3$ and passing through the point $(4,8).$ Write the final equation in slope-intercept form.\",\"options\":[\"$$b = −4$\",\"$$-\\\\frac{3}{5}.$\",\"$$y = \\\\frac{7}{3}x-3$\",\"$$(x_{1},y_{1}).$\"],\"correctIndex\":3,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"Using the point-slope formula, substitute $−3$ for m and the point $(4,8)$ for $(x_{1},y_{1}).$ \\n\\n$\\\\begin{array}{ccc}y-y_{1} \u0026 = \u0026 m(x-x_{1}) \\\\\\\\ y-8 \u0026 = \u0026 −3(x-4) \\\\\\\\ y-8 \u0026 = \u0026 −3x+12 \\\\\\\\ y \u0026 = \u0026 −3x+20…\",\"The answer is $(x_{1},y_{1}).$.\"],\"solution\":\"Using the point-slope formula, substitute $−3$ for m and the point $(4,8)$ for $(x_{1},y_{1}).$ \\n\\n$\\\\begin{array}{ccc}y-y_{1} \u0026 = \u0026 m(x-x_{1}) \\\\\\\\ y-8 \u0026 = \u0026 −3(x-4) \\\\\\\\ y-8 \u0026 = \u0026 −3x+12 \\\\\\\\ y \u0026 = \u0026 −3x+20\\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-2-2-linear-equations-in-one-variable-example-11\",\"prompt\":\"Find the equation of the line passing through the points $(3,4)$ and $(0,−3).$ Write the final equation in slope-intercept form.\",\"options\":[\"$$(x_{1},y_{1}).$\",\"$$−1.$\",\"$$y = \\\\frac{7}{3}x-3$\",\"$$-\\\\frac{3}{5}.$\"],\"correctIndex\":2,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"First, we calculate the slope using the slope formula and two points.\",\"The answer is $y = \\\\frac{7}{3}x-3$.\"],\"solution\":\"First, we calculate the slope using the slope formula and two points.\\n\\n$\\\\begin{array}{ccc}m \u0026 = \u0026 \\\\frac{−3-4}{0-3} \\\\\\\\ \u0026 = \u0026 \\\\frac{-7}{-3} \\\\\\\\ \u0026 = \u0026 \\\\frac{7}{3}\\\\end{array}$\\n\\nNext, we use the point-slope formula with the slope of $\\\\frac{7}{3},$ and either point. Let’s pick the point $(3,4)$ for $(x_{1},y_{1}).$ \\n\\n$\\\\begin{array}{ccc}y-4 \u0026 = \u0026 \\\\frac{7}{3}(x-3) \\\\\\\\ y-4 \u0026 = \u0026 \\\\frac{7}{3}x-7 \\\\text{Distribute the }\\\\frac{7}{3}. \\\\\\\\ y \u0026 = \u0026 \\\\frac{7}{3}x-3\\\\end{array}$\\n\\nIn slope-intercept form, the equation is written as $y=\\\\frac{7}{3}x-3.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-2-2-linear-equations-in-one-variable-example-13\",\"prompt\":\"Find the equation of the line passing through the given points: $(1,−3)$ and $(1,4).$\",\"options\":[\"$$(x_{1},y_{1}).$\",\"$$-\\\\frac{4}{7}.$\",\"$$x = 1$\",\"$$b = −4$\"],\"correctIndex\":2,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"The x- coordinate of both points is 1.\",\"The answer is $x = 1$.\"],\"solution\":\"The x- coordinate of both points is 1. Therefore, we have a vertical line, $x=1.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-2-2-linear-equations-in-one-variable-example-16\",\"prompt\":\"Find the equation of the line perpendicular to $5x-3y+4=0$ and passing through the point $(-4,1).$\",\"options\":[\"$$(x_{1},y_{1}).$\",\"$$y = \\\\frac{7}{3}x-3$\",\"$$-\\\\frac{4}{7}.$\",\"$$-\\\\frac{3}{5}.$\"],\"correctIndex\":3,\"hints\":[\"Isolate the variable: combine like terms on each side, then move all variable terms to one side and constants to the other.\",\"The first step is to write the equation in slope-intercept form.\",\"The answer is $-\\\\frac{3}{5}.$.\"],\"solution\":\"The first step is to write the equation in slope-intercept form.\\n\\n$\\\\begin{array}{ccc}5x-3y+4 \u0026 = \u0026 0 \\\\\\\\ −3y \u0026 = \u0026 −5x-4 \\\\\\\\ y \u0026 = \u0026 \\\\frac{5}{3}x+\\\\frac{4}{3}\\\\end{array}$\\n\\nWe see that the slope is $m=\\\\frac{5}{3}.$ This means that the slope of the line perpendicular to the given line is the negative reciprocal, or $-\\\\frac{3}{5}.$ Next, we use the point-slope formula with this new slope and the given point.\\n\\n$\\\\begin{array}{ccc}y-1 \u0026 = \u0026 -\\\\frac{3}{5}(x-(−4)) \\\\\\\\ y-1 \u0026 = \u0026 -\\\\frac{3}{5}x-\\\\frac{12}{5} \\\\\\\\ y \u0026 = \u0026 -\\\\frac{3}{5}x-\\\\frac{12}{5}+\\\\frac{5}{5} \\\\\\\\ y \u0026 = \u0026 -\\\\frac{3}{5}x-\\\\frac{7}{5}\\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a2-cn-1\",\"curatedTopicId\":\"openstax:examples:2-4-complex-numbers\",\"topicName\":\"Complex Numbers (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-2-4-complex-numbers-example-1\",\"prompt\":\"Express $\\\\sqrt{−9}$ in standard form.\",\"options\":[\"$$i^{4}$\",\"$$\\\\frac{(2+5i)}{(4-i)} \\\\cdot \\\\frac{(4+i)}{(4+i)}$\",\"$$(3,−4)$\",\"$$0+3i.$\"],\"correctIndex\":3,\"hints\":[\"Use $i^2 = -1$. Combine real with real, imaginary with imaginary.\",\"$$\\\\begin{array}{ccc}\\\\sqrt{−9} \u0026 = \u0026 \\\\sqrt{9}\\\\sqrt{−1} \\\\\\\\ \u0026 = \u0026 3i\\\\end{array}$ \\n\\nIn standard form, this is $0+3i.$\",\"The answer is $0+3i.$.\"],\"solution\":\"$$\\\\begin{array}{ccc}\\\\sqrt{−9} \u0026 = \u0026 \\\\sqrt{9}\\\\sqrt{−1} \\\\\\\\ \u0026 = \u0026 3i\\\\end{array}$ \\n\\nIn standard form, this is $0+3i.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-2-4-complex-numbers-example-2\",\"prompt\":\"Plot the complex number $3-4i$ on the complex plane.\",\"options\":[\"$$\\\\frac{(2+5i)}{(4-i)} \\\\cdot \\\\frac{(4+i)}{(4+i)}$\",\"$$i^{4}$\",\"$$(3,−4)$\",\"$$0+3i.$\"],\"correctIndex\":2,\"hints\":[\"Use $i^2 = -1$. Combine real with real, imaginary with imaginary.\",\"The real part of the complex number is $3,$ and the imaginary part is –4.\",\"The answer is $(3,−4)$.\"],\"solution\":\"The real part of the complex number is $3,$ and the imaginary part is –4. We plot the ordered pair $(3,−4)$ as shown in Figure 4 . \\n\\nFigure \\n4\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-2-4-complex-numbers-example-7\",\"prompt\":\"Divide: $(2+5i)$ by $(4-i).$\",\"options\":[\"$$i^{4}$\",\"$$0+3i.$\",\"$$\\\\frac{(2+5i)}{(4-i)} \\\\cdot \\\\frac{(4+i)}{(4+i)}$\",\"$$(3,−4)$\"],\"correctIndex\":2,\"hints\":[\"Use $i^2 = -1$. Combine real with real, imaginary with imaginary.\",\"We begin by writing the problem as a fraction.\",\"The answer is $\\\\frac{(2+5i)}{(4-i)} \\\\cdot \\\\frac{(4+i)}{(4+i)}$.\"],\"solution\":\"We begin by writing the problem as a fraction.\\n\\n$\\\\frac{(2+5i)}{(4-i)}$ \\n\\nThen we multiply the numerator and denominator by the complex conjugate of the denominator.\\n\\n$\\\\frac{(2+5i)}{(4-i)} \\\\cdot \\\\frac{(4+i)}{(4+i)}$ \\n\\nTo multiply two complex numbers, we expand the product as we would with polynomials (using FOIL).\\n\\n$\\\\begin{array}{cccc}\\\\frac{(2+5i)}{(4-i)}\\\\cdot \\\\frac{(4+i)}{(4+i)} \u0026 = \u0026 \\\\frac{8+2i+20i+5i^{2}}{16+4i-4i-i^{2}} \u0026 \\\\\\\\ \u0026 = \u0026 \\\\frac{8+2i+20i+5(−1)}{16+4i-4i-(−1)} \u0026 \\\\text{Because}i^{2}=−1. \\\\\\\\ \u0026 = \u0026 \\\\frac{3+22i}{17} \u0026 \\\\\\\\ \u0026 = \u0026 \\\\frac{3}{17}+\\\\frac{22}{17}i \u0026 \\\\text{Separate real and imaginary parts}.\\\\end{array}$\\n\\nNote that this expresses the quotient in standard form.\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-2-4-complex-numbers-example-8\",\"prompt\":\"Simplifying Powers of $i$ Evaluate: $i^{35}.$\",\"options\":[\"$$\\\\frac{(2+5i)}{(4-i)} \\\\cdot \\\\frac{(4+i)}{(4+i)}$\",\"$$i^{4}$\",\"$$0+3i.$\",\"$$(3,−4)$\"],\"correctIndex\":1,\"hints\":[\"Use $i^2 = -1$. Combine real with real, imaginary with imaginary.\",\"Since $i^{4}=1,$ we can simplify the problem by factoring out as many factors of $i^{4}$ as possible.\",\"The answer is $i^{4}$.\"],\"solution\":\"Since $i^{4}=1,$ we can simplify the problem by factoring out as many factors of $i^{4}$ as possible. To do so, first determine how many times 4 goes into 35: $35=4\\\\cdot 8+3.$ \\n\\n$i^{35}=i^{4\\\\cdot 8+3}=i^{4\\\\cdot 8}\\\\cdot i^{3}=(i^{4})^{8}\\\\cdot i^{3}=1^{8}\\\\cdot i^{3}=i^{3}=-i$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a1-qd-1\",\"curatedTopicId\":\"openstax:examples:2-5-quadratic-equations\",\"topicName\":\"Quadratic Equations (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-2-5-quadratic-equations-example-1\",\"prompt\":\"Factor and solve the equation: $x^{2}+x-6=0.$\",\"options\":[\"$$−3.$\",\"$$−5.$\",\"$$y = x^{2}+x-6=0$\",\"$$a = 1,b=5,c=1$\"],\"correctIndex\":2,\"hints\":[\"Try factoring first; if it doesn't factor, fall back to the quadratic formula or completing the square.\",\"To factor $x^{2}+x-6=0,$ we look for two numbers whose product equals $−6$ and whose sum equals 1.\",\"The answer is $y = x^{2}+x-6=0$.\"],\"solution\":\"To factor $x^{2}+x-6=0,$ we look for two numbers whose product equals $−6$ and whose sum equals 1. Begin by looking at the possible factors of $−6.$ \\n\\n$\\\\begin{array}{c}1\\\\cdot (−6) \\\\\\\\ (−6)\\\\cdot 1 \\\\\\\\ 2\\\\cdot (−3) \\\\\\\\ 3\\\\cdot (−2)\\\\end{array}$ \\nThe last pair, $3\\\\cdot (−2)$ sums to 1, so these are the numbers. Note that only one pair of numbers will work. Then, write the factors.\\n\\n$(x-2)(x+3)=0$\\n\\nTo solve this equation, we use the zero-product property. Set each factor equal to zero and solve.\\n\\n$\\\\begin{array}{ccc}(x-2)(x+3) \u0026 = \u0026 0 \\\\\\\\ (x-2) \u0026 = \u0026 0 \\\\\\\\ x \u0026 = \u0026 2 \\\\\\\\ (x+3) \u0026 = \u0026 0 \\\\\\\\ x \u0026 = \u0026 −3\\\\end{array}$\\n\\nThe two solutions are $2$ and $−3.$ We can see how the solutions relate to the graph in Figure 2 . The solutions are the x- intercepts of $y=x^{2}+x-6=0.$ \\n\\nFigure \\n2\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-2-5-quadratic-equations-example-2\",\"prompt\":\"Solve the Quadratic Equation by Factoring Solve the quadratic equation by factoring: $x^{2}+8x+15=0.$\",\"options\":[\"$$a = 1,b=5,c=1$\",\"$$−3.$\",\"$$−5.$\",\"$$y = x^{2}+x-6=0$\"],\"correctIndex\":2,\"hints\":[\"Try factoring first; if it doesn't factor, fall back to the quadratic formula or completing the square.\",\"Find two numbers whose product equals $15$ and whose sum equals $8.$ List the factors of $15.$ \\n\\n$\\\\begin{array}{c}1\\\\cdot 15 \\\\\\\\ 3\\\\cdot 5 \\\\\\\\ (−1)\\\\cdot (−15) \\\\\\\\ (−3)\\\\cdot (−5)\\\\end{array}$\\n\\nThe numbers th…\",\"The answer is $−5.$.\"],\"solution\":\"Find two numbers whose product equals $15$ and whose sum equals $8.$ List the factors of $15.$ \\n\\n$\\\\begin{array}{c}1\\\\cdot 15 \\\\\\\\ 3\\\\cdot 5 \\\\\\\\ (−1)\\\\cdot (−15) \\\\\\\\ (−3)\\\\cdot (−5)\\\\end{array}$\\n\\nThe numbers that add to 8 are 3 and 5. Then, write the factors, set each factor equal to zero, and solve.\\n\\n$\\\\begin{array}{ccc}(x+3)(x+5) \u0026 = \u0026 0 \\\\\\\\ (x+3) \u0026 = \u0026 0 \\\\\\\\ x \u0026 = \u0026 −3 \\\\\\\\ (x+5) \u0026 = \u0026 0 \\\\\\\\ x \u0026 = \u0026 −5\\\\end{array}$\\n\\nThe solutions are $−3$ and $−5.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-2-5-quadratic-equations-example-3\",\"prompt\":\"Solve a Quadratic Equation Written as the Difference of Squares Solve the difference of squares equation using the zero-product property: $x^{2}-9=0.$\",\"options\":[\"$$−3.$\",\"$$−5.$\",\"$$a = 1,b=5,c=1$\",\"$$y = x^{2}+x-6=0$\"],\"correctIndex\":0,\"hints\":[\"Try factoring first; if it doesn't factor, fall back to the quadratic formula or completing the square.\",\"Recognizing that the equation represents the difference of squares, we can write the two factors by taking the square root of each term, using a minus sign as the operator in one factor and a plus sig…\",\"The answer is $−3.$.\"],\"solution\":\"Recognizing that the equation represents the difference of squares, we can write the two factors by taking the square root of each term, using a minus sign as the operator in one factor and a plus sign as the operator in the other. Solve using the zero-factor property.\\n\\n$\\\\begin{array}{ccc}x^{2}-9 \u0026 = \u0026 0 \\\\\\\\ (x-3)(x+3) \u0026 = \u0026 0 \\\\\\\\ (x-3) \u0026 = \u0026 0 \\\\\\\\ x \u0026 = \u0026 3 \\\\\\\\ (x+3) \u0026 = \u0026 0 \\\\\\\\ x \u0026 = \u0026 −3\\\\end{array}$\\n\\nThe solutions are $3$ and $−3.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-2-5-quadratic-equations-example-9\",\"prompt\":\"Solve the Quadratic Equation Using the Quadratic Formula Solve the quadratic equation: $x^{2}+5x+1=0.$\",\"options\":[\"$$−3.$\",\"$$−5.$\",\"$$y = x^{2}+x-6=0$\",\"$$a = 1,b=5,c=1$\"],\"correctIndex\":3,\"hints\":[\"Try factoring first; if it doesn't factor, fall back to the quadratic formula or completing the square.\",\"Identify the coefficients: $a=1,b=5,c=1.$ Then use the quadratic formula.\",\"The answer is $a = 1,b=5,c=1$.\"],\"solution\":\"Identify the coefficients: $a=1,b=5,c=1.$ Then use the quadratic formula.\\n\\n$\\\\begin{array}{ccc}x \u0026 = \u0026 \\\\frac{-(5)\\\\pm\\\\sqrt{(5)^{2}-4(1)(1)}}{2(1)} \\\\\\\\ \u0026 = \u0026 \\\\frac{-5\\\\pm\\\\sqrt{25-4}}{2} \\\\\\\\ \u0026 = \u0026 \\\\frac{-5\\\\pm\\\\sqrt{21}}{2}\\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a1-fn-1\",\"curatedTopicId\":\"openstax:examples:3-1-functions-and-function-notation\",\"topicName\":\"Functions \u0026 Function Notation (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-3-1-functions-and-function-notation-example-3\",\"prompt\":\"Use function notation to represent a function whose input is the name of a month and output is the number of days in that month. Assume that the domain does not include leap years.\",\"options\":[\"$$m$\",\"$$\\\\sqrt{\\\\frac{A}{π}}.$\",\"$$y = f(x)$\",\"$$p$\"],\"correctIndex\":0,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"The number of days in a month is a function of the name of the month, so if we name the function $f,$ we write $\\\\text{days}=f(\\\\text{month})$ \\nor $d=f(m).$ The name of the month is the input to a “rule…\",\"The answer is $m$.\"],\"solution\":\"The number of days in a month is a function of the name of the month, so if we name the function $f,$ we write $\\\\text{days}=f(\\\\text{month})$ \\nor $d=f(m).$ The name of the month is the input to a “rule” that associates a specific number (the output) with each input.\\n\\nFigure \\n2 \\n\\nFor example, $f(\\\\text{March})=31,$ because March has 31 days. The notation $d=f(m)$ reminds us that the number of days, $d$ (the output), is dependent on the name of the month, $m$ (the input).\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-1-functions-and-function-notation-example-4\",\"prompt\":\"Interpreting Function Notation A function $N=f(y)$ gives the number of police officers, $N,$ in a town in year $y.$ What does $f(2005)=300$ represent?\",\"options\":[\"$$m$\",\"$$\\\\sqrt{\\\\frac{A}{π}}.$\",\"$$y = f(x)$\",\"$$N = f(y)$\"],\"correctIndex\":3,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"When we read $f(2005)=300,$ we see that the input year is 2005.\",\"The answer is $N = f(y)$.\"],\"solution\":\"When we read $f(2005)=300,$ we see that the input year is 2005. The value for the output, the number of police officers $(N),$ is 300. Remember, $N=f(y).$ The statement $f(2005)=300$ tells us that in the year 2005 there were 300 police officers in the town.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-1-functions-and-function-notation-example-7\",\"prompt\":\"Evaluating Functions Given the function $h(p)=p^{2}+2p,$ evaluate $h(4).$\",\"options\":[\"$$y = f(x)$\",\"$$\\\\sqrt{\\\\frac{A}{π}}.$\",\"$$p$\",\"$$m$\"],\"correctIndex\":2,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"To evaluate $h(4),$ we substitute the value 4 for the input variable $p$ in the given function.\",\"The answer is $p$.\"],\"solution\":\"To evaluate $h(4),$ we substitute the value 4 for the input variable $p$ in the given function.\\n\\n$\\\\begin{array}{c} \\\\text{}h(p)=p^{2}+2p \\\\\\\\ \\\\text{}h(4)=(4)^{2}+2(4) \\\\\\\\ \\\\text{       }=16+8 \\\\\\\\ \\\\text{       }=24\\\\end{array}$\\n\\nTherefore, for an input of 4, we have an output of 24.\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-1-functions-and-function-notation-example-9\",\"prompt\":\"Express the relationship $2n+6p=12$ as a function $p=f(n),$ if possible.\",\"options\":[\"$$\\\\sqrt{\\\\frac{A}{π}}.$\",\"$$p = f(n)=2-\\\\frac{1}{3}n$\",\"$$N = f(y)$\",\"$$m$\"],\"correctIndex\":1,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"To express the relationship in this form, we need to be able to write the relationship where $p$ is a function of $n,$ which means writing it as $p=[\\\\text{expression} \\\\text{involving} n].$ \\n\\n$\\\\begin{a…\",\"The answer is $p = f(n)=2-\\\\frac{1}{3}n$.\"],\"solution\":\"To express the relationship in this form, we need to be able to write the relationship where $p$ is a function of $n,$ which means writing it as $p=[\\\\text{expression} \\\\text{involving} n].$ \\n\\n$\\\\begin{array}{cccc}2n+6p=12 \u0026 \\\\\\\\ 6p=12-2n \u0026 \\\\begin{array}{ccc} \u0026 \u0026 \\\\end{array}\\\\text{Subtract }2n \\\\text{from both sides}. \\\\\\\\ p=\\\\frac{12-2n}{6} \u0026 \\\\begin{array}{ccc} \u0026 \u0026 \\\\end{array}\\\\text{Divide both sides by 6 and simplify}. \\\\\\\\ p=\\\\frac{12}{6}-\\\\frac{2n}{6} \u0026 \\\\\\\\ p=2-\\\\frac{1}{3}n \u0026 \\\\end{array}$\\n\\nTherefore, $p$ as a function of $n$ is written as\\n\\n$p=f(n)=2-\\\\frac{1}{3}n$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-1-functions-and-function-notation-example-10\",\"prompt\":\"Expressing the Equation of a Circle as a Function Does the equation $x^{2}+y^{2}=1$ represent a function with $x$ as input and $y$ as output? If so, express the relationship as a function $y=f(x).$\",\"options\":[\"$$p = f(n)=2-\\\\frac{1}{3}n$\",\"$$N = f(y)$\",\"$$y = f(x)$\",\"$$p$\"],\"correctIndex\":2,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"First we subtract $x^{2}$ from both sides.\",\"The answer is $y = f(x)$.\"],\"solution\":\"First we subtract $x^{2}$ from both sides.\\n\\n$y^{2}=1-x^{2}$\\n\\nWe now try to solve for $y$ in this equation.\\n\\n$\\\\begin{array}{c}y=\\\\pm\\\\sqrt{1-x^{2}} \\\\\\\\ \\\\text{ }=+\\\\sqrt{1-x^{2}} \\\\text{and }-\\\\sqrt{1-x^{2}}\\\\end{array}$\\n\\nWe get two outputs corresponding to the same input, so this relationship cannot be represented as a single function $y=f(x).$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-1-functions-and-function-notation-example-13\",\"prompt\":\"Determining Whether a Relationship Is a One-to-One Function Is the area of a circle a function of its radius? If yes, is the function one-to-one?\",\"options\":[\"$$p = f(n)=2-\\\\frac{1}{3}n$\",\"$$m$\",\"$$\\\\sqrt{\\\\frac{A}{π}}.$\",\"$$y = f(x)$\"],\"correctIndex\":2,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"A circle of radius $r$ has a unique area measure given by $A=πr^{2},$ so for any input, $r,$ there is only one output, $A.$ The area is a function of radius $r.$ \\n\\nIf the function is one-to-one, the o…\",\"The answer is $\\\\sqrt{\\\\frac{A}{π}}.$.\"],\"solution\":\"A circle of radius $r$ has a unique area measure given by $A=πr^{2},$ so for any input, $r,$ there is only one output, $A.$ The area is a function of radius $r.$ \\n\\nIf the function is one-to-one, the output value, the area, must correspond to a unique input value, the radius. Any area measure $A$ is given by the formula $A=πr^{2}.$ Because areas and radii are positive numbers, there is exactly one solution: $\\\\sqrt{\\\\frac{A}{π}}.$ So the area of a circle is a one-to-one function of the circle’s radius.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a1-fn-1\",\"curatedTopicId\":\"openstax:examples:3-2-domain-and-range\",\"topicName\":\"Domain \u0026 Range (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-3-2-domain-and-range-example-1\",\"prompt\":\"Find the domain of the following function: $\\\\{(2, \\\\text{}10),(3, \\\\text{}10),(4, \\\\text{}20),(5, \\\\text{}30),(6, \\\\text{}40)\\\\}$ .\",\"options\":[\"$$(-∞,0)\\\\cup(0,∞).$\",\"$$180\\\\leb\\\\le2010.$\",\"$$[1,3]\\\\cup(5,∞)$\",\"$$\\\\{2,3,4,5,6\\\\}$\"],\"correctIndex\":3,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"First identify the input values.\",\"The answer is $\\\\{2,3,4,5,6\\\\}$.\"],\"solution\":\"First identify the input values. The input value is the first coordinate in an ordered pair . There are no restrictions, as the ordered pairs are simply listed. The domain is the set of the first coordinates of the ordered pairs.\\n\\n$\\\\{2,3,4,5,6\\\\}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-2-domain-and-range-example-2\",\"prompt\":\"Find the domain of the function $f(x)=x^{2}-1.$\",\"options\":[\"$$180\\\\leb\\\\le2010.$\",\"$$C(4),$\",\"$$\\\\{2,3,4,5,6\\\\}$\",\"$$f$\"],\"correctIndex\":3,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"The input value, shown by the variable $x$ in the equation, is squared and then the result is lowered by one.\",\"The answer is $f$.\"],\"solution\":\"The input value, shown by the variable $x$ in the equation, is squared and then the result is lowered by one. Any real number may be squared and then be lowered by one, so there are no restrictions on the domain of this function. The domain is the set of real numbers.\\n\\nIn interval form, the domain of $f$ is $(-∞,∞).$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-2-domain-and-range-example-3\",\"prompt\":\"Find the domain of the function $f(x)=\\\\frac{x+1}{2-x}.$\",\"options\":[\"$$f$\",\"$$[1,3]\\\\cup(5,∞)$\",\"$$(−∞,2)\\\\cup(2,∞).$\",\"$$C(4),$\"],\"correctIndex\":2,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"When there is a denominator, we want to include only values of the input that do not force the denominator to be zero.\",\"The answer is $(−∞,2)\\\\cup(2,∞).$.\"],\"solution\":\"When there is a denominator, we want to include only values of the input that do not force the denominator to be zero. So, we will set the denominator equal to 0 and solve for $x.$ \\n\\n$\\\\begin{array}{ccc}2-x \u0026 = \u0026 0 \\\\\\\\ -x \u0026 = \u0026 −2 \\\\\\\\ x \u0026 = \u0026 2\\\\end{array}$\\n\\nNow, we will exclude 2 from the domain. The answers are all real numbers where $x\\\\lt 2$ or $x\\\\gt 2$ as shown in Figure 4 . We can use a symbol known as the union, $\\\\cup,$ to combine the two sets. In interval notation, we write the solution: $(−∞,2)\\\\cup(2,∞).$ \\n\\nFigure \\n4\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-2-domain-and-range-example-4\",\"prompt\":\"Find the domain of the function $f(x)=\\\\sqrt{7-x}.$\",\"options\":[\"$$(−∞,2)\\\\cup(2,∞).$\",\"$$(-∞,7].$\",\"$$(-∞,0)\\\\cup(0,∞).$\",\"$$\\\\{2,3,4,5,6\\\\}$\"],\"correctIndex\":1,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"When there is an even root in the formula, we exclude any real numbers that result in a negative number in the radicand.\",\"The answer is $(-∞,7].$.\"],\"solution\":\"When there is an even root in the formula, we exclude any real numbers that result in a negative number in the radicand.\\n\\nSet the radicand greater than or equal to zero and solve for $x.$ \\n\\n$\\\\begin{array}{ccc}7-x \u0026 \\\\ge \u0026 0 \\\\\\\\ -x \u0026 \\\\ge \u0026 −7 \\\\\\\\ x \u0026 \\\\le \u0026 7\\\\end{array}$\\n\\nNow, we will exclude any number greater than 7 from the domain. The answers are all real numbers less than or equal to $7,$ or $(-∞,7].$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-2-domain-and-range-example-9\",\"prompt\":\"Find the domain and range of $f(x)=\\\\frac{2}{x+1}.$\",\"options\":[\"$$180\\\\leb\\\\le2010.$\",\"$$(−∞,2)\\\\cup(2,∞).$\",\"$$(-∞,0)\\\\cup(0,∞).$\",\"$$(-∞,7].$\"],\"correctIndex\":2,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"We cannot evaluate the function at $−1$ because division by zero is Undefined.\",\"The answer is $(-∞,0)\\\\cup(0,∞).$.\"],\"solution\":\"We cannot evaluate the function at $−1$ because division by zero is Undefined. The domain is $(-∞,−1)\\\\cup(−1,∞).$ Because the function is never zero, we exclude 0 from the range. The range is $(-∞,0)\\\\cup(0,∞).$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-2-domain-and-range-example-10\",\"prompt\":\"Find the domain and range of $f(x)=2\\\\sqrt{x+4}.$\",\"options\":[\"$$[0,∞).$\",\"$$\\\\{2,3,4,5,6\\\\}$\",\"$$(-∞,0)\\\\cup(0,∞).$\",\"$$180\\\\leb\\\\le2010.$\"],\"correctIndex\":0,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"We cannot take the square root of a negative number, so the value inside the radical must be nonnegative.\",\"The answer is $[0,∞).$.\"],\"solution\":\"We cannot take the square root of a negative number, so the value inside the radical must be nonnegative.\\n\\n$x+4\\\\ge0 \\\\text{when }x\\\\ge-4$ \\n\\nThe domain of $f(x)$ is $[-4,∞).$ \\n\\nWe then find the range. We know that $f(-4)=0,$ and the function value increases as $x$ increases without any upper limit. We conclude that the range of $f$ is $[0,∞).$\",\"difficulty\":\"easy\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-2-domain-and-range-example-12\",\"prompt\":\"Working with a Piecewise Function A cell phone company uses the function below to determine the cost, $C,$ in dollars for $g$ gigabytes of data transfer. $C(g)=\\\\{\\\\begin{array}{ccc}25 \u0026 \\\\text{if} \u0026 0\\\\lt g\\\\lt 2 \\\\\\\\ 25+10(g-2) \u0026 \\\\text{if} \u0026 g\\\\ge2\\\\end{array}$ Find the cost of using 1.5 gigabytes of data and the cost of using 4 gigabytes of data.\",\"options\":[\"$$f$\",\"$$C(4),$\",\"$$(−∞,2)\\\\cup(2,∞).$\",\"$$[1,3]\\\\cup(5,∞)$\"],\"correctIndex\":1,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"To find the cost of using 1.5 gigabytes of data, $C(1.5),$ we first look to see which part of the domain our input falls in.\",\"The answer is $C(4),$.\"],\"solution\":\"To find the cost of using 1.5 gigabytes of data, $C(1.5),$ we first look to see which part of the domain our input falls in. Because 1.5 is less than 2, we use the first formula.\\n\\n$C(1.5)=\\\\text{\\\\$}25$ \\n\\nTo find the cost of using 4 gigabytes of data, $C(4),$ we see that our input of 4 is greater than 2, so we use the second formula.\\n\\n$C(4)=25+10(4-2)=\\\\text{\\\\$}45$\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a1-fn-1\",\"curatedTopicId\":\"openstax:examples:3-3-rates-of-change-and-behavior-of-graphs\",\"topicName\":\"Rates of Change \u0026 Behavior of Graphs (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-3-3-rates-of-change-and-behavior-of-graphs-example-1\",\"prompt\":\"Computing an Average Rate of Change Using the data in Table 1 , find the average rate of change of the price of gasoline between 2007 and 2009.\",\"options\":[\"$$t = 2,$\",\"$$-\\\\frac{1}{9}$\",\"$$2.84. In 2009, the cost was \\\\$\",\"$$−10.$\"],\"correctIndex\":2,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"In 2007, the price of gasoline was \\\\$2.84.\",\"The answer is $2.84. In 2009, the cost was \\\\$.\"],\"solution\":\"In 2007, the price of gasoline was \\\\$2.84. In 2009, the cost was \\\\$2.41. The average rate of change is\\n\\n$\\\\begin{array}{ccc}\\\\frac{Δy}{Δx} \u0026 = \u0026 \\\\frac{y_{2}-y_{1}}{x_{2}-x_{1}} \\\\\\\\ \u0026 = \u0026 \\\\frac{\\\\$2.41-\\\\$2.84}{2009-2007} \\\\\\\\ \u0026 = \u0026 \\\\frac{-\\\\$0.43}{2 \\\\text{years}} \\\\\\\\ \u0026 = \u0026 -\\\\$0.22 \\\\text{per year}\\\\end{array}$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-3-rates-of-change-and-behavior-of-graphs-example-5\",\"prompt\":\"Finding the Average Rate of Change of a Force The electrostatic force $F,$ measured in newtons, between two charged particles can be related to the distance between the particles $d,$ in centimeters, by the formula $F(d)=\\\\frac{2}{d^{2}}.$ Find the average rate of change of force if the distance between the particles is increased from 2 cm to 6 cm.\",\"options\":[\"$$x = −2$\",\"$$2.84. In 2009, the cost was \\\\$\",\"$$-\\\\frac{1}{9}$\",\"$$t = 2,$\"],\"correctIndex\":2,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"We are computing the average rate of change of $F(d)=\\\\frac{2}{d^{2}}$ on the interval $[2,6].$ \\n\\n$\\\\begin{array}{cccc}\\\\text{Average rate of change} \u0026 = \u0026 \\\\text{}\\\\frac{F(6)-F(2)}{6-2} \u0026 \\\\\\\\ \u0026 = \u0026 \\\\frac{\\\\…\",\"The answer is $-\\\\frac{1}{9}$.\"],\"solution\":\"We are computing the average rate of change of $F(d)=\\\\frac{2}{d^{2}}$ on the interval $[2,6].$ \\n\\n$\\\\begin{array}{cccc}\\\\text{Average rate of change} \u0026 = \u0026 \\\\text{}\\\\frac{F(6)-F(2)}{6-2} \u0026 \\\\\\\\ \u0026 = \u0026 \\\\frac{\\\\frac{2}{6^{2}}-\\\\frac{2}{2^{2}}}{6-2} \u0026 \\\\text{Simplify}. \\\\\\\\ \u0026 = \u0026 \\\\frac{\\\\frac{2}{36}-\\\\frac{2}{4}}{4} \u0026 \\\\\\\\ \u0026 = \u0026 \\\\frac{-\\\\frac{16}{36}}{4} \u0026 \\\\text{Combine numerator terms}. \\\\\\\\ \u0026 = \u0026 -\\\\frac{1}{9} \u0026 \\\\text{Simplify}\\\\end{array}$\\n\\nThe average rate of change is $-\\\\frac{1}{9}$ newton per centimeter.\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-3-rates-of-change-and-behavior-of-graphs-example-6\",\"prompt\":\"Find the average rate of change of $g(t)=t^{2}+3t+1$ on the interval $[0, a].$ The answer will be an expression involving $a$ in simplest form.\",\"options\":[\"$$-\\\\frac{1}{9}$\",\"$$[0,5],$\",\"$$−2.$\",\"$$2.84. In 2009, the cost was \\\\$\"],\"correctIndex\":1,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"We use the average rate of change formula.\",\"The answer is $[0,5],$.\"],\"solution\":\"We use the average rate of change formula. \\n\\n$\\\\begin{array}{cccc}\\\\text{Average rate of change} \u0026 = \u0026 \\\\frac{g(a)-g(0)}{a-0} \u0026 \\\\text{Evaluate}. \\\\\\\\ \u0026 = \u0026 \\\\frac{(a^{2}+3a+1)-(0^{2}+3(0)+1)}{a-0} \u0026 \\\\text{Simplify}. \\\\\\\\ \u0026 = \u0026 \\\\frac{a^{2}+3a+1-1}{a} \u0026 \\\\text{Simplify and factor}. \\\\\\\\ \u0026 = \u0026 \\\\frac{a(a+3)}{a} \u0026 \\\\text{Divide by the common factor }a. \\\\\\\\ \u0026 = \u0026 a+3 \u0026 \\\\end{array}$\\n\\nThis result tells us the average rate of change in terms of $a$ between $t=0$ and any other point $t=a.$ For example, on the interval $[0,5],$ the average rate of change would be $5+3=8.$\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-3-rates-of-change-and-behavior-of-graphs-example-8\",\"prompt\":\"Graph Graph the function $f(x)=\\\\frac{2}{x}+\\\\frac{x}{3}.$ Then use the graph to estimate the local extrema of the function and to determine the intervals on which the function is increasing.\",\"options\":[\"$$x = −2$\",\"$$−10.$\",\"$$[0,5],$\",\"$$-\\\\frac{1}{9}$\"],\"correctIndex\":0,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"Using technology, we find that the graph of the function looks like that in Figure 7 .\",\"The answer is $x = −2$.\"],\"solution\":\"Using technology, we find that the graph of the function looks like that in Figure 7 . It appears there is a low point, or local minimum, between $x=2$ and $x=3,$ and a mirror-image high point, or local maximum, somewhere between $x=−3$ and $x=−2.$ \\n\\nFigure \\n7\",\"difficulty\":\"hard\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]}]},{\"engineTopicId\":\"a1-fn-1\",\"curatedTopicId\":\"openstax:examples:3-4-composition-of-functions\",\"topicName\":\"Composition of Functions (worked examples)\",\"questions\":[{\"id\":\"openstax-ca-3-4-composition-of-functions-example-1\",\"prompt\":\"Find and simplify the functions $(g-f)(x)$ and $(\\\\frac{g}{f})(x),$ given $f(x)=x-1$ and $g(x)=x^{2}-1.$ Are they the same function?\",\"options\":[\"$$f(t)$\",\"$$g(f(x))\\\\nef(g(x)),$\",\"$$x$\",\"$$x = 1,$\"],\"correctIndex\":3,\"hints\":[\"Substitute the input value for every $x$ in the function; or check the domain/range from the rule.\",\"Begin by writing the general form, and then substitute the given functions.\",\"The answer is $x = 1,$.\"],\"solution\":\"Begin by writing the general form, and then substitute the given functions.\\n\\n$\\\\begin{array}{cccc}(g-f)(x) \u0026 = \u0026 g(x)-f(x) \u0026 \\\\\\\\ (g-f)(x) \u0026 = \u0026 x^{2}-1-(x-1) \u0026 \\\\\\\\ (g-f)(x) \u0026 = \u0026 x^{2}-x \u0026 \\\\\\\\ (g-f)(x) \u0026 = \u0026 x(x-1) \u0026 \\\\\\\\ \u0026 \u0026 \u0026 \\\\\\\\ \u0026 \u0026 \u0026 \\\\\\\\ (\\\\frac{g}{f})(x) \u0026 = \u0026 \\\\frac{g(x)}{f(x)} \u0026 \\\\\\\\ (\\\\frac{g}{f})(x) \u0026 = \u0026 \\\\frac{x^{2}-1}{x-1} \u0026 \\\\\\\\ (\\\\frac{g}{f})(x) \u0026 = \u0026 \\\\frac{(x+1)(x-1)}{x-1} \u0026 \\\\text{where }x\\\\ne1 \\\\\\\\ (\\\\frac{g}{f})(x) \u0026 = \u0026 x+1 \u0026 \\\\end{array}$\\n\\nNo, the functions are not the same.\\n\\nNote: For $(\\\\frac{g}{f})(x),$ the condition $x\\\\ne1$ is necessary because when $x=1,$ the denominator is equal to 0, which makes the function Undefined.\",\"difficulty\":\"medium\",\"tags\":[\"expert-authored\",\"worked-example\",\"source:openstax-college-algebra-2e\"]},{\"id\":\"openstax-ca-3-4-composition-of-functions-example-2\",\"prompt\":\"Determining whether Composition of Functions is Commutative Using the functions provided, find $f(g(x))$ and $g(f(x)).$ Determine whether the composition of the functions is commutative . $f(
