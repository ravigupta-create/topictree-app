:I[42190,[\"/topictree-app/_next/static/chunks/9419abfa7a0dce41.js\",\"/topictree-app/_next/static/chunks/cda6d638d04f7e78.js\",\"/topictree-app/_next/static/chunks/2d0197e65fee9a81.js\",\"/topictree-app/_next/static/chunks/1fff631859233f01.js\",\"/topictree-app/_next/static/chunks/6fa47385211f3ebb.js\"],\"SourceQuestions\"]\n4e:[\"$\",\"span\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"inline-block w-2 h-2 rounded-full bg-rose-400 mr-1\"}],86,\" hard (\",9,\"%)\"]}]\n55:T415,The function $y=f(x)$ is a function whose output is the number of miles driven corresponding to the number of hours driven. \n\n$\\text{number of miles }=f (\\text{number of hours})$\n\nThe function $g(y)$ is a function whose output is the number of gallons used corresponding to the number of miles driven. This means:\n\n$\\text{number of gallons }=g (\\text{number of miles})$\n\nThe expression $g(y)$ takes miles as the input and a number of gallons as the output. The function $f(x)$ requires a number of hours as the input. Trying to input a number of gallons does not make sense. The expression $f(g(y))$ is meaningless.\n\nThe expression $f(x)$ takes hours as input and a number of miles driven as the output. The function $g(y)$ requires a number of miles as the input. Using $f(x)$ (miles driven) as an input value for $g(y),$ where gallons of gas depends on miles driven, does make sense. The expression $g(f(x))$ makes sense, and will yield the number of gallons of gas used, $g,$ driving a certain number of miles, $f(x),$ in $x$ hours.56:T4e3,ⓐ \nReflecting the graph vertically means that each output value will be reflected over the horizontal t- axis as shown in Figure 13 .\n\nFigure \n13 \n\nVertical reflection of the square root function \n\nBecause each output value is the opposite of the original output value, we can write\n\n$V(t)=-s(t) \\text{or }V(t)=-\\sqrt{t}$\n\nNotice that this is an outside change, or vertical shift, that affects the output $s(t)$ values, so the negative sign belongs outside of the function.\n\nⓑ \n\nReflecting horizontally means that each input value will be reflected over the vertical axis as shown in Figure 14 .\n\nFigure \n14 \n\nHorizontal reflection of the square root function \n\nBecause each input value is the opposite of the original input value, we can write\n\n$H(t)=s(-t) \\text{or }H(t)=\\sqrt{-t}$\n\nNotice that this is an inside change or horizontal change that affects the input values, so the negative sign is on the inside of the function.\n\nNote that these transformations can affect the domain and range of the functions. While the original square root function has domain $[0,∞)$ and range $[0,∞),$ the vertical reflection gives the $V(t)$ function the range $(-∞, 0]$ and the horizontal reflection gives the $H(t)$ function the domain $(-∞, 0].$57:T428,This polynomial is not in factored form, has no common factors, and does not appear to be factorable using techniques previously discussed. Fortunately, we can use technology to find the intercepts. Keep in mind that some values make graphing difficult by hand. In these cases, we can take advantage of graphing utilities.\n\nLooking at the graph of this function, as shown in Figure 6 , it appears that there are x -intercepts at $x=−3,−2,$ and $1.$ \n\nFigure \n6 \n\nWe can check whether these are correct by substituting these values for $x$ and verifying that\n\n$h(-3)=h(-2)=h(1)=0$ \nSince $h(x)=x^{3}+4x^{2}+x-6,$ we have:\n\n$\\begin{array}{ccc}h(−3) \u0026 = \u0026 (−3)^{3}+4(−3)^{2}+("])</script><script>self.__next_f.push([1,"−3)-6=−27+36-3-6=0 \\\\ h(−2) \u0026 = \u0026 (−2)^{3}+4(−2)^{2}+(−2)-6=−8+16-2-6=0 \\\\ h(1) \u0026 = \u0026 (1)^{3}+4(1)^{2}+(1)-6=1+4+1-6=0\\end{array}$\n\nEach x -intercept corresponds to a zero of the polynomial function and each zero yields a factor, so we can now write the polynomial in factored form.\n\n$\\begin{array}{ccc}h(x) \u0026 = \u0026 x^{3}+4x^{2}+x-6 \\\\ \u0026 = \u0026 (x+3)(x+2)(x-1)\\end{array}$58:T67a,"])</script><script>self.__next_f.push([1,"We will start this problem by drawing a picture like that in Figure 22 , labeling the width of the cut-out squares with a variable, $w.$ \n\nFigure \n22 \n\nNotice that after a square is cut out from each end, it leaves a $(14-2w)$ cm by $(20-2w)$ cm rectangle for the base of the box, and the box will be $w$ cm tall. This gives the volume\n\n$\\begin{array}{ccc}V(w) \u0026 = \u0026 (20-2w)(14-2w)w \\\\ \u0026 = \u0026 280w-68w^{2}+4w^{3}\\end{array}$\n\nNotice, since the factors are $w,$ $20–2w$ and $14–2w,$ the three zeros are 10, 7, and 0, respectively. Because a height of 0 cm is not reasonable, we consider the only the zeros 10 and 7. The shortest side is 14 and we are cutting off two squares, so values $w$ may take on are greater than zero or less than 7. This means we will restrict the domain of this function to $0\\lt w\\lt 7.$ Using technology to sketch the graph of $V(w)$ on this reasonable domain, we get a graph like that in Figure 23 . We can use this graph to estimate the maximum value for the volume, restricted to values for $w$ that are reasonable for this problem—values from 0 to 7.\n\nFigure \n23 \n\nFrom this graph, we turn our focus to only the portion on the reasonable domain, $[0, \\text{}7].$ We can estimate the maximum value to be around 340 cubic cm, which occurs when the squares are about 2.75 cm on each side. To improve this estimate, we could use advanced features of our technology, if available, or simply change our window to zoom in on our graph to produce Figure 24 .\n\nFigure \n24 \n\nFrom this zoomed-in view, we can refine our estimate for the maximum volume to about 339 cubic cm, when the squares measure approximately 2.7 cm on each side."])</script><script>self.__next_f.push([1,"59:T4bd,The Rational Zero Theorem tells us that if $\\frac{p}{q}$ is a zero of $f(x),$ then $p$ \nis a factor of –1 and $q$ is a factor of 4. \n\n$\\begin{array}{ccc}\\frac{p}{q} \u0026 = \u0026 \\frac{\\text{factor of constant term}}{\\text{factor of leading coefficient}} \\\\ \u0026 = \u0026 \\frac{\\text{factor of –1}}{\\text{factor of 4}}\\end{array}$ \nThe factors of $–1$ \nare $±1$ \nand the factors of $4$ \nare $±1,±2,$ and $±4.$ The possible values for $\\frac{p}{q}$ are $±1, \\pm\\frac{1}{2},$ and $\\pm\\frac{1}{4}.$ \nThese are the possible rational zeros for the function. We will use synthetic division to evaluate each possible zero until we find one that gives a remainder of 0. Let’s begin with 1.\n\nDividing by $(x-1)$ \ngives a remainder of 0, so 1 is a zero of the function. The polynomial can be written as\n\n$(x-1)(4x^{2}+4x+1)$\n\nThe quadratic is a perfect square. $f(x)$ \ncan be written as\n\n$(x-1)(2x+1)^{2}$\n\nWe already know that 1 is a zero. The other zero will have a multiplicity of 2 because the factor is squared. To find the other zero, we can set the factor equal to 0.\n\n$\\begin{array}{ccc}2x+1 \u0026 = \u0026 0 \\\\ x \u0026 = \u0026 -\\frac{1}{2}\\end{array}$\n\nThe zeros of the function are 1 and $-\\frac{1}{2}$ with multiplicity 2.5a:T420,The Rational Zero Theorem tells us that if $\\frac{p}{q}$ is a zero of $f(x),$ then $p$ is a factor of 3 and $q$ is a factor of 3. \n\n$\\begin{array}{ccc}\\frac{p}{q} \u0026 = \u0026 \\frac{\\text{factor of constant term}}{\\text{factor of leading coefficient}} \\\\ \u0026 = \u0026 \\frac{\\text{factor of 3}}{\\text{factor of 3}}\\end{array}$\n\nThe factors of 3 are $±1$ and $±3.$ The possible values for $\\frac{p}{q},$ and therefore the possible rational zeros for the function, are $±3,\\text{±1, and }\\pm\\frac{1}{3}.$ We will use synthetic division to evaluate each possible zero until we find one that gives a remainder of 0. Let’s begin with –3.\n\nDividing by $(x+3)$ gives a remainder of 0, so –3 is a zero of the function. The polynomial can be written as\n$(x+3)(3x^{2}+1)$\n\nWe can then set the quadratic equal to 0 and solve to find the other zeros of the function.\n\n$\\begin{array}{ccc}3x^{2}+1 \u0026 = \u0026 0 \\\\ x^{2} \u0026 = \u0026 -\\frac{1}{3} \\\\ x \u0026 = \u0026 \\pm\\sqrt{-\\frac{1}{3}}=\\pm\\frac{i\\sqrt{3}}{3}\\end{array}$\n\nThe zeros of $f(x)$ \nare –3 and $\\pm\\frac{i\\sqrt{3}}{3}.$5b:T715,"])</script><script>self.__next_f.push([1,"Begin by writing an equation for the volume of the cake. The volume of a rectangular solid is given by $V=lwh.$ We were given that the length must be four inches longer than the width, so we can express the length of the cake as $l=w+4.$ We were given that the height of the cake is one-third of the width, so we can express the height of the cake as $h=\\frac{1}{3}w.$ Let’s write the volume of the cake in terms of width of the cake.\n\n$\\begin{array}{ccc}V \u0026 = \u0026 (w+4)(w)(\\frac{1}{3}w) \\\\ V \u0026 = \u0026 \\frac{1}{3}w^{3}+\\frac{4}{3}w^{2}\\end{array}$\n\nSubstitute the given volume into this equation.\n\n$\\begin{array}{cccc}351 \u0026 = \u0026 \\frac{1}{3}w^{3}+\\frac{4}{3}w^{2} \u0026 \\text{Substitute 351 for }V. \\\\ 1053 \u0026 = \u0026 w^{3}+4w^{2} \u0026 \\text{Multiply both sides by 3}. \\\\ 0 \u0026 = \u0026 w^{3}+4w^{2}-1053 \u0026 \\text{Subtract 1053 from both sides}.\\end{array}$\n\nDescartes' rule of signs tells us there is one positive solution. The Rational Zero Theorem tells us that the possible rational zeros are $\\pm1, \\pm3, \\pm9, \\pm13, \\pm27, \\pm39, \\pm81, \\pm117, \\pm351,$ \nand $\\pm1053.$ \nWe can use synthetic division to test these possible zeros. Only positive numbers make sense as dimensions for a cake, so we need not test any negative values. Let’s begin by testing values that make the most sense as dimensions for a small sheet cake. Use synthetic division to check $x=1.$ \n\nSince 1 is not a solution, we will check $x=3.$ \n\nSince 3 is not a solution either, we will test $x=9.$ \n\nSynthetic division gives a remainder of 0, so 9 is a solution to the equation. We can use the relationships between the width and the other dimensions to determine the length and height of the sheet cake pan.\n\n$l=w+4=9+4=13 \\text{and }h=\\frac{1}{3}w=\\frac{1}{3}(9)=3$ \n\nThe sheet cake pan should have dimensions 13 inches by 9 inches by 3 inches."])</script><script>self.__next_f.push([1,"5c:T4fa,We can see this is a parabola with vertex at $(2,–3)$ that opens upward. Because the graph will be decreasing on one side of the vertex and increasing on the other side, we can restrict this function to a domain on which it will be one-to-one by limiting the domain to $x\\ge2.$ \n\nTo find the inverse, we will use the vertex form of the quadratic. We start by replacing $f(x)$ with a simple variable, $y,$ then solve for $x.$ \n\n$\\begin{array}{cccc}y \u0026 = \u0026 (x-2)^{2}-3 \u0026 \\text{  }\\text{Interchange }x \\text{and }y. \\\\ x \u0026 = \u0026 (y-2)^{2}-3 \u0026 \\text{  }\\text{Add 3 to both sides}. \\\\ x+3 \u0026 = \u0026 (y-2)^{2} \u0026 \\text{  }\\text{Take the square root}. \\\\ \\pm\\sqrt{x+3} \u0026 = \u0026 y-2 \u0026 \\text{  }\\text{Add 2 to both sides}. \\\\ 2\\pm\\sqrt{x+3} \u0026 = \u0026 y \u0026 \\text{  }\\text{Rename the function}. \\\\ f^{-1}(x) \u0026 = \u0026 2\\pm\\sqrt{x+3} \u0026 \\end{array}$\n\nNow we need to determine which case to use. Because we restricted our original function to a domain of $x\\ge2,$ the outputs of the inverse should be the same, telling us to utilize the + case\n\n$f^{-1}(x)=2+\\sqrt{x+3}$\n\nIf the quadratic had not been given in vertex form, rewriting it into vertex form would be the first step. This way we may easily observe the coordinates of the vertex to help us restrict the domain.5d:T5aa,"])</script><script>self.__next_f.push([1,"Because a square root is only defined when the quantity under the radical is non-negative, we need to determine where $\\frac{(x+2)(x-3)}{(x-1)}\\ge0.$ The output of a rational function can change signs (change from positive to negative or vice versa) at x -intercepts and at vertical asymptotes. For this equation, the graph could change signs at $x=–2,1,\\text{and}3.$ \n\nTo determine the intervals on which the rational expression is positive, we could test some values in the expression or sketch a graph. While both approaches work equally well, for this example we will use a graph as shown in Figure 9 .\n\nFigure \n9 \n\nThis function has two x -intercepts, both of which exhibit linear behavior near the x -intercepts. There is one vertical asymptote, corresponding to a linear factor; this behavior is similar to the basic reciprocal toolkit function, and there is no horizontal asymptote because the degree of the numerator is larger than the degree of the denominator. There is a y -intercept at $(0,\\sqrt{6}).$ \n\nFrom the y -intercept and x -intercept at $x=−2,$ we can sketch the left side of the graph. From the behavior at the asymptote, we can sketch the right side of the graph.\n\nFrom the graph, we can now tell on which intervals the outputs will be non-negative, so that we can be sure that the original function $f(x)$ will be defined. $f(x)$ has domain $−2\\lex\\lt 1 \\text{or} x\\ge3,$ or in interval notation, $[−2,1)\\cup[3,∞).$"])</script><script>self.__next_f.push([1,"5e:T666,"])</script><script>self.__next_f.push([1,"We let our independent variable $t$ be the number of years after 2006. Thus, the information given in the problem can be written as input-output pairs: (0, 80) and (6, 180). Notice that by choosing our input variable to be measured as years after 2006, we have given ourselves the initial value for the function, $a=80.$ We can now substitute the second point into the equation $N(t)=80b^{t}$ to find $b:$ \n\n$\\begin{array}{cccccc}N(t) \u0026 =80b^{t} \u0026 \\\\ 180 \u0026 =80b^{6} \u0026 \\text{Substitute using point }(6,180). \\\\ \\frac{9}{4} \u0026 =b^{6} \u0026 \\text{Divide and write in lowest terms}. \\\\ b \u0026 =(\\frac{9}{4})^{\\frac{1}{6}} \u0026 \\text{Isolate }b \\text{using properties of exponents}. \\\\ b \u0026 \\approx1.1447\\begin{array}{cccc} \u0026 \u0026 \u0026 \\end{array} \u0026 \\text{Round to 4 decimal places}.\\end{array}$\n\nNOTE: Unless otherwise stated, do not round any intermediate calculations. Then round the final answer to four places for the remainder of this section. \n\nThe exponential model for the population of deer is $N(t)=80(1.1447)^{t}.$ (Note that this exponential function models short-term growth. As the inputs gets large, the output will get increasingly larger, so much so that the model may not be useful in the long term.)\n\nWe can graph our model to observe the population growth of deer in the refuge over time. Notice that the graph in Figure 3 passes through the initial points given in the problem, $(0,80)$ and $(\\text{6},180).$ We can also see that the domain for the function is $[0,∞),$ and the range for the function is $[80,∞).$ \n\nFigure \n3 \n\nGraph showing the population of deer over time, $N(t)=80(1.1447)^{t},$ $t$ years after 2006"])</script><script>self.__next_f.push([1,"5f:T58d,"])</script><script>self.__next_f.push([1,"Because the surrounding air temperature in the refrigerator is 35 degrees, the cheesecake’s temperature will decay exponentially toward 35, following the equation\n\n$T(t)=Ae^{kt}+35$ \nWe know the initial temperature was 165, so $T(0)=165.$ \n\n$\\begin{array}{cc}165=Ae^{k0}+35 \u0026 \\text{Substitute }(0,165). \\\\ A=130 \u0026 \\text{Solve for }A.\\end{array}$\n\nWe were given another data point, $T(10)=150,$ which we can use to solve for $k.$ \n$\\begin{array}{cc}150=130e^{k10}+35 \u0026 \\text{Substitute (10, 150)}. \\\\ 115=130e^{k10} \u0026 \\text{Subtract 35}. \\\\ \\frac{115}{130}=e^{10k} \u0026 \\text{Divide by 130}. \\\\ \\ln(\\frac{115}{130})=10k \u0026 \\text{Take the natural log of both sides}. \\\\ k=\\frac{\\ln(\\frac{115}{130})}{10}\\approx-0.0123 \u0026 \\text{Divide by the coefficient of }k.\\end{array}$\n\nThis gives us the equation for the cooling of the cheesecake: $T(t)=130e^{–0.0123t}+35.$ \n\nNow we can solve for the time it will take for the temperature to cool to 70 degrees.\n$\\begin{array}{cc}70=130e^{-0.0123t}+35 \u0026 \\text{Substitute in 70 for }T(t). \\\\ 35=130e^{-0.0123t} \u0026 \\text{Subtract 35}. \\\\ \\frac{35}{130}=e^{-0.0123t} \u0026 \\text{Divide by 130}. \\\\ \\ln(\\frac{35}{130})=-0.0123t \u0026 \\text{Take the natural log of both sides} \\\\ t=\\frac{\\ln(\\frac{35}{130})}{-0.0123}\\approx106.68 \u0026 \\text{Divide by the coefficient of }t.\\end{array}$\n\nIt will take about 107 minutes, or one hour and 47 minutes, for the cheesecake to cool to $\\text{70°F}\\text{.}$"])</script><script>self.__next_f.push([1,"60:T655,"])</script><script>self.__next_f.push([1,"First, plot the data on a graph as in Figure 8 . For the purpose of graphing, round the data to two decimal places.\n\nFigure \n8 \n\nClearly, the points do not lie on a straight line, so we reject a linear model. If we draw a line between any two of the points, most or all of the points between those two points lie above the line, so the graph is concave down, suggesting a logarithmic model. We can try $y=a\\ln(bx).$ Plugging in the first point, $(\\text{1,0})\\text{,}$ gives $0=a\\lnb.$ We reject the case that $a=0$ (if it were, all outputs would be 0), so we know $\\ln(b)=0.$ Thus $b=1$ and $y=a\\ln(\\text{x}).$ Next we can use the point $(\\text{9,4}\\text{.394})$ to solve for $a:$ \n\n$\\begin{array}{c}y=a\\ln(x) \\\\ 4.394=a\\ln(9) \\\\ a=\\frac{4.394}{\\ln(9)}\\end{array}$\n\nBecause $a=\\frac{4.394}{\\ln(9)}\\approx2,$ an appropriate model for the data is $y=2\\ln(x).$ \n\nTo check the accuracy of the model, we graph the function together with the given points as in Figure 9 .\n\nFigure \n9 \n\nThe graph of $y=2\\lnx.$ \n\nWe can conclude that the model is a good fit to the data.\n\nCompare Figure 9 to the graph of $y=\\ln(x^{2})$ shown in Figure 10 .\n\nFigure \n10 \n\nThe graph of $y=\\ln(x^{2})$ \n\nThe graphs appear to be identical when $x\\gt 0.$ A quick check confirms this conclusion: $y=\\ln(x^{2})=2\\ln(x)$ for $x\\gt 0.$ \n\nHowever, if $x\\lt 0,$ the graph of $y=\\ln(x^{2})$ includes a “extra” branch, as shown in Figure 11 . This occurs because, while $y=2\\ln(x)$ cannot have negative values in the domain (as such values would force the argument to be negative), the function $y=\\ln(x^{2})$ can have negative domain values.\n\nFigure \n11"])</script><script>self.__next_f.push([1,"61:T4ee,Let c = the number of children and a = the number of adults in attendance.\n\nThe total number of people is $2,000.$ We can use this to write an equation for the number of people at the circus that day.\n$c+a=2,000$\n\nThe revenue from all children can be found by multiplying $\\text{\\$}25.00$ by the number of children, $25c.$ The revenue from all adults can be found by multiplying $\\text{\\$}50.00$ by the number of adults, $50a.$ The total revenue is $\\text{\\$}70,000.$ We can use this to write an equation for the revenue.\n$25c+50a=70,000$\n\nWe now have a system of linear equations in two variables.\n\n$\\begin{array}{c} c+a=2,000 \\\\ 25c+50a=70,000\\end{array}$\n\nIn the first equation, the coefficient of both variables is 1. We can quickly solve the first equation for either $c$ or $a.$ We will solve for $a.$ \n\n$\\begin{array}{c}c+a=2,000 \\\\ a=2,000-c\\end{array}$\n\nSubstitute the expression $2,000-c$ in the second equation for $a$ and solve for $c.$ \n\n$\\begin{array}{c}25c+50(2,000-c)=70,000 \\\\ 25c+100,000-50c=70,000 \\\\ -25c=−30,000 \\\\ c=1,200\\end{array}$\n\nSubstitute $c=1,200$ into the first equation to solve for $a.$ \n\n$\\begin{array}{c}1,200+a=2,000 \\\\ a=800\\end{array}$\n\nWe find that $1,200$ children and $800$ adults bought tickets to the circus that day.62:T857,"])</script><script>self.__next_f.push([1,"To solve this problem, we use all of the information given and set up three equations. First, we assign a variable to each of the three investment amounts:\n\n$\\begin{array}{c}x=\\text{amount invested in money-market fund} \\\\ y=\\text{amount invested in municipal bonds} \\\\ z=\\text{amount invested in mutual funds}\\end{array}$\n\nThe first equation indicates that the sum of the three principal amounts is \\$12,000.\n\n$x+y+z=12,000$ \nWe form the second equation according to the information that Jordi invested \\$4,000 more in mutual funds than he invested in municipal bonds.\n\n$z=y+4,000$\n\nThe third equation shows that the total amount of interest earned from each fund equals \\$670.\n\n$0.03x+0.04y+0.07z=670$\n\nThen, we write the three equations as a system.\n\n$\\begin{array}{c} \\text{}x+y+z=12,000 \\\\ \\text{}-y+z=4,000 \\\\ 0.03x+0.04y+0.07z=670\\end{array}$\n\nTo make the calculations simpler, we can multiply the third equation by 100. Thus,\n\n$\\begin{array}{cc} \\text{}x+ \\text{}y+z \\text{}=12,000 \u0026 (1) \\\\ \\text{}-y+z \\text{}=4,000 \u0026 (2) \\\\ 3x+4y+7z=67,000 \u0026 (3)\\end{array}$\n\nStep 1. Interchange equation (2) and equation (3) so that the two equations with three variables will line up.\n\n$\\begin{array}{c} \\text{}x+ \\text{}y+ \\text{}z=12,000 \\\\ 3x+4y+7z=67,000 \\\\ \\text{}-y \\text{}+ \\text{}z=4,000\\end{array}$\n\nStep 2. Multiply equation (1) by $−3$ \nand add to equation (2). Write the result as row 2.\n$\\begin{array}{c}x+y+z \\text{}=12,000 \\\\ y+4z=31,000 \\\\ \\text{}-y+z \\text{}=4,000\\end{array}$\n\nStep 3. Add equation (2) to equation (3) and write the result as equation (3).\n\n$\\begin{array}{c}x+y+ \\text{}z=12,000 \\\\ \\text{}y+4z=31,000 \\\\ \\text{}5z \\text{}=35,000\\end{array}$\n\nStep 4. Solve for $z$ \nin equation (3). Back-substitute that value in equation (2) and solve for $y.$ \nThen, back-substitute the values for $z$ \nand $y$ \ninto equation (1) and solve for $x.$ \n\n$\\begin{array}{c} \\text{}5z=35,000 \\\\ \\text{}z=7,000 \\\\ \\\\ \\\\ \\text{}y+4(7,000)=31,000 \\\\ \\text{}y=3,000 \\\\ \\\\ \\\\ x+3,000+7,000=12,000 \\\\ \\text{}x=2,000\\end{array}$\n\nJordi invested \\$2,000 in a money-market fund, \\$3,000 in municipal bonds, and \\$7,000 in mutual funds."])</script><script>self.__next_f.push([1,"63:T58d,"])</script><script>self.__next_f.push([1,"First, we can multiply equation (1) by $−2$ \nand add it to equation (2).\n$\\begin{array}{c}\\underline{\\begin{array}{c}−4x−2y+6z=0 \\text{equation }(1) \\text{multiplied} \\text{by} −2 \\\\ \\text{​}\\text{​}\\text{​}\\text{​} 4x+2y−6z=0 \\text{} (2)\\end{array}} \\\\ 0=0\\end{array}$\n\nWe do not need to proceed any further. The result we get is an identity, $0=0,$ which tells us that this system has an infinite number of solutions. There are other ways to begin to solve this system, such as multiplying equation (3) by $−2,$ and adding it to equation (1). We then perform the same steps as above and find the same result, $0=0.$ \n\nWhen a system is dependent, we can find general expressions for the solutions. Adding equations (1) and (3), we have\n\n$\\begin{array}{c}\\underline{\\begin{array}{c}\\begin{array}{c} \\\\ 2x+y−3z=0\\end{array} \\\\ \\text{}x-y+z=0\\end{array}} \\\\ \\text{} 3x−2z=0\\end{array}$\n\nWe then solve the resulting equation for $z.$ \n\n$\\begin{array}{c}3x−2z=0 \\\\ \\text{}z=\\frac{3}{2}x\\end{array}$\n\nWe back-substitute the expression for $z$ \ninto one of the equations and solve for $y.$ \n\n$\\begin{array}{c}2x+y-3(\\frac{3}{2}x)=0 \\\\ 2x+y-\\frac{9}{2}x=0 \\\\ \\text{}y=\\frac{9}{2}x-2x \\\\ \\text{}y=\\frac{5}{2}x\\end{array}$\n\nSo the general solution is $(x,\\frac{5}{2}x,\\frac{3}{2}x).$ \nIn this solution, $x$ \ncan be any real number. The values of $y$ \nand $z$ \nare dependent on the value selected for $x.$"])</script><script>self.__next_f.push([1,"64:T47b,First, we write this as an augmented matrix.\n\n$[\\begin{array}{cc}2 \u0026 3 \\\\ 1 \u0026 −1\\end{array} \\text{ }| \\text{ }\\begin{array}{c}6 \\\\ \\frac{1}{2}\\end{array}]$\n\nWe want a 1 in row 1, column 1. This can be accomplished by interchanging row 1 and row 2.\n\n$R_{1}↔R_{2}\\to[\\begin{array}{ccc}1 \u0026 −1 \u0026 \\\\ 2 \u0026 3 \u0026 \\end{array}|\\begin{array}{cc} \u0026 \\frac{1}{2} \\\\ \u0026 6\\end{array}]$\n\nWe now have a 1 as the first entry in row 1, column 1. Now let’s obtain a 0 in row 2, column 1. This can be accomplished by multiplying row 1 by $−2,$ and then adding the result to row 2.\n$−2R_{1}+R_{2}=R_{2}\\to[\\begin{array}{ccc}1 \u0026 −1 \u0026 \\\\ 0 \u0026 5 \u0026 \\end{array}|\\begin{array}{cc} \u0026 \\frac{1}{2} \\\\ \u0026 5\\end{array}]$\n\nWe only have one more step, to multiply row 2 by $\\frac{1}{5}.$ \n\n$\\frac{1}{5}R_{2}=R_{2}\\to[\\begin{array}{ccc}1 \u0026 −1 \u0026 \\\\ 0 \u0026 1 \u0026 \\end{array}|\\begin{array}{cc} \u0026 \\frac{1}{2} \\\\ \u0026 1\\end{array}]$\n\nUse back-substitution. The second row of the matrix represents $y=1.$ Back-substitute $y=1$ into the first equation.\n\n$\\begin{array}{c}x-(1)=\\frac{1}{2} \\\\ \\text{        }x=\\frac{3}{2}\\end{array}$\n\nThe solution is the point $(\\frac{3}{2},1).$65:T659,"])</script><script>self.__next_f.push([1,"First, we write the augmented matrix.\n\n$[\\begin{array}{ccc}1 \u0026 -1 \u0026 1 \\\\ 2 \u0026 3 \u0026 -1 \\\\ 3 \u0026 -2 \u0026 -9\\end{array} \\text{  }| \\text{ }\\begin{array}{c}8 \\\\ -2 \\\\ 9\\end{array}]$\n\nNext, we perform row operations to obtain row-echelon form.\n\n$\\begin{array}{ccccccccccccccccccccccccccccccccccccccccc}-2R_{1}+R_{2}=R_{2}\\to[\\begin{array}{cccccc}1 \u0026 \u0026 -1 \u0026 \u0026 1 \u0026 \\\\ 0 \u0026 \u0026 5 \u0026 \u0026 -3 \u0026 \\\\ 3 \u0026 \u0026 -2 \u0026 \u0026 -9 \u0026 \\end{array}|\\begin{array}{cc} \u0026 8 \\\\ \u0026 -18 \\\\ \u0026 9\\end{array}] \u0026 \u0026 \u0026 \u0026 -3R_{1}+R_{3}=R_{3}\\to[\\begin{array}{cccccc}1 \u0026 \u0026 -1 \u0026 \u0026 1 \u0026 \\\\ 0 \u0026 \u0026 5 \u0026 \u0026 -3 \u0026 \\\\ 0 \u0026 \u0026 1 \u0026 \u0026 -12 \u0026 \\end{array}|\\begin{array}{cc} \u0026 8 \\\\ \u0026 -18 \\\\ \u0026 -15\\end{array}]\\end{array}$\n\nThe easiest way to obtain a 1 in row 2, column 2 is to interchange $R_{2}$ and $R_{3}.$ \n\n$\\text{Interchange} R_{2} \\text{and} R_{3}\\to[\\begin{array}{ccccccc}1 \u0026 \u0026 −1 \u0026 \u0026 1 \u0026 \u0026 8 \\\\ 0 \u0026 \u0026 1 \u0026 \u0026 −12 \u0026 \u0026 −15 \\\\ 0 \u0026 \u0026 5 \u0026 \u0026 −3 \u0026 \u0026 −18\\end{array}]$\n\nThen\n\n$\\begin{array}{ccccccccccccccccccccccccccccccccccccccccc} \\\\ \\begin{array}{ccccccccccccccccccccccccccccccccccccccccc}−5R_{2}+R_{3}=R_{3}\\to[\\begin{array}{cccccc}1 \u0026 \u0026 −1 \u0026 \u0026 1 \u0026 \\\\ 0 \u0026 \u0026 1 \u0026 \u0026 −12 \u0026 \\\\ 0 \u0026 \u0026 0 \u0026 \u0026 57 \u0026 \\end{array}|\\begin{array}{cc} \u0026 8 \\\\ \u0026 −15 \\\\ \u0026 57\\end{array}] \u0026 \u0026 \u0026 \u0026 -\\frac{1}{57}R_{3}=R_{3}\\to[\\begin{array}{cccccc}1 \u0026 \u0026 −1 \u0026 \u0026 1 \u0026 \\\\ 0 \u0026 \u0026 1 \u0026 \u0026 −12 \u0026 \\\\ 0 \u0026 \u0026 0 \u0026 \u0026 1 \u0026 \\end{array}|\\begin{array}{cc} \u0026 8 \\\\ \u0026 −15 \\\\ \u0026 1\\end{array}]\\end{array}\\end{array}$\n\nThe last matrix represents the equivalent system.\n\n$\\begin{array}{c}\\text{}x-y+z=8 \\\\ \\text{  }y-12z=−15 \\\\ \\text{            }z=1\\end{array}$\n\nUsing back-substitution, we obtain the solution as $(4,−3,1).$"])</script><script>self.__next_f.push([1,"66:T71b,"])</script><script>self.__next_f.push([1,"Write the augmented matrix.\n\n$[\\begin{array}{ccc}−1 \u0026 −2 \u0026 1 \\\\ 2 \u0026 3 \u0026 0 \\\\ 0 \u0026 1 \u0026 −2\\end{array} \\text{ }| \\text{ }\\begin{array}{c}−1 \\\\ 2 \\\\ 0\\end{array}]$\n\nFirst, multiply row 1 by $−1$ to get a 1 in row 1, column 1. Then, perform row operations to obtain row-echelon form.\n$-R_{1}\\to[\\begin{array}{ccc}1 \u0026 2 \u0026 −1 \\\\ 2 \u0026 3 \u0026 0 \\\\ 0 \u0026 1 \u0026 −2\\end{array} \\text{ }| \\text{ }\\begin{array}{c}1 \\\\ 2 \\\\ 0\\end{array}]$\n$R_{2}↔R_{3}\\to[\\begin{array}{ccccc}1 \u0026 \u0026 2 \u0026 \u0026 -1 \\\\ 0 \u0026 \u0026 1 \u0026 \u0026 -2 \\\\ 2 \u0026 \u0026 3 \u0026 \u0026 0\\end{array} \\text{ }|\\begin{array}{cc} \u0026 1 \\\\ \u0026 0 \\\\ \u0026 2\\end{array}]$\n$−2R_{1}+R_{3}=R_{3}\\to[\\begin{array}{cccccc}1 \u0026 \u0026 2 \u0026 \u0026 −1 \u0026 \\\\ 0 \u0026 \u0026 1 \u0026 \u0026 −2 \u0026 \\\\ 0 \u0026 \u0026 −1 \u0026 \u0026 2 \u0026 \\end{array}|\\begin{array}{cc} \u0026 1 \\\\ \u0026 0 \\\\ \u0026 0\\end{array}]$\n$R_{2}+R_{3}=R_{3}\\to[\\begin{array}{cccccc}1 \u0026 \u0026 2 \u0026 \u0026 −1 \u0026 \\\\ 0 \u0026 \u0026 1 \u0026 \u0026 −2 \u0026 \\\\ 0 \u0026 \u0026 0 \u0026 \u0026 0 \u0026 \\end{array}|\\begin{array}{cc} \u0026 1 \\\\ \u0026 1 \\\\ \u0026 0\\end{array}]$\n\nThe last matrix represents the following system.\n\n$\\begin{array}{c}\\text{}x+2y-z=1 \\\\ \\text{       }y-2z=0 \\\\ \\text{              }0=0\\end{array}$\n\nWe see by the identity $0=0$ that this is a dependent system with an infinite number of solutions. We then find the generic solution. By solving the second equation for $y$ and substituting it into the first equation we can solve for $z$ in terms of $x.$ \n\n$\\begin{array}{c}x+2y-z=1 \\\\ \\text{                 }y=2z \\\\ \\\\ x+2(2z)-z=1 \\\\ \\text{          }x+3z=1 \\\\ \\text{                 }z=\\frac{1-x}{3}\\end{array}$\n\nNow we substitute the expression for $z$ into the second equation to solve for $y$ in terms of $x.$ \n$\\begin{array}{c}y-2z=0 \\\\ z=\\frac{1-x}{3} \\\\ \\\\ y-2(\\frac{1-x}{3})=0 \\\\ y=\\frac{2-2x}{3}\\end{array}$\n\nThe generic solution is $(x,\\frac{2−2x}{3},\\frac{1-x}{3}).$"])</script><script>self.__next_f.push([1,"67:T7f5,"])</script><script>self.__next_f.push([1,"We have a system of three equations in three variables. Let $x$ be the amount invested at 5% interest, let $y$ be the amount invested at 8% interest, and let $z$ be the amount invested at 9% interest. Thus,\n\n$\\begin{array}{c}\\text{                    }x+y+z=10,000 \\\\ 0.05x+0.08y+0.09z=770 \\\\ \\text{                        }2x-z=0\\end{array}$\n\nAs a matrix, we have\n\n$[\\begin{array}{ccc}1 \u0026 1 \u0026 1 \\\\ 0.05 \u0026 0.08 \u0026 0.09 \\\\ 2 \u0026 0 \u0026 −1\\end{array} \\text{ }| \\text{ }\\begin{array}{c}10,000 \\\\ 770 \\\\ 0\\end{array}]$\n\nNow, we perform Gaussian elimination to achieve row-echelon form.\n\n$\\begin{array}{ccccccccccccccccccc}\\begin{array}{ccccccccccccccccccc} \\\\ −0.05R_{1}+R_{2}=R_{2}\\to[\\begin{array}{cccccc}1 \u0026 \u0026 1 \u0026 \u0026 1 \u0026 \\\\ 0 \u0026 \u0026 0.03 \u0026 \u0026 0.04 \u0026 \\\\ 2 \u0026 \u0026 0 \u0026 \u0026 −1 \u0026 \\end{array}|\\begin{array}{cc} \u0026 10,000 \\\\ \u0026 270 \\\\ \u0026 0\\end{array}]\\end{array} \\\\ −2R_{1}+R_{3}=R_{3}\\to[\\begin{array}{cccccc}1 \u0026 \u0026 1 \u0026 \u0026 1 \u0026 \\\\ 0 \u0026 \u0026 0.03 \u0026 \u0026 0.04 \u0026 \\\\ 0 \u0026 \u0026 −2 \u0026 \u0026 −3 \u0026 \\end{array}|\\begin{array}{cc} \u0026 10,000 \\\\ \u0026 270 \\\\ \u0026 −20,000\\end{array}] \\\\ \\frac{1}{0.03}R_{2}=R_{2}\\to[\\begin{array}{cccccc}0 \u0026 \u0026 1 \u0026 \u0026 1 \u0026 \\\\ 0 \u0026 \u0026 1 \u0026 \u0026 \\frac{4}{3} \u0026 \\\\ 0 \u0026 \u0026 −2 \u0026 \u0026 −3 \u0026 \\end{array}|\\begin{array}{cc} \u0026 10,000 \\\\ \u0026 9,000 \\\\ \u0026 −20,000\\end{array}] \\\\ 2R_{2}+R_{3}=R_{3}\\to[\\begin{array}{cccccc}1 \u0026 \u0026 1 \u0026 \u0026 1 \u0026 \\\\ 0 \u0026 \u0026 1 \u0026 \u0026 \\frac{4}{3} \u0026 \\\\ 0 \u0026 \u0026 0 \u0026 \u0026 -\\frac{1}{3} \u0026 \\end{array}|\\begin{array}{cc} \u0026 10,000 \\\\ \u0026 9,000 \\\\ \u0026 −2,000\\end{array}]\\end{array}$\n\nThe third row tells us $-\\frac{1}{3}z=−2,000;$ thus $z=6,000.$ \n\nThe second row tells us $y+\\frac{4}{3}z=9,000.$ Substituting $z=6,000,$ we get\n$\\begin{array}{c}y+\\frac{4}{3}(6,000)=9,000 \\\\ y+8,000=9,000 \\\\ y=1,000\\end{array}$\n\nThe first row tells us $x+y+z=10,000.$ Substituting $y=1,000$ and $z=6,000,$ we get\n$\\begin{array}{c}x+1,000+6,000=10,000 \\\\ \\text{                             }x=3,000\\end{array}$\n\nThe answer is \\$3,000 invested at 5% interest, \\$1,000 invested at 8%, and \\$6,000 invested at 9% interest."])</script><script>self.__next_f.push([1,"68:T6f9,"])</script><script>self.__next_f.push([1,"For this method, we multiply $A$ by a matrix containing unknown constants and set it equal to the identity.\n\n$[\\begin{array}{cc}1 \u0026 −2 \\\\ 2 \u0026 −3\\end{array}] \\text{  }[\\begin{array}{cc}a \u0026 b \\\\ c \u0026 d\\end{array}]=[\\begin{array}{cc}1 \u0026 0 \\\\ 0 \u0026 1\\end{array}]$\n\nFind the product of the two matrices on the left side of the equal sign.\n\n$[\\begin{array}{cc}1 \u0026 −2 \\\\ 2 \u0026 −3\\end{array}] \\text{  }[\\begin{array}{cc}a \u0026 b \\\\ c \u0026 d\\end{array}]=[\\begin{array}{cc}1a−2c \u0026 1b−2d \\\\ 2a−3c \u0026 2b−3d\\end{array}]$\n\nNext, set up a system of equations with the entry in row 1, column 1 of the new matrix equal to the first entry of the identity, 1. Set the entry in row 2, column 1 of the new matrix equal to the corresponding entry of the identity, which is 0.\n$\\begin{array}{c}1a−2c=1 \\text{   }R_{1} \\\\ 2a−3c=0 \\text{   }R_{2}\\end{array}$\n\nUsing row operations, multiply and add as follows: $(−2)R_{1}+R_{2}\\toR_{2}.$ Add the equations, and solve for $c.$ \n\n$\\begin{array}{c}1a-2c=1 \\\\ 0+1c=-2 \\\\ c=-2\\end{array}$\n\nBack-substitute to solve for $a.$ \n\n$\\begin{array}{c}a−2(−2)=1 \\\\ a+4=1 \\\\ a=−3\\end{array}$\n\nWrite another system of equations setting the entry in row 1, column 2 of the new matrix equal to the corresponding entry of the identity, 0. Set the entry in row 2, column 2 equal to the corresponding entry of the identity.\n\n$\\begin{array}{cc}1b−2d=0 \u0026 R_{1} \\\\ 2b−3d=1 \u0026 R_{2}\\end{array}$\n\nUsing row operations, multiply and add as follows: $(−2)R_{1}+R_{2}=R_{2}.$ Add the two equations and solve for $d.$ \n\n$\\begin{array}{c}1b−2d=0 \\\\ \\frac{0+1d=1}{ d=1} \\\\ \\end{array}$\n\nOnce more, back-substitute and solve for $b.$ \n\n$\\begin{array}{c}b−2(1)=0 \\\\ b−2=0 \\\\ b=2\\end{array}$\n$A^{−1}=[\\begin{array}{ccc}−3 \u0026 \u0026 2 \\\\ −2 \u0026 \u0026 1\\end{array}]$"])</script><script>self.__next_f.push([1,"69:T5df,"])</script><script>self.__next_f.push([1,"Write the system in terms of a coefficient matrix, a variable matrix, and a constant matrix.\n\n$A=[\\begin{array}{cc}3 \u0026 8 \\\\ 4 \u0026 11\\end{array}],X=[\\begin{array}{c}x \\\\ y\\end{array}],B=[\\begin{array}{c}5 \\\\ 7\\end{array}]$\n\nThen\n\n$[\\begin{array}{cc}3 \u0026 8 \\\\ 4 \u0026 11\\end{array}] \\text{  }[\\begin{array}{c}x \\\\ y\\end{array}]=[\\begin{array}{c}5 \\\\ 7\\end{array}]$\n\nFirst, we need to calculate $A^{−1}.$ Using the formula to calculate the inverse of a 2 by 2 matrix, we have:\n\n$\\begin{array}{ccc}A^{−1}=\\frac{1}{ad-bc}[\\begin{array}{cc}d \u0026 -b \\\\ -c \u0026 a\\end{array}] \\\\ \\text{     }=\\frac{1}{3(11)−8(4)}[\\begin{array}{cc}11 \u0026 −8 \\\\ −4 \u0026 3\\end{array}] \\\\ \\text{     }=\\frac{1}{1}[\\begin{array}{cc}11 \u0026 −8 \\\\ −4 \u0026 3\\end{array}]\\end{array}$\n\nSo,\n\n$A^{−1}=[\\begin{array}{cc}11 \u0026 −8 \\\\ −4 \u0026 \\text{​}\\text{​} 3\\end{array}]$\n\nNow we are ready to solve. Multiply both sides of the equation by $A^{−1}.$ \n\n$\\begin{array}{ccccccc} (A^{−1})AX=(A^{−1})B \\\\ [\\begin{array}{cc}11 \u0026 −8 \\\\ −4 \u0026 3\\end{array}] \\text{  }[\\begin{array}{cc}3 \u0026 8 \\\\ 4 \u0026 11\\end{array}] \\text{  }[\\begin{array}{c}x \\\\ y\\end{array}]=[\\begin{array}{cc}11 \u0026 −8 \\\\ −4 \u0026 3\\end{array}] \\text{  }[\\begin{array}{c}5 \\\\ 7\\end{array}] \\\\ [\\begin{array}{cc}1 \u0026 0 \\\\ 0 \u0026 1\\end{array}] \\text{  }[\\begin{array}{c}x \\\\ y\\end{array}]=[\\begin{array}{c}11(5)+(−8)7 \\\\ −4(5)+3(7)\\end{array}] \\\\ [\\begin{array}{c}x \\\\ y\\end{array}]=[\\begin{array}{c}−1 \\\\ 1\\end{array}]\\end{array}$\n\nThe solution is $(−1,1).$"])</script><script>self.__next_f.push([1,"6a:Ta93,"])</script><script>self.__next_f.push([1,"Write the equation $AX=B.$ \n\n$[\\begin{array}{ccc}5 \u0026 15 \u0026 56 \\\\ −4 \u0026 −11 \u0026 −41 \\\\ −1 \u0026 −3 \u0026 −11\\end{array
