,3.0kJ/(kg·ºC), and is at a uniform initial temperature of 4.0°C4.0°C. The plate is at the same temperature and has a mass of 0.24 kg and a specific heat of 0.90kJ/(kg·ºC)0.90kJ/(kg·ºC). What is the specific heat of the console?58:T55f,Let’s stop ignoring the greenhouse effect and incorporate it into the previous problem in a very rough way. Assume the atmosphere is a single layer, a spherical shell around Earth, with an emissivity e=0.77e=0.77 (chosen simply to give the right answer) at infrared wavelengths emitted by Earth and by the atmosphere. However, the atmosphere is transparent to the Sun’s radiation (that is, assume the radiation is at visible wavelengths with no infrared), so the Sun’s radiation reaches the surface. The greenhouse effect comes from the difference between the atmosphere’s transmission of visible light and its rather strong absorption of infrared. Note that the atmosphere’s radius is not significantly different from Earth’s, but since the atmosphere is a layer above Earth, it emits radiation both upward and downward, so it has twice Earth’s area. There are three radiative energy transfers in this problem: solar radiation absorbed by Earth’s surface; infrared radiation from the surface, which is absorbed by the atmosphere according to its emissivity; and infrared radiation from the atmosphere, half of which is absorbed by Earth and half of which goes out into space. Apply the method of the previous problem to get an equation for Earth’s surface and one for the atmosphere, and solve them for the two unknown temperatures, surface and atmosphere.59:T440,A Carnot engine employs 1.5 mol of nitrogen gas as a working substance, which is considered as an ideal diatomic gas with γ=7/5γ=7/5 at the working temperatures of the engine. The Carnot cycle goes in the cycle ABCDA with AB being an isothermal expansion. The volume at points A and C of the cycle are 5.0×10−3m35.0×10−3m3 and 0.15 m3, respectively. The engine operates between two thermal baths of temperature 500 K and 300 K. (a) Find the values of volume at B and D. (b) How much heat is absorbed by the gas in the AB isothermal expansion? (c) How much work is done by the gas in the AB isothermal expansion? (d) How much heat is given up by the gas in the CD isothermal compression? (e) How much work is done by the gas in the CD isothermal compression? (f) How much work is done by the gas in the BC adiabatic expansion? (g) How much work is done by the gas in the DA adiabatic compression? (h) Find the value of efficiency of the engine based on the net work and heat input. Compare this value to the efficiency of a Carnot engine based on the temperatures of the two baths.5a:T53c,An ideal diesel cycle is shown below. This cycle consists of five strokes. In this case, only air is drawn into the chamber during the intake stroke OA. The air is then compressed adiabatically from state A to state B, raising its temperature high enough so that when fuel is added during the power stroke BC, it igni"])</script><script>self.__next_f.push([1,"tes. After ignition ends at C, there is a further adiabatic power stroke CD. Finally, there is an exhaust at constant volume as the pressure drops from pDpD to pApA, followed by a further exhaust when the piston compresses the chamber volume to zero. (a) Use W=Q1−Q2W=Q1−Q2, Q1=nCp(TC−TB)Q1=nCp(TC−TB), and Q2=nCv(TD−TA)Q2=nCv(TD−TA) to show that e=WQ1=1−TD−TAγ(TC−TB)e=WQ1=1−TD−TAγ(TC−TB). (b) Use the fact that A→BA→B and C→DC→D are adiabatic to show that e=1−1γ(VCVD)γ−(VBVA)γ(VCVD)−(VBVA)e=1−1γ(VCVD)γ−(VBVA)γ(VCVD)−(VBVA). (c) Since there is no preignition (remember, the chamber does not contain any fuel during the compression), the compression ratio can be larger than that for a gasoline engine. Typically, VA/VB=15andVD/VC=5VA/VB=15andVD/VC=5. For these values and γ=1.4,γ=1.4, show that ε=0.56ε=0.56, or an efficiency of 56%56%. Diesel engines actually operate at an efficiency of about 30%to35%30%to35% compared with 25%to30%25%to30% for gasoline engines."])</script><script>self.__next_f.push([1,"51:[\"$\",\"div\",null,{\"className\":\"mt-4 print:hidden\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"text-sm font-semibold text-gray-900 dark:text-gray-100 mb-1\",\"children\":\"Cite this source\"}],[\"$\",\"$L56\",null,{\"source\":{\"slug\":\"openstax-university-physics-volume-2\",\"title\":\"University Physics Volume 2\",\"publisher\":\"OpenStax — Rice University\",\"year\":2016,\"description\":\"Calculus-based physics by Samuel J. Ling, Jeff Sanny, William Moebs. Volume 2 covers thermodynamics, electricity, magnetism. Continues University Physics Volume 1.\",\"category\":\"science\",\"questionCount\":608,\"bankCount\":16,\"topicCount\":16,\"license\":\"CC-BY-4.0\",\"sourceUrl\":\"https://openstax.org/details/books/university-physics-volume-2\",\"authors\":[\"Samuel J. Ling\",\"Jeff Sanny\",\"William Moebs\",\"et al.\"],\"importedAt\":\"2026-05-04\",\"notes\":\"Imported from OpenStax archive API. Self-check + review questions paired with answers from chapter end-of-book solutions.\",\"banks\":[{\"questions\":[{\"id\":\"openstax-university-physics-volume-2-ch1-fs-id1170902196976\",\"prompt\":\"What is the percent error of thinking the melting point of tungsten is 3695°C3695°C instead of the correct value of 3695 K?\",\"options\":[],\"correctIndex\":-1,\"correctText\":[\"103. 7.39 % 7.39 %\"],\"correctExpression\":\"103. 7.39 % 7.39 %\",\"hints\":[\"Try working through the problem step-by-step before checking the solution.\",\"Identify what the question is asking for and what you need to apply.\",\"When ready, reveal the solution to compare your work.\"],\"solution\":\"103. 7.39 % 7.39 %\",\"difficulty\":\"medium\",\"type\":\"free-response\",\"tags\":[\"expert-authored\",\"free-response\",\"source:openstax-university-physics-volume-2\"]},{\"id\":\"openstax-university-physics-volume-2-ch1-fs-id1170902225394\",\"prompt\":\"How much stress is created in a steel beam if its temperature changes from –15°
